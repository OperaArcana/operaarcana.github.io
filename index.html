o ad un saltello rapido che lo metta in salvo. Una vastità di innocenza dentro quelle due enormi mandorle nere disarmanti e disarmate. Lo fissano dentro le pupille, come a chiedere &quot;Chi sei?&quot;, &quot;Devo avere paura di te?&quot;, &quot;Eppure mi incuriosisce la tua presenza...sembri un essere sacro&quot;. Nel suo stare a contemplare quel corpo perfetto e agile che mantiene in quella immobilità vibrante un principio di corsa gli scende una lacrima e lo commuove l&#x27;inconsapevolezza che quel giovane animale ha della propria perfetta regalità. Della propria indifesa e fragile bellezza. Muove un passo e le zampe agili volano lontano, nel bosco che le proteggerà.</p><p class=int>4. I miei Sargassi</p><p class=st>Lì io sono solo una donna che nessuno conosce. Lì mi calma la vastità infinita lungo la quale cielo e acqua si incontrano.</p>"}, {"id": "t-no-tutti-nessuno-margherita-manzini-docx-oss", "g": 0, "autore": "Margherita M.", "titolo": "La rocambolesca storia della mia ossessione per…", "apertura": false, "separato": true, "arrivo": "2026-10-15T23:33", "incipit": "Io stavo per cambiare definitivamente il mio modo di guardare le cose e non lo sapevo, mio padre ascoltava a v", "html": "<p class=int>La rocambolesca storia della mia ossessione per...</p><p class=st>Io stavo per cambiare definitivamente il mio modo di guardare le cose e non lo sapevo, mio padre ascoltava a volte una di quelle audiocassette o forse c&#x27;erano già i CD, non ricordo... ricordo che avevo 12 anni e imparai a memoria La guerra di Piero poi diventò come una malattia, volevo conoscere tutti i testi, le melodie, le parole anche delle canzoni in genovese... ricordo un CD...il primo, si chiamava &quot;De Andrè da Genova&quot; era uno di quei CD in cui la copertina ripiegata aveva all&#x27;interno tutti i testi delle canzoni. Quella fu una delle mie prime basi di studio assiduo e costante dopo Don Raffae&#x27;, Creuza de mä, Spoon River...ricordo che quelle canzoni mi mostrarono da allora e per sempre la mia posizione nel mondo e verso il mondo, anche se ancora non capivo, ma sapevo che tutto quello mi apparteneva profondamente mi parlava e prevedeva tante cose che sarebbero state e che già erano molto, molto in profondità. Amare disperatamente A. Che non mi amava ascoltando per pomeriggi interi Hotel Supramonte o Verranno a chiederti del nostro amore giorni disperati e fortissimi che hanno lasciato un segno indelebile. Poi, dopo molti anni, dopo tutti i testi andati a memoria, dopo tutti i libri letti, dopo tutti i documentari visti io chiusi tutti quei sogni in un cassetto e ascoltare quella musica diventò troppo forte, l&#x27;avevo troppo amata, mi ci ero troppo avvicinata. Quel cassetto contiene una delle parti più dolorose e preziose della mia vita e lo riapro solo ogni tanto quando ho bisogno di sentire qualche antica ferita.</p>"}, {"id": "t-e-mat-uno-tutti-nessuno-maria-luisa-docx", "g": 0, "autore": "Maria Luisa", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-20T15:24", "incipit": "Ontologicamente al di là della normale esperienza umana; oggetto di trascendenza, di venerazione…", "html": "<p class=int>SACRO</p><p class=st>Ontologicamente al di là della normale esperienza umana; oggetto di trascendenza, di venerazione. Veicolo di ritualità. Imprescindibile; da proteggere e tutelare in qualsivoglia circostanza; la mancata tutela comporterebbe uno stravolgimento dei valori appartenenti a tutto ciò che a esso è connesso e da esso discende.</p><p class=int>PER PARLARE DI ME BISOGNA PRIMA PARLARE DI</p><p class=st>Per parlare di me bisogna prima parlare di Villaga. Villaga è un paese nel basso vicentino, fra i Colli Berici e i Colli Euganei, ma per la mia famiglia, e per innumerevoli persone che ci gravitano intorno, “Villaga” è un tutto per la parte, una sineddoche che indica la nostra casa. Più che una casa: un luogo dell’anima. Villaga ha una storia molto antica di cui ammetto di avere una conoscenza sommaria. So che è stata un ospedale militare durante la guerra (quale? la prima? credo la prima...); so che è stata una fattoria. I miei genitori l’hanno comprata alla fine degli anni ottanta in forma di rudere, e l’hanno ristrutturata per anni. Io ci sono nata e cresciuta. E’ Casa. Ma è anche come se fosse una persona. Una grande entità. Le persone che fanno parte della mia vita non mi conoscono davvero finché non vedono - vivono - Villaga. E dopo che l’hanno vissuta, capiscono. E hanno presto bisogno di tornarci. Villaga è stata il luogo di ogni età della mia vita, mi ha vista in ogni piccolo passaggio, da neonata a donna. E’ dove mi sento intera perché sento tutte le me, tutte insieme.</p><p class=st>Per parlare di me bisogna prima parlare di Cino. Cino è un leone di peluche (Cino il Leoncino) che dorme con me da quando sono nata. Non sono sicura della sua provenienza (ho un vago ricordo di qualcuno che mi dice che è stato in origine regalato a mio fratello da mio zio Erik, ma non ho mai davvero preso in considerazione questo pensiero). E’ piccolo, molto arancione e buffo. Non è pieno o ciccioso: è piuttosto vuoto, morbido, e contiene tante piccole palline che lo rendono multiforme, adattabile. Non l’ho mai lavato quindi immagino sia uno spaventoso ricettacolo di germi e batteri. Ha per me un valore incommensurabile; nonostante ciò:</p><p>l’ho dimenticato in Sicilia quando avevo circa 10 anni e me l’hanno dovuto rispedire</p><p>sempre in Sicilia quando avevo 17 anni, l’ho lasciato appoggiato a un abat-jour e gli si è bruciata una zampa</p><p>a gennaio 2021 l’ho perso e l’ho ritrovato a luglio 2022. Era rimasto nella borsa del lavoro a maglia, mai più toccata dopo un Natale sferruzzante.</p><p class=int>PANGOLINO</p><p class=st>Luisa non è mai stata una grande amante dell’arte figurativa. Ne apprezza la bellezza estetica, la maestria, talvolta l’ironia... ma è difficile che la emozioni. Non le fa molto onore ma è così. Si sente molto più affine alla musica, al teatro, alla danza. I corpi veri, lì, davanti a lei, che respirano, sudano, palpitano e creano qualcosa che prima non c’era. Quello sì.</p><p>L’arte figurativa le parla su un piano principalmente intellettuale.</p><p>Però c’è un’opera, un’opera fra tutte, che le stringe il cuore in una morsa ineluttabile ogni volta che le fa visita. Una vertigine, un capitombolo, un saltello dell’anima.</p><p>Quest’opera è Il Cristo Velato, scultura di marmo realizzata nel 1753 da Giuseppe Sanmartino e conservata nella cappella Sansevero a Napoli.</p><p>Il Cristo Velato è un Cristo sdraiato, morto, coperto da un sudario trasparente. Il sudario è fatto dello stesso marmo della statua. Luisa non sapeva che il marmo potesse essere trasparente, le sembra una contraddizione in termini. Eppure il velo del Cristo Velato della cappella Sansevero è fatto di marmo, ed è trasparente. Un essere umano ha steso un velo sul dolore di Cristo, sulla morte di Cristo, e un altro essere umano, secoli dopo, nel rappresentare quella morte coperta da quel velo ha compiuto un miracolo.  Luisa non è cattolica, non è credente, ma il velo del Cristo Velato è una delle cose più sacre che abbia mai visto. La sua bellezza pura, assoluta, inevitabile, la colpisce con la forza di una verità accecante. La fa sentire minuscola e immensa. Un essere umano.</p><p class=int>I MIEI SARGASSI</p><p>Lì, io sono intera perché sento tutte le me, tutte insieme.</p><p>E’ la mia casa. Ogni angolo in cui il mio sguardo si posa è una stratificazione di ricordi.</p><p>Mi fa appartenere a tutti i miei tempi. Tiene attaccati i miei pezzetti.</p>"}, {"id": "t-bolesca-storia-della-mia-ossessione-gdoc", "g": 0, "autore": "Maria Luisa", "titolo": "La rocambolesca storia della mia ossessione per…", "apertura": false, "separato": true, "arrivo": "2026-11-05T21:53", "incipit": "Io stavo per scriverci uno spettacolo. E’ che è sempre stato troppo “forma” e troppo poco “ciccia”, ma prima…", "html": "<p>Io stavo per scriverci uno spettacolo. E’ che è sempre stato troppo “forma” e troppo poco “ciccia”, ma prima o poi lo scriverò. Devo solo capire su cosa. Perché tanto ne ho di tutti i tipi. Di registrazioni. Sono ossessionata dalle registrazioni - nel senso di registrazioni audio.</p><p class=st>Tutto è iniziato registrando i deliri della nonna. La nonna ha avuto un tracollo nelle sue capacità di linguaggio che è passato da “parole esistenti che compongono frasi di senso compiuto” a “parole esistenti che compongono frasi senza senso” a “parole inventate” a un grammelot tutto suo misto a dei dolcissimi versi che erano canto e pianto allo stesso tempo.</p><p class=st>Ho iniziato a registrarla credo proprio con intenti artistici (seppur molto confusi): ne è testimone il fatto che alcune sue registrazioni le ho pure sbobinate.</p><p class=st>Questa spinta creativa non è mai riuscita a maturare definitivamente, ma in compenso la mia ossessione ha preso sempre più spazio.</p><p class=st>Registro molto spesso anche il nonno. Il nonno si esprime ancora con parole esistenti che compongono frasi di senso compiuto, e regala racconti della sua infanzia, della guerra, del baseball, dei primi anni in azienda. Tantissimi aneddoti, che spesso ripete come se te li stesse dicendo per la prima volta. Alcune sue registrazioni in effetti erano confluite in una bozza di progetto, nata in seno a un laboratorio teatrale in cui mi sono trovata a lavorare con un ragazzo che come me ha una grande passione per Milano, per Jannacci e per gli anziani.</p><p class=st>Il progetto si chiamava “Lascito”. In mezza giornata avevamo montato una ventina di minuti di traccia audio, e nella nostra performance finale la facevamo ascoltare ai nostri colleghi, mentre un po’ da lontano ci osservavano bere una Peroni da 66 su dei tavolini rossi col logo dell’Algida e chiacchierare dei cazzi nostri.</p><p class=st>Ci abbiamo creduto per un po’: abbiamo partecipato a un paio di bandi ma non siamo stati scelti, e come spesso accade quando non si viene scelti ai bandi, ci siamo persi.</p><p class=st>Registro momenti conviviali in famiglia. A Pasqua, a Natale, ai pranzi, alle cene. In due, in quattro, in sette, in venti. A un certo punto metto lì il telefono, girato, e via.</p><p class=st>Registro momenti a caso coi miei amici. Che giochiamo, che cantiamo, che chiacchieriamo.</p><p class=st>Registro persone che litigano. Conosciute o sconosciute.</p><p class=st>Registro delle teste di cazzo che dicono puttanate in metro.</p><p class=st>Registro mia cugina Rebecca quando inizia a raccontare qualcosa nel suo modo esilarante e irresistibile e penso che voglio aiutarla a diventare una grande stand up comedian.</p><p class=st>Registro Matteo quando inventa le canzoni. Quando straparla. Quando crea. Quando russa, per dimostrargli che non sono pazza.</p><p class=st>Registro le conversazioni difficili al telefono con Miles, quando dobbiamo sbrogliare un litigio. Se dopo la conversazione sento che qualcosa è rimasto in sospeso, la riascolto, e vado più a fondo con l’analisi. Registro anche quando gli faccio praticare l’italiano, così ho traccia dei suoi adorabili errori tipo “poggiamidì” (pomeriggio), “papière” (cartine) o “una melangia” (un misto).</p><p class=st>Mi registro il racconto di un sogno quando non ho tempo di scriverlo.</p><p class=st>Mi registro un ragionamento quando il cervello va più veloce della penna.</p><p class=st>Mi registro un’idea per una canzone su uno dei miei gatti.</p><p>Mi registro un moto di compassione nei miei stessi confronti, e a volte mi riascolto mesi dopo.</p><p class=st>Prima o poi mi beccherò una bella denuncia.</p>"}, {"id": "t-le-mat-uno-tutti-nessuno-mariagiulia-pdf", "g": 0, "autore": "Mariagiulia", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-14T13:11", "incipit": "Sacro. Sacro per me è un osso. Sacro è un osso che sta alla fine, al termine. Sacro è un osso perchè sacro…", "html": "<p class=int>SACRO</p><p>Sacro. Sacro per me è un osso. Sacro è un osso che sta alla fine, al termine. Sacro è un osso perchè sacro contiene e sacro struttura. Le ossa, si sa, sono dure, durevoli, dolenti. Le ossa contengono storia. Molta storia. Quasi tutta. Le ossa suonano. Una contro l’altra. Da sole. Suonano o fanno rumore perchè raccontano. Raccontano la storia. A volte La Storia, altre la storia. La tua, della tua mamma, del tuo nonno... Di chi è stato e di chi sarà. E’ per quello che l’osso sacro sta dove sta. Sta alla fine e nel mezzo. Alla fine delle vertebre e in mezzo alle natiche. Alla fine e in mezzo. Alla fine perchè così ci conforta, ci ricorda, ci saluta. Nel mezzo perchè tutte le cose sacre, come i miracoli, stanno un pò qui e un pò la. Non scelgono una posizione, un partito, una sponda, un’estetica, una filosofia. I miracoli accadono, così, nel mezzo, tra due stupende rotondità carnose. Sacro, tra l’altro, sta alla fine, perchè ha il compito, ingrato di questi tempi, di fare da contrappeso alla testa. Per lo più al peso della testa. Inizialmente il peso da contrapporre era prevalentemente materiale, ma ora è diventato terribilmente metaforico, perchè più che del peso del cranio, si parla di contrapporre il peso dei pensieri di un’umanità che poco guarda in alto e molto guarda in basso verso schermi e informazioni. Il sacro, osso, ci vorrebbe tutti a testa in su.</p><p class=int>PER PARLARE DI ME BISOGNA PRIMA PARLARE DI</p><p>Per parlare di me bisogna prima parlare di un quadro. Questo quadro non è mai stato mio, ma dei miei genitori. Questo quadro è sopravvissuto a 3 traslochi e non ha mai cambiato posto nella disposizione della casa: è sempre stato in cucina. Questo quadro, se volessimo analizzarlo in maniera tecnica, non è neanche un quadro. E’ una stampa. E’ una stampa di una famosa foto ritratto di Che Guevara, dove lui, giovane e ispirato, guarda davanti a se. Sotto quell’espressione rapita recita la frase “Bisogna essere duri senza mai perdere la tenerezza”. Frase scritta in lilla, su una foto in bianco e nero dai toni azzurrognoli. In casa mia questo quadro è sempre stato esibito dai miei genitori come motivo di orgoglio. Loro in quella foto, in quella affermazione, vedevano loro stessi, credo. Mio nonno invece ogni volta che ci passava accanto bofonchiava e passava oltre. Io da bambina cercavo motivi per cui esserne altrettanto orgogliosa, ma oltre a trovare una certa somiglianza tra la barba del Che e quella di mio padre, non sentivo lo stesso moto d’orgoglio che evidentemente prendeva i miei. Crescendo ho capito un pò meglio. Mi rimaneva però una domanda, quella che non ho mai osato fare, quella che ancora oggi che vedo quel quadro, un pò più sbiadito, ma ancora appeso è: “perchè in cucina?” Mi sono detta di essere stata cresciuta da due persone che le idee le cucinavano e che trattavano ciò in cui credere come si fa con le patate: cuocere bene finchè si inteneriscono e la durezza sta semplicemente nel continuare a farlo.</p><p class=st>Per parlare di me bisogna parlare del mio lavoro. Io di mestiere faccio la danzatrice. E’ tutta la vita che danzo. Vorrei tantissimo dire che chi mi ha influenzato sia stata Pina Bausch o Martha Graham, o Merce Cunnigham, famose e importanti figure della danza. La verità, però, è che l’ispirazione è arrivata dalle Spice Girls. Non da tutte. Precisamente da Mel C, la sporty spice. Di lei mi piacevano le tute, che poi effettivamente ho indossato per la maggior parte della mia vita e la coda di cavallo, che ti fa sentire in maniera amplificata tutti i movimenti che fai.</p><p class=int>PANGOLINO</p><p>Era seduta sul sedile dell’aereo, vicino al finestrino. Un viaggio di una tratta che conosceva benissimo. Una tratta che era diventata, fino ad ora, il suo destino. Un destino “tra le due B”, come amava definirlo lei, sentendosi creativa e interessante ogni volta che lo diceva. Quella volta lasciava una delle due B. con animo pesante. Dubbi e fatiche la accompagnavano. Una compagnia che lei sapeva sarebbe arrivata fino all’altra B. e di cui non era per niente contenta. Pensava e purtroppo non era stanca abbastanza per assopirsi. Pensava e per non pensare aveva aperto un libro che aveva con se. Nel libro aveva letto una frase: “se lo rivedessi oggi forse lo troverei kitsch o qualcosa del genere, ma sono sicura che lo amerei ancora molto”. Lo amerei ancora molto. Lo amerei ancora molto... Si era girata verso il finestrino, lo sguardo alle nuvole e al cielo blu. Aveva appoggiato la fronte contro la parete plasticosa dell’interno dell’aereo e lacrimoni grossi e intensi le erano sgorgati dal viso. In aereo sembra che niente esista. Nessuno ti sente. Tutti si annullano o almeno ci provano. Luogo ideale per piangere. Piangere qualcosa che non c’è più ma che si ama ancora molto. Forse è qualcosa che non ci piacerebbe più, ma lo ameremmo lo stesso. Erano dei jeans. Il gusto di una caramella. Un ragazzo che poi si è rivelato uno stronzo. Un film. Una canzone. Un’amica. Un pensiero. Un desiderio. Una poesia. Una parte di sé. Amerebbe ancora una parte di sé che non c’è più se la rivedesse oggi? Amerebbe ancora quella sé un pò kitsch? La sola possibilità di poter ancora amare, amare qualcosa o qualcuno che non rispecchiava più chi ora lei era, la commuoveva e la inteneriva. Una tenerezza che, come lei, andava spesso tra due punti. Prima e adesso. Un tempo e ora. Tra B e B. Tra qui e lì. E tra questo zompettare avanti e indietro aveva dimenticato di inserire la parola saltello nel suo racconto. Un racconto che, chissà, magari avrebbe continuato ad amare ancora molto, anche trovandolo un pò kitsch.</p><p class=int>I MIEI SARGASSI</p><p>Lì, io sono avvolta. Dalla poltrona. Dall’oscurità. Dalle parole di altri, dalla musica, dalle immagini. Lì sprofondo. Lì, non sono visibile. Lì, posso capire o distrarmi. Lì, io sono carta assorbente. Lì, io ci sono andata magari stanca o con tanti pensieri e ne ho lasciati andare un po’.</p>"}, {"id": "t-uno-matteo-salimbeni-draghi-senz-ali-doc", "g": 0, "autore": "Matteo", "titolo": "Draghi senz'ali", "apertura": true, "separato": false, "arrivo": "2026-10-15T17:12", "incipit": "Allora, io ho avuto un’idea, ma non so se è il caso... in realtà ne ho avute due, anche se la prima l’ho già…", "html": "<p>Allora, io ho avuto un’idea, ma non so se è il caso... in realtà ne ho avute due, anche se la prima l’ho già avuta tempo fa e sarebbe un racconto sui funghi, però appunto, un racconto sui funghi l’ho già fatto, quindi non mi sembra il caso né di rileggere quello né di farne un altro simile perché il primo mi piaceva e allora tanto vale che legga il primo,</p><p>però... avrebbe senso iniziare un percorso nuovo, lunedì sera, con un racconto vecchio?</p><p>La seconda idea mi piace, anche perché è una cosa di cui vado parlando a chiunque, a periodi, nel corso della vita, ogni tanto torna fuori, così a caso e sono le anguille.</p><p>Però... non sono convinto perché in realtà è da un bel po&#x27; che non penso alle anguille, mi sembra un po&#x27; forzato e poi ho anche pensato che tutti questi animali,  sembra una puntata di Super Quark... le anguille, i pangolini...</p><p>però, però... le anguille hanno una vita incredibile, ma pazzesca e tutte le volte che ci ripenso mi entusiasmo e allora prendo a raccontare di come nascono, muoiono, vivono e più che racconto sento crescere intorno a me una nuvola di sospetto che si addensa, si rabbuia, comincia a borbottare fino a esplodere “dai, Matte, basta... per favore... e poi? gli crescono anche le ali!, che sono? dei draghi, le anguille...”</p><p>e invece è vera, la storia delle anguille, è vera, uno si immagina solo dei biscioni che sguillano e invece...</p><p>Tipo il mio cugino, Luca, è una vita che mi spernacchia sulle anguille, ovvero dalla volta che gli ho raccontato del mar de’ Sargassi, di come si riproducono, e io raccontavo, mi accaloravo e lui mi guardava e pian piano gli si inarcavano le sopracciglia e gli si spostavano le labbra verso il basso come a dire “hummmmm, fino a un certo punto ti reggo il gioco, ma dopo un pochino...”</p><p>e quella volta un po&#x27; ci rimasi male perché mi sentivo impotente,</p><p>è sempre così quando parli delle anguille e lo capisco perché effettivamente hanno una vita che sembra inventata, a partire dalla fine e cioè da quando si riproducono perché si riproducono solo nel mar de’ Sargassi, laggiù, in fondo, dove c’è il triangolo delle Bermuda, solo lì, non si capisce perché, e non si capisce neanche come fanno a riprodursi, tecnicamente, e poi poco dopo nascono nuove anguille che fanno delle cose ancora più inverosimili, all’inizio sotto forma di larve, larve che si abbandonano alle correnti, per un anno, a volte anche per due tre anni, esseri minuscoli di pochi centimetri completamente in balia delle correnti e dei predatori che viaggiano per 5 600 chilometri e poi arrivano da noi, in Europa, cioè le anguille che vediamo nei nostri fiumi, alle foci dei laghi sono nate anni prima, si sono fatte 6000 chilometri e poi quando arrivano qui, da noi, a 6000 chilometri di distanza, cominciano a cambiare. Non solo crescono, ma si trasformano, tutta la loro vita è una trasformazione assurda, e infatti quando arrivano nei nostri fiumi, innanzitutto prima stavano nell’acqua salata e si adattano all’acqua dolce. ma non solo: prima erano neutre- nel senso che non avevano sesso e poi diventano o maschi o femmine, a seconda della situazione che snasano, cioè la larva arriva verso Comacchio, capisce non so tramite quale lacchezzo biologico che c’è una maggioranza di esemplari maschi in zona e dice “allora sarò una femmina” e diventa femmina.</p><p>Si chiama determinazione ambientale della specie</p><p>E non solo, durante quel viaggio leggendario, quando si erano affidate ciecamente alle correnti del Golfo, erano trasparenti, e ora che arrivano in Europa cambiano colore, cioè quando erano larve la luce del mare gli passava attraverso e loro si mischiavano ai riflessi dell’acqua, mentre ora si confondono con i colori dei nostri fiumi e diventano marroncine un po&#x27; gialle.</p><p>La prima anguilla che ho visto nella mia vita era proprio così, marroncina e l’ho vista- per uno strano scherzo del destino- in un laghetto artificiale che gestiva proprio mio cugino Luca, avevo tipo sette anni, e nella strada che conduceva al laghetto vidi quest’ombra che sgusciava nel fango.</p><p>Anche questa cosa è strepitosa: le anguille riflettono i panorami che attraversano, diventano i mondi che abitano. Lo fanno per convenienza, per la specie. E quando arrivano alle foci dei nostri laghetti artificiali e cominciano a farsi marroncine fanno anche un’altra cosa: si preparano a ripartire: non subito, sono appena arrivate... si preparano per anni, a volte per quindici anni e questa preparazione comporta il fatto di mangiare come delle pazze.</p><p>Per esempio i capitoni, le anguille femmina, da 0,3 0,4 grammi massimo, che è il loro peso a un anno di vita quando sbarcano da noi, arrivano a pesare anche più di tre chili, che è il loro peso a dieci anni, cioè diecimila volte di più, come se un neonato di 3 chili, da grande pesasse, 30 tonnellate.</p><p>R per arrivare a pesare il corrispettivo di 30 tonnellate mangiano larve, molluschi,  rane e accumulano una quantità mostruosa di grasso che gli serve per tornare a casa, nel mar de’ Sargassi per far zin zin con altre anguille e salvaguardare la specie.</p><p>Quindi l’anguilla per mandare avanti il mondo delle anguille deve tornare indietro, alle origini, in un posto che non ricorda, ma che conosce, cioè dove è nata, nell’immenso recinto sacro dove tutto comincia e tutto finisce.</p><p>E tutte le anguille lo fanno.</p><p>Tornano indietro.</p><p>Compiono di nuovo l’Odissea compiuta quando erano delle larve indifese di un grammo, però quando lo fanno la seconda volta sono una creatura piena di grasso  e a ragion veduta piena di grasso!, perché, prima di ripartire per il loro ultimo grande viaggio fanno un’altra cosa: atrofizzano l’apparato digerente, sì, da quando partono non mangiano più, è un fatto irrevocabile, non c’è verso di tornare indietro e allora partono, grasse, senza apparato digerente, e di notte viaggiano sul pelo dell’acqua, e di giorno si inabissano a migliaia di metri per sfuggire ai predatori e per viaggiare a quelle profondità hanno compiuto un altro cambiamento  ancora, le anguille non fanno altro che cambiare, uccidono una parte di loro, rinascono con un nuovo dettaglio, e in questo caso il dettaglio sono gli occhi, infatti si dice anguille cieche e si pensa che le anguille siano cieche, non è vero, quando sono larve e poi anche quando sono esemplari adulti hanno degli occhietti piccoli, ci vedono poco, ma ci vedono e si affidano all’olfatto, e ora, invece... ora... quando devono tornare a casa e scendere in fondo all’oceano gli occhi si ingrandiscono di quattro volte e diventano delle palle gigantesche in grado di carpire la poca luce negli abissi oceanici.</p><p>E così come gli occhi cambiano anche il colore, ancora una volta, cambia,  diventano ancora più scure, quasi bluastre, per confondersi nel mare. Sono delle mutaforme, cambiano però rimangono sempre anguille e questa capacità mimetica mi piace a tal punto che quando mi è venuto in mente “oh, potrei fare un racconto sulle anguille” e ho riletto un po&#x27; di cose sulle anguille e ho pensato: “forse ha senso fare un racconto sulle anguille con una forma anguillesca, cioè tenere uno stile riconoscibile di base, una specie di lungo monologo tutto d’un fiato senza punti con dei ritorni circolari tipo Thomas Bernhard  e ogni tanto aprire delle parentesi con un altro stile, cambiando, come fanno le anguille,tipo quando racconto del primo incontro con un’anguilla nel laghetto di mio cugino potrei mettere un pezzo a immagini, no, tipo Natale di Durrenmatt.</p><p class=st>Era Aprile. Avanzavo fra rigagnoli immobili. Il fango accoglieva le orme. Le congelava. Ferma la poltiglia. Muta la rena. Vidi un guizzo. Una lingua di terra. Scura. Un movimento simile a un grido. Un piccolo terremoto. Era un’anguilla.</p><p class=st>E poi andare avanti così, tipo quando parlo dell’arrivo delle anguille nel mediterraneo, ci metto un limerick che devo ancora scrivere e che parla di questa cosa. tipo</p><p class=int>Un’anguilla del Mar de’ Sargassi</p><p>Si trovò  un bel giorno al muson de’ Sassi</p><p>“Ma io sono una creatura degli abissi</p><p>cosa sono tutte queste apocalissi?”</p><p class=int>rimeggiò quell’anguilla del mar de’ Sargassi</p><p class=st>Insomma fare delle evoluzioni letterarie che trasmettano le rocambolesche evoluzioni delle anguille che l’uomo non è mai riuscito fino in fondo a capire, anche se le ha studiate in tutti i modi possibili...</p><p>Per secoli l’uomo si è continuato a porre mille domande senza risposta: ma dove si riproducono? ma come fanno? ma come fanno a riprodursi senza apparato riproduttivo?</p><p>Anche Freud era andato nei pazzi e gli era presa una furia e aveva sbudellato, scorticato, sezionato un mucchio d’anguille al grido di: “ma come fanno?”</p><p>È millenni che studiamo le anguille e soltanto da qualche decennio abbiamo capito che sviluppano l’apparato riproduttivo solo quando gli serve, ovvero poco prima di tornare nel mar de’ Sargassi, al tramonto dei loro giorni, quando capiscono che è l’ora di dare il là al più grande mistero fra tutti i loro misteri,  quel mistero che invece ancora ci sfugge, la riproduzione vera e propria.</p><p>L’uomo non sa come funziona,</p><p>Ha fatto simulazioni, ha provato a trasferire questo momento in cattività, un po&#x27; ci è riuscito, poi ha fallito...</p><p>L’unica cosa che noi umani sappiamo è che loro a un certo punto ripartono, fanno altri 5000 chilometri, seimila, poi arrivano, senza più un filo di grasso, esauste,  e si accoppiano.</p><p>E che quello è il loro ultimo atto di vita, cioè l’ultima cosa che fanno da anziane, prima di morire, è dare al mondo nuova linfa</p><p>Il culmine della loro vita è la fine della loro vita.</p><p>E qui mi piacerebbe scrivere tipo un pezzo misterioso alla Shirley Jackson, in bilico fra percezione e allucinazione.</p><p>Una specie di favola,</p><p>Una cosa che non sai se è vera però è vera però non sai rispetto a quali confini è vera.</p><p>Potrebbe essere una fantasia, potrebbe essere un delirio.</p><p>Mi piacerebbe tipo scrivere il finale di questo racconto in cui c’è questa protagonista che è una donna molto anziana, mooolto, che abita da sola con una figlia inspiegabilmente giovane, tipo di diciassette anni, e questa donna anziana da sempre vive in una grande palazzina liberty mezza diroccata e ogni tanto ha delle visioni, da sempre, e vede queste creature sfuggenti, nei muri, nell’edera, che più o meno sono la stessa creatura, ma sempre un po&#x27; diversa, una volta con una pinna, una volta con un ciuffo, prima verde, poi giallo, rosso, blu... e questa donna- facciamo finta si chiami Virginia- si domanda: “ma sto sognando...”... anzi... non se lo domanda lei, no, arriva a domandarselo il lettore e il lettore si chiede: “ma è un sogno di Virginia oppure è l’allucinazione di qualcuno, magari sua figlia, che sta sognando la madre che sogna delle creature cangianti misteriose dei draghi.</p><p>Dei draghi senza ali che prima di morire vanno ad accoppiarsi in un posto buio irraggiungibile, tipo la madia della cucina chiusa da anni perché le donne ci hanno impilato sopra troppe pentole.</p><p>E poi pfum, queste creature depongono una valanga di uova che poi danno alla luce migliaia di altre minuscole vite cangianti misteriose che escono dalla madia, e poi si spargono non si sa come ovunque, nelle fessure dei muri, nelle serrature, e il lettore, a quel punto, si domanda: ma sto leggendo o sto sognando?”</p><p>Ecco mi piacerebbe finirlo con una domanda di questo genere, il racconto.</p>"}, {"id": "t-ganozzi-opera-arcana-primo-incontro-docx", "g": 0, "autore": "Monica", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-20T22:00", "incipit": "Sacro e' per me il confine tra il mio essere ed il mondo in cui sento di resistere e manifestare.", "html": "<p class=int>SACRO</p><p>Sacro e&#x27; per me il confine tra il mio essere ed il mondo in cui sento di resistere e manifestare.</p><p>Sacro e&#x27; il punto in cui buio e luce si toccano</p><p class=int>PER PARLARE DI ME BISOGNA PRIMA PARLARE DI</p><p>Prima di parlare di me, bisogna parlare del Nulla,del vuoto dentro, di quella sensazione che solito sconforta, ma che a me tornava ideale per sparirci dentro.</p><p>Il Nulla cancella,vela,ingoia,annulla appunto ed il passaggio dal rimpiattarmi in quella dimensione e perdermi di vista e&#x27; stato inevitabile.</p><p>La Vita poi ha suonato le sue campane ed il dolore mi ha scovata.</p><p class=st>Prima di parlare di me bisogna parlare di Morgana.</p><p>Morgana era una splendida lupa nera,meticcia selvaggia. Era il cane di Alessandro con cui ho avuto una relazione non poco tormentata.</p><p>La nostra storia finisce presto e Morgana resta con me. In quel periodo aspettava dei cuccioli e questo evento fu fondamentale per distrarmi dal dolore per l&#x27;ennesimo fallimento.</p><p>Abbiamo camminato insieme per più di 17anni,attraverso gioie e dolori,difficoltà e cambiamenti necessari a trovare la strada giusta,fertile,luminosa.</p><p>Mi ha lasciato proprio quando il sentiero si e&#x27; manifestato.</p><p>Spesso però viene a trovarmi in sogno.</p><p class=int>I MIEI SARGASSI</p><p>Io sono salva quando entro nell&#x27;uliveto dei nonni dove ad ovest ho segnato un cerchio di pietre e proprio là, accendo un fuoco, mi siedo a terra vicino al suo calore e mi riaccendo.</p><p class=int>Pangolino non pervenuto.😁😁</p>"}, {"id": "t-suno-pietro-opera-arcana-12-ottobre-docx", "g": 0, "autore": "Pietro", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-15T18:19", "incipit": "Sacro: tutto ciò che ha il potere di mettere in connessione il mondo sensibile con l’oltremondano, con…", "html": "<p class=int>1. Sacro</p><p class=st>Sacro: tutto ciò che ha il potere di mettere in connessione il mondo sensibile con l’oltremondano, con divinità e spiriti, con morti e nascituri, con altre età del sé, con parti del sé che normalmente restano silenti. Può esserlo una capanna sudatoria, un ciondolo regalato da una nonna, una frase detta da un amico e rimuginata mille volte, il ricordo di un volto, il passaggio o il ritorno in un luogo, tutto ciò che ci permette di raggiungere un altrove.</p><p class=int>2. Per parlare di me bisogna prima parlare di...</p><p class=st>Bisogna prima parlare di un bambino giocondo che correva su e giù per la campagna, amico di tutti gli animali e di tutte le persone. Era un bambino piccolo piccolo, che quando aveva pochi anni cadde e che per questo rimase piccolo per tutta la vita. Ma viaggiò tanto. Veniva da un’isola povera e lontana e viaggiò per quasi tutto il mondo conosciuto. Si fece conoscere dalle persone perché voleva bene a tutti e di tutti cercava di conoscere i segreti, le gioie e le sofferenze. Ma più li conosceva e più capiva che c’erano storture da raddrizzare, ingiustizie da riparare, tante persone da amare e con cui lottare, ma anche delle città da distruggere, vecchie tradizioni da abbattere. La Storia però soffiava da un altro lato. Fu arrestato, della cella fu gettata via la chiave. Lui continuò a vivere, ad amare, a interrogarsi, a urlare e a scrivere. Rimase piccolo piccolo fino alla fine, ma nella mente di chi l’aveva conosciuto e nell’immaginazione di tanti che non l’avevano conosciuto crebbe e crebbe sempre di più, divenne gigantesco.</p><p class=st>Bisogna prima parlare di un cavallino a dondolo di legno massello, basso e tozzo ma dal profilo elegante, che non si sa dove sia nato, ma un giorno si ritrovò in un castello magico fatto di tante stanze, dove eroi, dame, fate e maghi creavano il mondo e le cose, gli davano i nomi e a volte le distruggevano. Il cavallino era il più fedele amico e compagno d’avventure degli eroi di quel tempo. Li accompagnava in tutte le imprese e una volta finì che in una battaglia la sua orecchia affilata per poco non ammazzò uno degli eroi. Ma l’eroe si salvò, fu premiato con una Coppa del Nonno e le avventure continuarono più furibonde di prima. Finché un giorno il cavallino sparì nel nulla insieme con tante altre magie e prodigi di quel castello. E come il castello stesso, che fu abbattuto e di cui fu lasciata in piedi solo la quinta, per tanti anni, e poi anche quella fu tirata giù.</p><p class=int>3. Pangolino</p><p class=st>La nostra città ha tanti ponti. Sono tutti belli, alcuni maestosi, più d’uno sfiora i mille anni di età. Tengono insieme la trama delle nostre strade congiungendo le due rive del fiume. Ma oggi dobbiamo rivolgere lo sguardo al più desolato, al più sacrificato, al meno attraente tra i nostri ponti, il Ponte di San Giusto. In altri termini, il viadotto sulla ferrovia. Un viadotto moderno, potrebbe dirsi quasi brutalista, con quei suoi guardrail inutili, spropositatamente alti e massicci per un ponte a due corsie, che misurerà sì e no dieci metri di larghezza per una cinquantina di metri di lunghezza; impreziosito soltanto, se così si può dire, da una breve scalinata di pietra che viene su da via Fratti e porta il raro e sfortunato pedone all’attraversamento del ponte.</p><p>Ecco, è quasi l’alba. Il nostro ragazzo ha appena superato gli ultimi gradini. Si porta nel mezzo del ponte. Si gira verso i binari. Con un piccolo saltello conquista una seduta precaria in cima al bordo del guardrail. Continua a guardare fisso il punto di fuga dei binari, dove comincia a stridere lenta qualche ruota arrugginita di treno merci. Sorge una pallida palla di fuoco da dietro la collina. Si fa sempre più grande, più luminosa. Il ragazzo socchiude gli occhi un momento. Non passa neanche un minuto. Salta giù e continua l’attraversamento. Mentre si allontana verso il viale alberato al di là del ponte, la palla comincia a salire e a farsi nuovamente pallida e piccina.</p><p class=int>4. I miei Sargassi</p><p class=st>Lì, io sono in pace col mondo. L’orizzonte è una linea lunga e curva, il blu e il celeste si accarezzano e le due superfici barbagliano. Dietro di me, la chiesetta di Santa Giulia e il leccio millenario vegliano su ulivi, uomini e gabbiani.</p>"}, {"id": "t-suno-pietro-opera-arcana-12-ottobre-docx-oss", "g": 0, "autore": "Pietro", "titolo": "La rocambolesca storia della mia ossessione per…", "apertura": false, "separato": true, "arrivo": "2026-10-15T18:19", "incipit": "Io stavo per avere una crisi di nervi. La classica crisi di nervi di un bambino di otto anni che sa che deve f", "html": "<p class=int>5. La rocambolesca storia della mia ossessione per...</p><p class=st>Io stavo per avere una crisi di nervi. La classica crisi di nervi di un bambino di otto anni che sa che deve fare i compiti ma non li vuole proprio fare. Stavo per scaraventare a terra il quadernino a righe di un centimetro appositamente acquistato.</p><p>Mia madre mi si sedette accanto, mi fece una carezza, prese il quadernino e lo aprì alla prima pagina, ancora intonsa. Mi fece scrivere la data: 1° agosto 1999. «E adesso pensa a una cosa che hai fatto oggi, una qualsiasi. E vediamo insieme come si può scrivere in poche righe».</p><p>Mia madre non è mai stata una mamma particolarmente premurosa o invadente per quanto riguarda compiti e altre incombenze scolastiche, e in generale non ha avuto nella mia infanzia un ruolo calmante. Ma immagino che in quella circostanza si sia mosso in lei il tipico istinto di madre che vede avvicinarsi da lontano, ma a passo sostenuto, le ultime settimane delle vacanze scolari, che spesso significano corsa al recupero dei compiti non svolti durante il resto dell’estate e conseguenti crisi, pianti, nervosismi, punizioni, ecc.</p><p>Fatto sta che quella volta il suo intervento tranquillizzante funzionò. La cosa successa durante la giornata, fu rievocata. Le cinque righe furono scritte, in bel corsivo, sulla prima pagina del quadernino. Il primo pensierino della fatidica estate 1999 era stato composto.</p><p>Non so dove sia finito quel quadernino, ma ne ricordo le righe bianche come se le avessi davanti agli occhi. Posso ricostruire con esattezza la data di redazione di quel primo pensierino perché in quello stesso agosto 1999 sarebbe nato mio cugino Lucas. Dunque per me doveva trattarsi dell’estate tra la terza e la quarta elementare. E doveva essere il 1° di agosto, perché il compito consisteva nello scrivere un pensierino al giorno di poche righe per tutto il mese di agosto.</p><p>Non ricordo cosa fosse successo esattamente quel giorno. Ma di quell’estate ricordo una lunga serie di avvenimenti.</p><p>Alcuni furono di per sé importanti, come appunto la nascita di mio cugino.</p><p>Altri eventi erano collegati a quelli più importanti, anche se si può supporre che non sarebbero finiti a occupare una porzione della mia corteccia cerebrale vita natural durante, se non li avessi dovuti rivivere nella redazione del pensierino quotidiano. È il caso, per esempio, dell’ostensione del cordone ombelicale di mio cugino nel corridoio della casa dove stavamo trascorrendo le vacanze: un rito macabro che aveva tanto emozionato (e forse anche un po’ inquietato) me e mia sorella Marta.</p><p>Infine, di quell’estate ricordo una serie considerevole di eventi che a dire il vero dell’evento non hanno nemmeno la parvenza: la gara al fotofinish delle lumache in un giorno di pioggia, l’inseguimento di un gambero di fiume intrufolatosi in casa, la mano sulla bilancia del venditore ambulante di cocomeri ad alterare lievemente il peso mentre mia madre entrava a prendere i soldi. Tutti fatti che senza l’intervento resuscitante del pensierino sarebbero stati probabilmente destinati a un più che meritato oblio.</p><p>Trascorsi buona parte di quell’agosto a cercare di individuare, nella infinita e ininterrotta sequenza dei fatti insignificanti che mi accadevano ogni giorno, quel fatto che seppur di pochissimo si elevava al di sopra dell’insignificanza di tutti gli altri, e dunque meritava di finire nel mio pensierino, per la soddisfazione della maestra e ad eterno vantaggio (o ingombro) della mia memoria.</p><p class=st>Mano a mano cominciai a prenderci gusto.</p><p>A fine agosto il quadernino era completo: non avevo saltato neanche un giorno.</p><p>Poco dopo scoprii che quei pensierini con la data in cima potevano essere scritti anche senza il limite di righe. E che qualcuno lo faceva per suo gusto, senza la supervisione o il compiacimento dei tutori dell’ordine scolastico. In quel caso i pensierini prendevano il nome di diario. Pensai di cimentarmi anch’io nell’impresa, per puro spirito di competizione: la soddisfazione per aver completato il compito dei lunghissimi trentun giorni costituiva una spinta quasi inarrestabile verso il raggiungimento di nuovi traguardi. Fino a quando sarei riuscito a continuare?</p><p class=st>Il problema è che quell’appuntamento quotidiano con la scrittura del diario, che per altri ragazzi avrebbe finito via via per rappresentare una piacevole o perlomeno confortante abitudine, un momento di sfogo, di consolazione o di riflessione interiore, per me avrebbe sempre conservato il gusto pungente della sfida. Ogni giorno mi domandavo se sarei riuscito a scrivere quelle cinque righe, se avrei avuto qualcosa da scrivere, se i fatti del giorno sarebbero stati all’altezza.</p><p>Raggiunsi la maturità, sia quella scolasticamente sancita dal superamento dell’esame di stato alla fine del secondo ciclo di istruzione, sia – ben più tardi – quella dell’ingresso nel consesso delle persone mutuamente riconoscentisi come socialmente adulte.</p><p>Eppure maturare non significò per me, come per molti ex adolescenti che per un certo periodo hanno scritto un diario, smettere di riportare i fatti insignificanti e imparare a distinguere ciò che vale la pena riportare, magari anche saltando un giorno di tanto in tanto, scrivendo di più quando succede qualcosa di notevole o che merita riflessione e di meno, o anche niente, quando non accade niente di davvero notevole.</p><p>No, la maturazione del pensierino consistette per me nel ribaltamento dell’imperativo: non più salvare qualcosa nel vasto mare dell’ordinario quotidiano per poterlo scrivere nel quadernino; ma scrivere nel quadernino tutto ciò che doveva essere salvato. E ciò che doveva essere salvato, o a cui almeno pensavo di dover riconoscere la facoltà del dubbio, comprendeva ogni giorno una fetta più ampia degli avvenimenti quotidiani. Qualsiasi cosa mi succedesse, anche tutto sommato stupida, come incontrare un amico per strada, bucare una gomma della bici o mangiare la prima pesca della stagione, andava assolutamente scritta. Avevo sviluppato una specie di FOMO da pensierino. E la sera potevo passare lunghi minuti a cercare di ricordarmi cos’era quella cosa che avevo fatto quel giorno, e che andava assolutamente scritta... era una cosa che avevo mangiato, una cosa che avevo fatto o una cosa che avevo visto fare a qualcuno?</p><p class=st>Sono appena tornato a casa da scuola. Oggi ho dato un compito ai ragazzi: scrivere un pensierino al giorno di minimo cinque e massimo dieci righe. Ogni giorno, per una settimana. Tra una settimana li leggeremo in classe.</p><p>Questa sera devo assolutamente ricordarmi di scrivere sul mio diario che ho dato questo compito ai ragazzi. È un evento importante della giornata.</p>"}, {"id": "t-at-uno-tutti-nessuno-sarah-perruccio-pdf", "g": 0, "autore": "Sarah", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-15T23:17", "incipit": "SACRO Aggettivo, si dice sacro ciò che è inviolabile. Ciò che è sacro resta com'è, non lo cambia il tempo, né…", "html": "<p>SACRO Aggettivo, si dice sacro ciò che è inviolabile. Ciò che è sacro resta com&#x27;è, non lo cambia il tempo, né gli interventi umani.</p><p class=st>Sacro è anche un osso, che quando si cade dai pattini può incrinarsi, infiammarsi e fare molto male.</p><p class=st>Sacro, per me, è il tempo solo mio in cui sentire e pensare senza influenze esterne, l’ascolto del mio corpo, del suo stato e dei suoi bisogni. Sacro è connettere anima, pensiero e corpo. Sacro è rispettare gli altri nella loro natura, persone e animali.</p><p class=st>Sacro è dire di no, di sì, abbandonarsi, fallire.</p><p class=st>Sacro è dire la propria storia a parole proprie. Impedire agli altri di raccontarci male o farcela scivolare addosso. Sacro è vivere ciò che ci capita con onestà e intensità, ma anche tiepidamente se è il caso. Sacra è la gentilezza che mi pare l’espressione più basica e semplice dell’amore. Sacre sembrano essere le cose piccole.</p><p class=int>NON Si PUò PARLARE DI ME SENZA PRIMA PARLARE DI</p><p class=st>Non si può parlare di me senza prima parlare della “fratellanza”, forse è un po’ barare ma non mi si può chiedere di scegliere. “A chi vuoi più bene?” mi pare tardi per queste domande. Scelgo di parlare di tre fratelli molto più grandi, come un curioso mostro tricefalo. Da loro sono stata cresciuta forse più che dai miei genitori.</p><p class=st>Stefano è simpatico e buono e furbetto e strambo. Con lui facevamo la nostra versione dei varietà tv anche se io avevo 5 anni e lui 20.</p><p class=st>Marco è premuroso, impulsivo, entusiasta. Lui mi portava a spasso e in viaggio e mi faceva conoscere i suoi amici e altre mille cose belle.</p><p class=st>Nick era quello più divertente, si scherzava sempre con lui e si faceva a botte per gioco. Se piangevo per qualche rimprovero era lui a consolarmi.</p><p class=st>Tutti diversi ma della stessa pasta. Buoni, di principio, alle volte un po’ stravaganti. Non si può parlare di me senza prima parlare di Vega, vorrei parlar d’altro ma non posso. Un piccolo cane tutto orecchie- e un po’ di pancetta- che non c’è più. Grande cacciatrice di mondezza, si esibiva in tripli carpiati per uno snack, seguiva i discorsi molto meglio di tante persone e si sapeva far rispettare. Ora una sua collega è qui sul mio divano ma Vega- che era pure una gelosona- si fa sentire dappertutto. La migliore amica di Tea si chiama proprio Vega. Il tratto di kajal intorno ai suoi occhi ora dipinge quelli della piccola Tea. Dacché la nuova quadrupede era tanto brava e ubbidiente ora sta raffinando l’arte del furto di briciole e del “sì sì lo so che mi hai chiamata... quando mi va torno”... e credo di sapere chi le sussurra, nelle sue orecchie ben proporzionate, queste belle idee.</p><p class=int>PANGOLINO</p><p class=st>Trovano parcheggio davanti al ristorante, guida la figlia piccola che ormai ha superato i 40 ma resta piccola per sempre, è chiaro. La panda del padre pure ha forse superato i 40 ma non di tanto, con l’anziano tutto dolorante in macchina e i limiti nei pressi dell’area pedonale. A fatica si mette in moto anche la sghemba macchina dei soccorsi. Il figlio grande- grosso e giuggiolone, pure lui piccolo per sempre- prende il carrellino dal portabagagli, vorrebbe aprirlo e regolare l’altezza delle manopole, vorrebbe davvero, ma anche stavolta non riesce a ricordare come fare. Scende la donna. Ha più senso pratico. Cerca di non innervosirsi pure se è sotto pressione e ha paura che il padre provi a scendere dall’auto mentre lei è ad armeggiare dietro, davanti al portabagagli. L’uomo non ce la fa e con la pazienza che ha dovuto imparare negli ultimi mesi, aspetta. Poi l’armata brancaleone riesce, il padre curvo guida il suo calesse fatto di ruotine e braccia metalliche e con un saltello sconsiderato, scende dal marciapiede. Tutti scendono, quello scalino, sorella piccola ma grande, fratello grande grande ma piccolo, vecchietto e carrellino. Entrano nel ristorante che sembra stia arrivando la regina- il proprietario apre di corsa la porta, i camerieri tutti li guardano... ma nello sguardo c’è anche preoccupazione. Che il vecchio ricurvo sia la morte in persona? O forse se la porta a spasso, a cena... una cosa del genere fa un certo clamore.</p><p class=st>Sono però solo una famiglia un po’ strana. A tavola già seduti giapponesi, inglesi, giovani e adulti. Tutti allegri e un po’ stanchi.</p><p class=st>Il vecchio ordina cotoletta e patatine. Un pasto da bambino- scelta rotonda, perfetta. Il figlio premuroso e vegetariano taglia la carne cercando di non ferirlo nell’orgoglio. La figlia disegna lo schema del tris sulla tovaglietta di carta e gioca con il vecchio papà, come un tempo, che c’è rumore ed è stanco e non riesce a seguire i discorsi. Il figlio grande grande lo guarda come un figlio che avrebbe del padre un gran bisogno, per tutta la vita, ma comincia a capire finalmente che non si può fare.</p><p class=int>I MIEI SARGASSI</p><p class=st>Dove vado quando ho bisogno di rinascere.</p><p class=st>Lì io sono piena, tranquilla, sostenuta. Tra gli alberi ritrovo quella che ero e che posso essere. Soprattutto sono. Passi, respiro, presenza. Rumore del vento tra le foglie, canti d&#x27;uccelli, chiacchiericcio lontano, zampette.</p>"}, {"id": "t-at-uno-tutti-nessuno-sarah-perruccio-pdf-oss", "g": 0, "autore": "Sarah", "titolo": "La rocambolesca storia della mia ossessione per…", "apertura": false, "separato": true, "arrivo": "2026-10-15T23:17", "incipit": "Io stavo per piangere, al buio, in attesa d’essere liberata. Poi arrivavano le voci scherzose e la porta s’apr", "html": "<p class=int>La rocambolesca storia della mia ossessione per</p><p class=st>Io stavo per piangere, al buio, in attesa d’essere liberata. Poi arrivavano le voci scherzose e la porta s’apriva, tornava la luce.</p><p class=st>Suppongo abbia a che fare con l&#x27;essere stata scorza d&#x27;uovo. L&#x27;essere stata piccola in mezzo ai grandi, per un bel po&#x27;. Essere a terra o sul passeggino mentre intorno si muovono mille cose. Essere l&#x27;ultima a tavola ad avere un&#x27;opinione e dover maturare un po’ prima di dire qualcosa all’altezza. Suppongo parta da lì questa inclinazione per le conversazioni degli altri. In fondo erano sempre le loro e non le mie, per anni. Erano degli altri i dialoghi nei libri, degli altri i discorsi dei film.</p><p class=st>Non so se può dirsi un&#x27;ossessione ma è automatico e irresistibile, più forte di me. Sono al ristorante con qualcuno che ascolto diligentemente ma non mi perdo i dialoghi del tavolo a fianco e di quelli dietro. Li colgo per strada- frammenti di conversazioni- e da lì immagino motivazioni, antefatti, conclusioni. Le persone diventano personaggi anche solo per un attimo estemporaneo. E allora forse è così, da una bambina chiusa nello sgabuzzino con l&#x27;orecchio teso a capire cosa avvenisse di là, che è nata l&#x27;ossessione per gli scampoli di dialoghi rubati ai passanti.</p>"}, {"id": "t--mat-uno-tutti-nessuno-stefania-reda-pdf", "g": 0, "autore": "Stefania", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-15T09:56", "incipit": "1) SACRO è ciò che è intoccabile, immobile e puro.", "html": "<p>1) SACRO è ciò che è intoccabile, immobile e puro.</p><p class=st>Non è irraggiungibile ed è per sempre.</p><p class=st>SACRO è ciò che è immutabile, fedele a se stesso, ora, prima e sempre.</p><p class=st>Caratteristica del SACRO è l’unicità.</p><p class=st>Spesso si circonda di mistero e si disvela improvvisamente.</p><p class=int>2) Per parlare di me bisogna prima parlare di Ingiustizia.</p><p class=st>L’ingiustizia e orrore che una bimba curiosa e poco controllata di circa dieci anni scopre nei quaderni di Amnesty International che raccontano il golpe Cileno del 1973.</p><p class=st>E’ stato il primo incontro con il Male, ed è stato così potente, così efficace nella descrizione che ha lasciato una ferita che non si è mai più chiusa. Lo riconosco anche se è lontanissimo, ne sento l’odore, ne percepisco il rumore sommesso.</p><p class=int>2bis) Per parlare di me bisogna parlare di Ingiustizia (ancora..)</p><p class=st>Le ingiustizie della vita che hanno colpito la mia nonna paterna , Bianca, detta nonna Binga. Le ho scoperte nell’arco della vita, me le ha raccontate, le ho lette nelle sue lettere che ho ereditato, negli scritti del nonno, nei rari ricordi di mio padre. Le nonne sono entità meravigliose, pacifiche e tranquille, senza passato..finchè non le scopri.</p><p class=st>Avrei fatto la pianista se lei non fosse stata pianista?</p><p class=st>Come può una pianista stare dalla parte degli oppressi e salvare il mondo?</p><p class=int>PANGOLINO</p><p>3) E’ stata la sensazione più struggente che Stefania potesse immaginare.</p><p class=st>Aspettava il momento in cui sarebbe nato il suo primo figlio con eccitazione, gioia, senza paura. Per tutta la gravidanza ha atteso quel momento, il momento della nascita. Era troppo curiosa di vedere, provare come sarebbe stato. Tante donne le avevano raccontato le loro esperienze, ma non riusciva assolutamente ad immaginarselo.</p><p class=st>Il parto se l’è vissuto pienamente, con grande consapevolezza, con gioia e con sorpresa. Non era come se lo aspettava.</p><p class=st>Poi è nato. Faceva dei versetti, come un gattino, pianopiano. In effetti sembrava Alvise, il gattino saltellante della Lena.</p><p class=st>Era bello, riccio, biondo cenere. Stefania si è sentita immensa, divina, e si è sciolta in quel mare di dolcezza.</p><p class=st>Era Fede, e l’aveva fatto lei.</p><p class=int>I MIEI SARGASSI</p><p>4) Lì, io sono protetta. Lì io sono tranquilla.</p><p class=st>E’ una piccola tomba, al Cimitero Monumentale di Milano.</p><p class=st>Era la tomba di una bimba, ora è la tomba di famiglia.</p><p class=st>C’erano, ci sono e ci saranno per sempre le mie donne.</p>"}, {"id": "t--nessuno-stefania-reda-l-ossessione-docx", "g": 0, "autore": "Stefania", "titolo": "La rocambolesca storia della mia ossessione per…", "apertura": false, "separato": true, "arrivo": "2026-10-19T20:22", "incipit": "Io stavo per desistere da questo progetto. Ci ho messo almeno due anni per realizzarlo, e non so quanto tempo…", "html": "<p>Io stavo per desistere da questo progetto. Ci ho messo almeno due anni per realizzarlo, e non so quanto tempo ancora prima per immaginarlo.</p><p>La storia è un po’ lunga.</p><p>Un mio allievo mi ha anche regalato uno di quei pupazzetti di legno giapponesi.. daruma, si chiama.</p><p>Si colora un occhio, prima rigorosamente bianco, per rappresentare il desiderio da realizzare, e poi quando si è realizzato si colora anche l’altro.</p><p>Questo regalo è stato la molla che ha fatto partire tutto, oltre al biglietto meraviglioso che i miei figli avevano scritto tempo prima per spronarmi a farlo.</p><p>Siamo ancora al preambolo, ma altrimenti non si capisce...</p><p>c’è un’altra cosa, io sono una musicista classica, i miei contatti con la musica pop o “leggera” ( quindi io da bimba pensavo che la musica classica fosse “pesante” ) si riducevano alle festine alle quali partecipavo da bambina quando andavo a trovare le mie cugine a Padova...loro avevano “la compagnia”, loro stavano ore in strada sedute sul marciapiede ad aspettare i ragazzi che facevano i “fighi” con i motorini. Io mi sentivo completamente fuori posto, ma anche provavo un’invidia maledetta per quelle giornate..io non avevo una compagnia, non facevo festine e non avevo quel tipo di stivali che portavano le mie cugine.</p><p>Studiavo tutto il giorno il pianoforte, non mi sono mai chiesta se ne avessi davvero voglia. Era così e basta. E tutti i miei amici erano più o meno come me, vivevamo in Conservatorio e comunque ci si divertiva un casino, ma potevamo capirlo solo noi.</p><p>In più: in brevissimo tempo si è delineata con estrema chiarezza la mia indole di camerista:</p><p>suonare con gli altri, saper stare al proprio posto, ascoltare con attenzione, supportare senza protagonismo, sapere quando è il tuo momento. Ma soprattutto, essendo pianista, costruire l’impalcatura sulla quale quasi sempre è un altro che brilla.</p><p>Tutto questo per dire che ad un certo punto ho voluto fare una cosa solo mia, che però includesse la categoria di persone che più apprezzo, che più mi ispira, che più amo: i bambini.</p><p>Quindi: ad un certo punto l’idea era matura: fare qualcosa di mio ma con i bambini protagonisti.</p><p>Decido di incidere un CD di ninne-nanne e faccio una grande ricerca (detesto quelle compilazioni commerciali dove la musica per bambini è stupida tanto quanto le cazzate che generalmente si raccontano loro).</p><p>Fra le molte musiche che scopro, che ascolto, che leggo, per caso assoluto, ascolto una canzone di Michael Jackson che si intitola Childhood (infanzia).</p><p>Io avevo una vaghissima idea di chi fosse MJ, ed anche tutti i luoghi comuni che hanno sempre circolato sul suo conto.</p><p>Questo pezzo è stata una vera folgorazione, e lui è diventato la mia ossessione.</p><p>La struttura è quella di un Lied romantico, ora non mi metterò a farne l’analisi. Ho subito pensato che non avesse niente da invidiare ad un Lied di Schubert o di Schumann..Mignon!</p><p>Ho ascoltato tutte le musiche di MJ, letto biografie e la sua unica autobiografia, comprato tutti (quasi, mi mancano i primi, con i suoi fratelli) i CD ed anche il lettore CD perché incredibilmente non l’avevo. Ho visto i video, visto le interviste, penso che sarebbe bello averlo ancora qui, chissà cosa direbbe di questo mondo.</p><p>La mia ossessione mi ha portato a suonare quella canzone in una bellissima versione che ha scritto per me un mio ex allievo... ed ora c’è in ballo un nuovo progetto. Chissà....</p>"}, {"id": "t-ntro-le-mat-uno-tutti-nessuno-verena-pdf", "g": 0, "autore": "Verena", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-13T23:10", "incipit": "Sacro: qualità arcana, indicibile, che prescinde dalla comprensione razionale e individuale, eppure…", "html": "<p>Sacro: qualità arcana, indicibile, che prescinde dalla comprensione razionale e individuale, eppure inscindibile dall’esperienza personale. Può derivare dall’esperienza religiosa o contenerne elementi, ma non necessariamente. Rappresenta l’elemento spirituale per la persona che ne fa esperienza e presuppone che venga riconosciuto come tale. Si riferisce a tutto ciò che, per chi ne fa esperienza, rappresenta ciò che di più puro, incorruttibile, elevante, indescrivibile, prezioso ci possa essere e solleva l’animo a livelli più ineffabili, ma forse più veri, dell’esperienza personale.</p><p class=int>Per parlare di me bisogna prima...</p><p class=st>I.​</p><p class=st>Per parlare di me bisogna prima parlare di Agostina. Agostina è stata una gattina di mia nonna, raccattata da qualche parte da mio zio. Non aveva vita facile Agostina: mia nonna la tirava per la coda per obbligarla a starle in braccio, mangiava quando capitava, cioè quando mia nonna nonostante la demenza se ne ricordava, e viveva in un grande appartamento a San Donato Milanese. Successe che una settimana d’agosto di 7 anni fa, andai a trovare mio padre che aveva preso mia nonna a vivere con sè fuori città, e con la nonna era seguita anche Agostina, che ben presto divenne la regina indiscussa del giardino, con mio padre che mi mandava video di come teneva a bada altri gatti ben più grandi di lei. In quella settimana, Agostina, a zampe leggere, si fece strada, a mia insaputa e mio malgrado, ed entrò dritta nel mio cuore. Non mi era mai successa una cosa del genere e mai più mi succederà. Mi manca da allora.</p><p class=st>II.​</p><p class=st>Per parlare di me bisogna prima parlare di una malattia rara, di una condizione orribile che costringe le persone a convivere con atroci sofferenze, senza che esista una cura o speranza di guarigione. Queste storie horror e questi scenari apocalittici si insinuarono dentro al mio paesaggio mentale e lì instillarono la paura. Una paura cupa e senza forma, che a tratti poteva diventare tanto grande da ingoiarmi completamente, carne ed ossa, mente e spirito. Ci misi due anni a liberarmi di questa paura, ma ora è tornata, in veste nuova e più improbabile. Cerco di ricacciarla indietro nel profilo instagram da cui è sbucata fuori e mi dico: ma perché dovrei per forza io essere così sfigata da incarnare una di queste storie horror? Perché proprio io? Eppure un senso di ineluttabilità mi lega a queste storie. Arresa e insieme fiducia si susseguono nel mio animo. Chissà se sarà possibile una commistione tra queste due prospettive?</p><p class=int>Il mio pangolino</p><p class=st>L’ammalata stava sdraiata in mezzo alla sua angoscia ed il suo dolore nel letto, sul cuneo rialzato che tanto toglieva alla naturalezza dell’arrotolarsi e trovare conforto nel morbido di cuscino e coperta. Vicino a lei, il bambino cercò di avvicinarsi il più possibile, vincendo la distanza altera imposta dal cuneo. Disse “mamma”. Lei, la mamma, che non riusciva più a fare la mamma, sentì gli occhi riempirsi di lacrime sotto le palpebre. La manina del bambino allora si appoggiò lieve sul suo ventre e con dolcezza infinita saltellò sù e giù, e poi accarezzò la pancia della sua mamma. La mamma allora prese la manina nella sua di mano, e non seppe più chi avesse più bisogno di chi. Si sentì profondamente confortata e insieme la raggiunse la consapevolezza che questo era l’unico conforto possibile, e che allo stesso tempo questa era la cosa più dolorosa: l’amore del suo bambino nel momento in cui lei, al suo bambino, poteva offrire solo mano e lacrime.</p><p class=int>I miei Sargassi</p><p class=st>Lì io sono nel ricordo di una collina con in cima una chiesetta, e vicino alla chiesetta c’è l’ulivo, con le sue foglie argentate. Lì tra le foglie trovo il candore di una rinascita dalle ceneri, come una fenice.</p>"}, {"id": "t-ntro-le-mat-uno-tutti-nessuno-verena-pdf-oss", "g": 0, "autore": "Verena", "titolo": "La rocambolesca storia della mia ossessione per…", "apertura": false, "separato": true, "arrivo": "2026-10-13T23:10", "incipit": "Io stavo per affogare in una crisi seria. Mi ero laureata qualche mese addietro e l’esperienza era stata così ", "html": "<p class=int>La rocambolesca storia della mia ossessione per...</p><p class=st>Io stavo per affogare in una crisi seria. Mi ero laureata qualche mese addietro e l’esperienza era stata così traumatica che nella vita volevo fare tutt’altro, fuorché quello. Il mio ragazzo mi aveva finalmente lasciata per un’altra, dopo tre anni di rapporto tira e molla. Ero approdata a casa di mia madre trovandovi rifugio e accoglienza in un momento buio. Ero senza prospettive, col cuore infranto e una psiche lacerata. Quando mi svegliavo la mattina e mi rendevo conto della mia condizione mi sembrava di svegliarmi in un incubo. Col senno di poi vedo quanto quei mesi furono profondamente rigeneranti, offrendomi il tempo di riposare e guarire. Ma in quel momento non mi sembrava certo di passarmela bene.</p><p class=st>Fu quando, dopo che lo psichiatra mi prescrisse farmaci che mi fecero stare ancora peggio e stavo veramente rischiando di toccare il fondo, che iniziai a cercare ciò che lenisse il mio animo e la mia mente. Leggevo....seduta al parco sotto un albero. Trovai chi mi aiutò a lasciarmi alle spalle le medicine. Facevo la babysitter a un bambino bellissimo. Andavo a nuotare in piscina. E soprattutto...cercai una scuola di teatro. Chiedendomi che cosa mi piacerebbe fare, mi dissi che mi sarebbe piaciuto fare un film, ma prima, mi dissi anche, dovevo imparare a recitare! E così iniziò la mia passione per il teatro. Mi cambiò la vita per sempre. Non feci mai un film e non feci neppure l’attrice, ma i due anni che frequentai la scuola di recitazione scoprii me stessa. Finivo il corso dopo mezzanotte e alle cinque del mattino già uscivo per prendere il treno (perchè nel frattempo avevo trovato un lavoro part-time in un’altra città). Non mi sentivo stanca, perchè avevo il fuoco dentro. Il teatro mi fece scoprire che il divertimento è importantissimo, che divertendosi, le cose si fanno meglio. Mi rivelò parti di me che non conoscevo...mi scoprii sensuale, divertente, intensa e brava! Il tetaro mi costrinse anche a guardare in faccia ciò che mi bloccava. I blocchi più ostici non si sono sciolti...ma ho iniziato ad avere passione per la vita. Pedalavo verso la mia scuola di teatro sotto la neve, sotto la pioggia, sotto le stelle, attraversando la notte torrida dell’estate in città....pedalavo veloce e felice con dentro il desiderio di amicizia, di vita, di teatro, di arte e passione. Un desiderio che vinceva le mie ritrosie. Un desiderio di vita che maturava dentro ogni personaggio, dietro ad ogni maschera. Maschere che m’aiutavano ad essere più vera. Mi resi conto che senza una forma, il contenuto non può esprimersi. Maschere, quindi, come veicolo di autentica espressione vitale.</p><p class=st>Il teatro mi ha riempita di passione. Forse, una passione troppo grande, troppo potente. Ho poi percorso altre vie. Tante le ragioni e tanta anche la nostalgia.</p><p class=st>La passione e la vita però mi sono rimaste dentro.</p>"}, {"id": "t--imprevedibile-altro-te-giusy-russo-docx", "g": 1, "autore": "Giusy", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-20T22:00", "incipit": "Stai cercando lavoro, come sempre. Hai 25 anni. Ti sei laureata da poco, sei stata lasciata da poco dal tuo…", "html": "<p>Stai cercando lavoro, come sempre. Hai 25 anni. Ti sei laureata da poco, sei stata lasciata da poco dal tuo grande amore, con la scusa che saresti stata d&#x27;intralcio alla sua carriera di performer, e lui sarebbe stato costretto a mancarti di rispetto per assicurarsi una raccomandazione e &quot;ti vuole troppo bene e tu meriti di più &quot;. Hai cominciato a frequentare, sempre da poco, un ragazzo egiziano. Ti sembra così pulito, raffinato, innocente, e poi è bello, davvero. E tu ne hai avuti pochi, ma tutti belli. E falsi. Il tuo animo pittore maledetto. Ti capita ogni tanto una supplenza nei licei come prof di inglese, ma non ti riesce di accumulare il gruzzoletto necessario per le amate vacanze, che ti sei sempre pagata da te. E quindi, col cuore a pezzi, una laurea che vale un rotolo di carta igienica, la voglia di scappare da una famiglia asfissiante per più tempo possibile, cerchi lavoro. Lo trovi, d&#x27;estate, come responsabile della biblioteca, per due mesi, da un prete piacione che gestisce da anni l&#x27;agenzia di pellegrinaggi legata al Vaticano. Avevi lavorato per lui anni prima come accompagnatrice di disperati a Lourdes, Terra Santa, Fatima. La promessa di un miracolo e del Paradiso ad opera del direttore demonio. Non dimentichiamo che Lucifero era stato un angelo. E infatti Lucifero, che era da anni invaghito di te, ma tu eri sempre fidanzata, adesso che capisce che sei (quasi) libera, ti invita a cena e tu prima piangi perché capisci come si andrà a finire, poi ti passa. Andare a letto con un prete per due mesi di stipendio. Un prete che sta bene attento a non finire il rapporto per non rischiare di metterti incinta, una merda che la domenica predica in chiesa e nel privato si concede le ragazzine ricattandole con il lavoro, dichiarandosi addirittura innamorato. Certe parole in bocca a certa gente diventano bestemmie. Ma tu decidi che lo farai. È un bell&#x27;uomo, anche se ha il doppio dei tuoi anni, i soldi ti servono, fare la brava persona ti ha portato solo sfortuna. Quest&#x27;altra te, lontana e vicinissima, ti sorprende per... un breve istante di disperazione. Poi ritornerai a fare la brava persona. Fidanzandoti con l&#x27;egiziano. Sposandolo, addirittura. Per vivere una vita di solitudine e difficoltà. Ma ognuno è fatto a modo suo. E tu sei sempre stata una romantica. Una romantica sfigata. Ottocentesca, appunto.</p>"}, {"id": "t-obre-imprevedibile-altro-te-ilaria-f-pdf", "g": 1, "autore": "Ilaria", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-06T19:28", "incipit": "Stai rovistando nella borsa alla ricerca del tabacco. Trovi di tutto, quaderni stropicciati, fazzoletti…", "html": "<p>Stai rovistando nella borsa alla ricerca del tabacco. Trovi di tutto, quaderni stropicciati, fazzoletti usati, una bottiglietta accartocciata. Quando lo cerchi non lo trovi mai senza aver tirato fuori dalla borsa un mondo di ciarpame. Eccolo, si era nascosto tra la fodera e la parete della borsa. È sempre sorprendente come da un foro nel tessuto di una borsa o di una tasca, grande al massimo quanto una noce, possano passare oggetti incredibilmente voluminosi. Ti stai per fare una sigaretta quando arriva Elisa, pugno alzato, sguardo fiero: “Andiamo ad occupare i binari!”. Ti dimentichi del tabacco e corri a chiamare gli altri: “Presto gli striscioni!” e in pochi minuti si vedono persone uscire dalle aule, percorrere animatamente i corridoi, correre giù per le scale. Esci dall’ateneo seguendo lo sciame di persone che si fa corrente. Manifestazione non autorizzata. Cammini veloce, come camminano veloci le persone al tuo fianco. Riconosci qualche volto familiare, altri è la prima volta che li vedi. In un attimo tutti sono uno. Ti muovi con decisione. La direzione è chiara per tutti: si va in stazione. Il cammino non è lungo, ma è importante muoversi insieme e velocemente.</p><p class=st>Il clima è goliardico. La rabbia è tanta, ma c’è anche tanta euforia, desiderio di farsi sentire e di essere visti. Non è possibile che il sistema scolastico del paese venga depauperato e calpestato ancora una volta senza che nessuno se ne accorga.</p><p class=st>Arrivi in stazione con una massa informe di giovani uomini e giovani donne che vogliono proteggere l’università e l’istruzione con i loro corpi. Sta succedendo in tutte le città italiane. Entri a passo deciso e ti dirigi con gli alti verso i binari di una delle ultime stazioni più a Sud dello stivale. Ti aiuti con le mani per saltare giù dalla banchina e trovi il tuo spazio sul binario. Qui si blocca tutto (non che ci sia molto da bloccare, dato che i treni che arrivano fino a qui non sono poi molti...)</p><p class=st>I cori cantati fino a poco prima tacciono. C’è uno strano silenzio. Sai che quello che state facendo potrebbe avere delle conseguenze, ma senti di poterle affrontare, qui c’è in gioco il futuro.</p><p class=st>Prendi sottobraccio le persone che ti sono accanto, lo sciame informe è ora una grande catena umana che percorre i binari lungo tutta la banchina.</p><p class=st>Una donna uscita dall’edificio della stazione si avvicina ai binari, cammina con passo sicuro e osserva. Non è lì per caso. Nonostante l’aspetto da casalinga middle aged, la ricetrasmettente che nasconde malamente con le mani dietro le spalle non lascia dubbi: la Digos. Dice qualcosa in direzione della catena umana con tono fermo. Vuole dissuadere la folla dall’azione di protesta. Non ci vedi più. Una rabbia che non avevi mai voluto guardare in faccia ma che ribolliva nel profondo delle viscere si fa strada. Uno scatto e ti trovi in piedi ad urlarle in faccia tutta la tua indignazione. Quest’altra te, lontana e vicinissima, ti sorprende per quanto sia appassionata, incazzata, lucida e sagace, nell’infrangere con il suo urlo il silenzio che si era creato. Senti gli sguardi che si sono posati sulla tua figura, mentre sei intenta a sfidare lo sguardo di quella donna, nei cui occhi intravvedi che le tue parole hanno fatto breccia. Non si può restare indifferenti, anche se sei dall’altro lato della barricata, un’ingiustizia è pur sempre un’ingiustizia, ancora più amara quando penalizza le generazioni che verranno. Non ti eri mai sentita così, posseduta da un messaggio che dovevi gridare con urgenza, per te, per loro, per tutte e tutti.</p>"}, {"id": "t-ria-luisa-un-imprevedibile-altra-te-gdoc", "g": 1, "autore": "Maria Luisa", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-06T10:24", "incipit": "Stai malissimo da ieri sera. Ti sei sentita abbandonata, non desiderata, messa da parte in nome della…", "html": "<p>Stai malissimo da ieri sera. Ti sei sentita abbandonata, non desiderata, messa da parte in nome della stanchezza - che chissà perché suona sempre come una scusa.</p><p class=st>Hai preso sonno molto tardi, fra le lacrime. Ti sei alzata presto per fare pipì e ora non riesci più a riaddormentarti. Lui piano piano inizia a svegliarsi, il suo corpo ti cerca come se nulla fosse. All’inizio pensi di negarti, per pura vendetta: “ora ti ripago con la stessa moneta”.</p><p class=st>Ma che senso ha? Anche tu lo vuoi. Ti faresti solo del male.</p><p class=st>Vi ritrovate, ma ti rimane addosso qualcosa di amaro.</p><p>E’ questo odioso senso di dipendenza per cui per essere serena hai bisogno che la tua bambina interiore si senta scelta sempre e comunque, a prescindere da tutto.</p><p class=st>Ti sembra di avere cinque anni. Te ne vergogni, ma non riesci a uscirne.</p><p class=st>E poi la gelosia la gelosia la gelosia la gelosia la gelosia.</p><p class=st>Questo mostro che è tornato nella tua vita dopo che credevi di averlo estirpato.</p><p class=st>Era da quando avevi diciassette anni che non ti sentivi così gelosa.</p><p class=st>Hai passato anni a dichiarare con serenità - e verità, diamine! - di non essere una persona gelosa. Eppure, ora...</p><p class=st>Lui si alza, si fa una doccia, ti saluta affettuosamente e va a lavorare. Sono le sette e mezza circa. Lo rivedrai solo verso ora di cena, e, ironia della sorte, è previsto che ceniate proprio con la persona di cui sei follemente, irrimediabilmente gelosa.</p><p class=st>Ovviamente sei più che sveglia. Ti senti una piccola merda secca priva di qualsiasi luce interiore. Ti alzi e cerchi di dare un colpo di reni alla tua giornata, di ritrovare un tuo centro.</p><p class=st>Devi lavorare, hai della musica da scrivere. Come sempre, per poter iniziare la giornata hai prima bisogno di mettere ordine nel luogo in cui ti trovi. Sistemi le poche cose rimaste sul tavolo dalla sera prima, e ti cade l’occhio su una mensola piena di quaderni.</p><p class=st>Non ci pensi neanche dieci secondi. Inizi a sfogliarli tutti, alla disperata ricerca di qualcosa di personale, di qualcosa che parli di te, di qualcosa che ti faccia capire, perché hai bisogno di capire!</p><p class=st>Finalmente trovi il diario.</p><p class=st>Non hai mai letto il diario di un’altra persona. (A parte quello di una signora che ti aveva affittato una stanza nella sua casa a Roma qualche anno fa. L’aveva lasciato in mezzo ai libri, così, a disposizione, quindi non ti sembrava una violazione. E poi era una sconosciuta totale. Nella tua percezione non era molto diverso dal leggere le memorie di Silvio Pellico).</p><p class=st>Hai sempre dato un grandissimo valore alla riservatezza. Hai sempre storto severamente il naso di fronte a quelle storie di coppie che si controllano reciprocamente il telefono. Neanche a dirlo, non hai mai guardato di nascosto dentro il telefono di qualcun altro.</p><p class=st>Se qualcuno lo facesse con te, ti farebbe uscire di testa. Sarebbe uno strappo alla fiducia difficile da ricucire.</p><p class=st>Eppure in quel momento è impossibile fermarti. Impossibile tornare indietro.</p><p class=st>Quest’altra te, lontana e vicinissima, ti sorprende per quanto si senta in diritto di fare quello che sta facendo. E’ pervasa da una combinazione letale di onnipotenza, fatalità e autosabotaggio. Ti getti su quel diario con un’incontrollabile e devastante bulimia, sorretta da un perverso senso di giustizia.</p><p class=st>E’ difficilissimo decifrarlo. La sua scrittura non è molto leggibile, ma soprattutto è minuscola. E’ un quaderno a righe, e in ogni riga lui ne scrive tre. Ma perché? In più è scritto in inglese!</p><p class=st>Il lavoro è più lungo del previsto e si rivela uno stillicidio, ma ovviamente non demordi.</p><p class=st>Come in un attacco bulimico, il cui meccanismo pure conosci molto bene, fermarsi non cambierebbe nulla dal punto di vista ontologico. Ormai il danno è fatto: tanto vale andare fino in fondo. Se dopo cena hai mangiato un quadratino di cioccolato, cosa cambia se mangi anche un cornetto Algida, una fetta di torta, pane e alici, pane e maionese?</p><p class=st>E come in un attacco bulimico, più vai avanti più il disgusto verso te stessa si radica profondamente.</p><p class=st>Leggi (o almeno cerchi di decifrare) tutto quello che riguarda te stessa e l’oggetto della tua gelosia. Non porta a nulla di nuovo, solo maggiore gelosia e maggiore disgusto.</p><p class=st>Chiudi il diario e lo rimetti al suo posto. Ora si apre la grande questione etica: dire o non dire? Fai finta di domandartelo, fai finta di parlarne con un’amica, ma in te non c’è mai stata l’ombra di un dubbio: ovviamente glielo dirai.</p><p class=st>Si fa strada la percezione di un altro mostro che ha guidato le tue azioni: un mostro che dice “Guarda cosa sono capace di fare. Guarda quanto in basso posso arrivare. Resterai comunque al mio fianco? Mi amerai ancora, dopo una cosa del genere?”</p><p class=st>Quando poi glielo dici, lui non fa una piega. Ridacchia. Si chiede cosa tu possa essere riuscita a leggere di quei geroglifici. Osserva che forse inconsciamente ha sempre voluto che qualcuno leggesse il suo diario. Ti chiede gentilmente di non farlo più e poi si concentra sul cercare di capire come mai fossi arrivata a stare così male.</p><p class=st>L’altro giorno, circa nove mesi dopo questo episodio, ti sei trovata in una situazione simile. Lui era a lavoro e proprio lì, sul comodino, in bella vista, si stagliava, incredibilmente invitante, IL DIARIO. Arrivavate da una crisi ben più profonda di quella di allora. Ce ne sarebbero state, di cose da capire, da scoprire. Anche perché lui è meno trasparente di te, meno incline alla condivisione immediata e totale. Lui filtra. Lui aspetta.</p><p class=st>E’ stata una piccola lotta con quell’altra te, lontana e vicinissima. Sei riuscita a vincerla.</p>"}, {"id": "t-n-imprevedibile-altro-te-mariagiulia-pdf", "g": 1, "autore": "Mariagiulia", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-18T10:45", "incipit": "Stai per farlo di nuovo: farti colpire dalle sue parole, accusare il colpo, curvare leggermente le spalle,…", "html": "<p>Stai per farlo di nuovo: farti colpire dalle sue parole, accusare il colpo, curvare leggermente le spalle, inclinare leggermente la testa. Di solito sorridi appena, esprimendo in quell’abbozzo tutta la tua malinconica rassegnazione. Ma non oggi. Oggi non sono le spalle a curvarsi, ma il petto che si gonfia. Inali voracemente tutta l’aria che riesci a contenere, le narici allargate cercando di farle spazio. Le labbra si increspano, gli occhi lampeggiano e urli. Urli profondamente, fai uscire tutta quell’aria appena raccolta e la trasformi in suono. Quell’urlo è materia vibrante, arma da scagliare contro gli attacchi ricevuti, ripetuti, incassati. Quell’urlo è una parola ritornata al primordiale stadio di essere solo suono. Puro e potente suono, frastuono, tuono, big bang. Attraverso la tua cavità orale passano tra i 70 e i 90 decibel, più 90 dal tuo punto di vista. Te li godi tutti, come ti godi sempre il suono della musica su cui stai lavorando in saletta. Ti godi quella materia invisibile che colpisce, rimbalza e provoca, schianta, richiama, solletica e seduce, conduce, commuove. Oggi sei tu, l’amplificatore e ne vai molto fiera. Quest’altra te, lontana e vicinissima, ti sorprende per la facilità con cui tutti quei decibel sono usciti dalla sua bocca. Ti sorprende essere l’amplificatore di te stessa. Tu amplificatrice. Tu che di solito sorridi triste e te ne vai. Oggi pesi 120kg e fai vibrare il pavimento e i muri. Oggi scompigli i capelli, come si suol dire. Oggi, al contrario di sempre, gli urli addosso. Quell’urlo oggi suona come una promessa. La promessa di non essere solo superficie ricevente ma provocatrice. La promessa di saper essere scudo, all’occasione, o temibile arma. In realtà la promessa, lo sai anche prima di rendertene conto, è stata fatta e mantenuta in quella frazione di secondo dove tu e il tuo corpo avete deciso di mutare il sorriso triste in una bocca spalancata. Una decisione che quella te che non sempre è te ha fatto per te. Per te e con te.</p>"}, {"id": "t-arcana-un-imprevedibile-altro-da-te-docx", "g": 1, "autore": "Pietro", "ti

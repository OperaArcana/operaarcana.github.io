<style>
:root{--carta:#faf8f4;--inchiostro:#1d1b19;--grigio:#6d6862;--filo:#ddd7cd;
  --rosso:#c5332f;--blu:#0c5e9c;--giallo:#daaa39;--verde:#0c5b45}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--carta);color:var(--inchiostro);font-family:"EB Garamond",Georgia,serif;font-size:18px;line-height:1.5}
.et{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grigio)}
a{color:inherit}
.muro{max-width:960px;margin:0 auto;padding:0 20px 60px}
header{position:relative;padding:44px 0 18px;overflow:hidden}
header h1{font-weight:400;font-size:46px;line-height:1;margin:10px 0 4px}
header .sotto{font-style:italic;font-size:21px}
header svg{position:absolute;right:-10px;top:14px;width:190px;height:150px}
nav{display:flex;gap:8px;margin:18px 0 26px;border-bottom:1px solid var(--filo)}
nav a{text-decoration:none;padding:10px 14px 9px;font-family:Helvetica,Arial,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--grigio);border:1px solid transparent;border-bottom:none;border-radius:4px 4px 0 0;margin-bottom:-1px}
nav a.su{color:var(--inchiostro);background:#fff;border-color:var(--filo)}
.cassetto{margin:0 0 38px}
.bottoniera{display:flex;flex-wrap:wrap;gap:18px 26px;margin:0 0 30px;padding-bottom:22px;border-bottom:1px solid var(--filo)}
.gruppo .et{margin-bottom:8px}
.riga{display:flex;flex-wrap:wrap;gap:8px}
.bott{display:flex;align-items:center;gap:9px;text-decoration:none;background:#fff;border:1px solid var(--filo);border-radius:999px;padding:8px 16px 8px 12px;font-size:17px;line-height:1.15}
.bott small{display:block;font-family:Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);margin-top:2px}
.bott:hover{border-color:#bdb5a8}
.bott.grande{font-size:19px;padding:10px 20px}
.bott.piccolo{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:6px 14px 6px 10px;gap:7px}
.bott.piccolo .pal{width:9px;height:9px}
.riga.giorni{margin-top:12px;padding-left:14px;border-left:2px solid var(--filo)}
.bottoniera{flex-direction:column;gap:0}
.num{display:inline-block;min-width:18px;padding:1px 6px;border-radius:9px;background:var(--rosso);color:#fff;font-size:10px;letter-spacing:0;text-align:center;margin-left:4px}
.scheda .arrivo{position:relative;margin-top:6px;font-size:10px}
.bott.su{border-color:var(--inchiostro);box-shadow:inset 0 0 0 1px var(--inchiostro)}
.sezione{font-size:13px;color:var(--inchiostro);margin:0 0 12px}
.cassetto-testa .data{font-size:22px;color:var(--grigio)}
.cassetto-testa{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.pal{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.cassetto-testa h2{font-weight:400;font-size:30px;margin:0;line-height:1.1}
.consegna{font-style:italic;color:#4a4642;max-width:46em;margin:4px 0 16px;font-size:16.5px}
details.cons summary{cursor:pointer;list-style:none;margin:2px 0 14px}
details.cons summary::-webkit-details-marker{display:none}
details.cons summary .et{border-bottom:1px dotted var(--grigio)}
.schedario{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.scheda{position:relative;display:block;text-decoration:none;background:#fff;border:1px solid var(--filo);border-top:4px solid var(--c);border-radius:3px;padding:12px 14px 30px;min-height:150px;box-shadow:0 1px 0 rgba(0,0,0,.03);transition:transform .12s, box-shadow .12s}
.scheda:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.07)}
.scheda .righe{position:absolute;left:14px;right:14px;top:58px;bottom:30px;background:repeating-linear-gradient(to bottom,transparent 0 25px,#eef3f7 25px 26px);pointer-events:none}
.scheda .coll{position:relative;display:flex;justify-content:space-between}
.scheda .chi{position:relative;font-size:23px;line-height:1.15;margin:6px 0 4px}
.scheda .cosa{position:relative;font-style:italic;color:#4a4642;font-size:15.5px;line-height:26px;background:repeating-linear-gradient(to bottom,transparent 0 25px,#e3eaf0 25px 26px)}
.scheda .foro{position:absolute;left:50%;bottom:9px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--carta);border:1px solid var(--filo)}
.persona{margin:0 0 30px}
.nomi{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.nome{display:block;text-decoration:none;background:#fff;border:1px solid var(--filo);border-radius:3px;padding:14px 16px;font-size:22px;position:relative}
.nome:after{content:"";position:absolute;right:14px;top:50%;width:9px;height:9px;margin-top:-5px;border-radius:50%;border:1px solid var(--filo);background:var(--carta)}
.nome:hover{border-color:#bdb5a8}
.persona h2{font-weight:400;font-size:28px;margin:0 0 8px;display:flex;align-items:center;gap:12px}
.persona h2:after{content:"";flex:1;height:1px;background:var(--filo)}
.lettura{max-width:36em;margin:0 auto}
.indietro{display:inline-block;margin:6px 0 26px;text-decoration:none}
.lettura h2{font-weight:400;font-size:38px;margin:8px 0 2px;line-height:1.1}
.lettura .tit{font-style:italic;font-size:20px;color:#4a4642;margin-bottom:6px}
.lettura .linea{height:2px;width:70px;margin:16px 0 26px}
.lettura p{margin:0 0 .7em;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.lettura p.st{margin-top:1.4em}
.lettura p.int{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grigio);margin:2em 0 .6em;text-align:left}
.lettura p.esercizio{font-family:"EB Garamond",Georgia,serif;font-size:25px;letter-spacing:0;text-transform:none;color:var(--inchiostro);margin:3.4em 0 .25em;padding-top:1.4em;border-top:1px solid var(--filo)}
.lettura p.esercizio:first-of-type{border-top:none;padding-top:0;margin-top:.6em}
.es-cons{font-style:italic;color:#5d5852;font-size:16px;line-height:1.45}
.lettura p.es-cons.lett{text-align:left;margin:0 0 1.2em;font-size:16px}
.esercizi{background:#fff;border:1px solid var(--filo);border-radius:3px;padding:14px 18px 6px;margin:6px 0 18px;max-width:46em}
.esercizi .es{padding:10px 0;border-top:1px solid #efebe4}
.esercizi .es:first-of-type{border-top:none}
.es-nome{font-size:19px;margin-bottom:2px}
/* 10/11/2026: solo i titoli, la consegna si apre col clic (Fulvio) */
details.es summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px}
details.es summary::-webkit-details-marker{display:none}
details.es summary:before{content:"+";font-size:17px;color:var(--grigio);width:12px;flex:none}
details.es[open] summary:before{content:"–"}
details.es .es-cons{padding:6px 0 4px 22px}
.fine{text-align:center;margin:30px 0}
.passi{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--filo);padding-top:16px;margin-top:20px}
.passi a{text-decoration:none;max-width:48%}
.passi .chi{font-size:19px}
.pezzo{padding:0 0 10px;margin:0 0 34px;border-bottom:1px solid var(--filo)}
.pezzo .firma{text-align:right;font-style:italic;font-size:21px;margin:14px 0 2px}
.pezzo .firma a{text-decoration:none}
.pezzo .tutto{text-align:right;margin:0 0 6px}
.pezzo .tutto a{text-decoration:none}
.stacco{height:1.2em}
.tra{height:2.6em;border-bottom:1px solid var(--filo);margin-bottom:2.6em}   /* fra un file e l'altro della stessa persona (11/11/2026) */
.es-testa h2{font-weight:400;font-size:34px;margin:4px 0 6px;line-height:1.1}
.scheda .dorso{border:1px solid var(--grigio);border-radius:2px;padding:2px 6px 1px;line-height:1.3;letter-spacing:.08em;margin-top:-2px}   /* numerino nel riquadro, come l'etichetta sul dorso (Fulvio, 05/11/2026) */
footer{border-top:1px solid var(--filo);margin-top:40px;padding-top:14px}
@media (max-width:560px){header h1{font-size:36px}header svg{width:120px;height:100px;opacity:.85}.schedario{grid-template-columns:1fr 1fr;gap:10px}.scheda{min-height:130px;padding:10px 10px 26px}.scheda .chi{font-size:19px}.scheda .cosa{font-size:14px}.scheda .righe{left:10px;right:10px}body{font-size:17.5px}}
</style>
</head>

const GIORNATE=[{"titolo": "Le Mat", "sotto": "Uno, tutti, nessuno", "rubrica": "Gli incontri", "data": "lunedì 12 ottobre 2026", "colore": "#c5332f", "consegna": "Cinque esercizi, scritti durante la serata e a casa: <i>Sacro</i>, la voce del tuo personale dizionario; <i>Per parlare di me bisogna prima parlare di…</i>, due minibiografie; <i>Pangolino</i>, il ritratto di qualcosa di sacro, struggente e delicato, con la parola “saltello”; <i>La rocambolesca storia della mia ossessione per…</i>, che comincia con “Io stavo per…”; <i>I miei Sargassi</i>, il posto a cui torni per rinascere: “Lì, io sono…”.", "sigla": "Le Mat", "esercizi": [["Sacro", "sacro", "Definisci cosa significa per te sacro, come se fosse la voce del tuo personale dizionario.\nMassimo 12 righe.\nTempo: massimo 12 minuti"], ["«Per parlare di me bisogna prima parlare di…»", "parlare di|minibiograf", "Due minibiografie, in massimo 11 righe, su persone che vi hanno influenzato.\nE se non sono persone sono animali, o oggetti, o avvenimenti storici.\nImportante è che siano fuori dalla tua storia: cioè non vale parlare della tua laurea , ma potresti parlare della laurea del tuo migliore amico, ecco."], ["Pangolino", "pangolino|ritratto di qualcosa|qualcosa che per te", "Il ritratto di qualcosa che per te è sacro, struggente e delicato.\nProva a descriverlo a partire dall’effetto che questa cosa ha su di te. Come ti fa sentire? Che emozioni ti suscita?\nProva a raccontarlo in terza persona, come se tu fossi il personaggio di un romanzo.\nInserisci la parola saltello"], ["La rocambolesca storia della mia ossessione per…", "rocambolesca|ossessione|passione per", "Racconta in prima persona di una tua passione / ossessione e di come questa è arrivata nella tua vita.\nInizia dalla frase “Io stavo per…” e continuala.\nInserisci la parola “Maturare”\nTempo: finché non avete finito la storia"], ["I miei Sargassi", "sargassi", "Il posto al quale torni, quando hai bisogno di rinascere.\nIncipit: “Lì, io sono…”"]]}, {"titolo": "Un imprevedibile altro te", "sotto": "", "rubrica": "Saturday Sun", "data": "sabato 17 ottobre 2026", "colore": "#daaa39", "consegna": "Cerca un momento della tua vita in cui sei stato qualcosa che ti ha sorpreso, ma che riconosci come tuo: qualcosa che sei, pur essendo lontanissimo da te.\nIn seconda persona.\nIncipit: “Stai…”\nInserisci la frase “Quest'altra/o te, lontana/o e vicinissima/o, ti sorprende per…”.", "sigla": "Altro te", "esercizi": []}, {"titolo": "Quasi come Fregoli", "sotto": "", "rubrica": "Saturday Sun", "data": "sabato 24 ottobre 2026", "colore": "#0c5e9c", "consegna": "Scrivi un miniracconto che parla di una volta in cui, in piena consapevolezza e con intenzione, sei diventatə un’altra persona.\nUna volta in cui hai rotto un abitudine che pensavi indistruttibile, in cui hai dato una risposta che non avevi mai dato. O anche una volta in cui magari hai finto di essere un altrə e ti è piaciuto.\nUna volta insomma in cui in piena lucidità hai scelto di essere un altro personaggio.\nIn prima persona\nlunghezza massima: 16 righe\nincipit: La trasformazione comincia con…\ninserisci la parola terra", "sigla": "Fregoli", "esercizi": []}, {"titolo": "Camp Miasma", "sotto": "Flesh and fluids", "rubrica": "Saturday Sun", "data": "sabato 31 ottobre 2026, Halloween", "colore": "#0c5b45", "consegna": "Cosa sale dallo spaventoso lago della vostra adolescenza?\nNon c'è bisogno di un discorso coerente... possono essere immagini confuse, poetiche, spezzate. Niente teoria... solo Flesh and Fluids, Carne e Fluidi...\nTre o quattro righe, basta questo. Inizia così: “C'è un buco sul fondo del lago, dal quale...”", "sigla": "Camp Miasma", "esercizi": []}, {"titolo": "Storia di un piccolo cane blu", "sotto": "", "rubrica": "Saturday Sun", "data": "sabato 7 novembre 2026", "colore": "#daaa39", "consegna": "Il racconto di un momento in cui avete sentito nella vita una vera e propria chiamata.\nUn momento in cui avete sentito proprio “Sì! è questo. devo fare questa cosa, andare in questa direzione”. Senza dubbi, senza incertezze.\nPrima persona\nTempo presente\nMassimo 14 righe\nInserire la parola puro / pura / purezza\nincipit: Chiudo gli occhi e sono li, di nuovo, come fosse ora. Sto…\nfrase da inserire: una forza decisa e gentile che…", "sigla": "Cane blu", "esercizi": []}, {"titolo": "La Giustizia", "sotto": "Il giudice interiore", "rubrica": "Gli incontri", "data": "lunedì 9 novembre 2026", "colore": "#0c5e9c", "consegna": "Tre esercizi: <i>Incontrare il giudice</i>, dare un corpo e una voce al proprio giudice interiore e chiedergli “Di cosa hai paura?” e “Da che cosa mi stai proteggendo?”; <i>Quella volta in cui sono stata/o un angelo</i>, il racconto di quella volta in cui avete portato pace, equilibrio, calma, tra gli opposti, in terza persona, incipit “Tutto faceva pensare a una catastrofe. Era…”, con le parole misura e intelligenza; <i>La grande e bella ribellione</i>, in seconda persona: “Ti ricordi la tua grande bella ribellione? È stato quando…”, con la parola “lingua”.", "sigla": "Giustizia", "esercizi": [["Incontrare il giudice", "incontrare il giudice|giudice interiore", "Visualizzazione guidata: dare un corpo e una voce al proprio giudice interiore, e chiedergli “Di che cosa hai paura?” e “Da che cosa mi stai proteggendo?”.\nPoi scrivete subito: come si chiama il vostro giudice, com'è fatto, dove abita, che cosa vi ha risposto."], ["Quella volta in cui sono stata/o un angelo", "angelo", "Il racconto di quella volta in cui avete portato pace, equilibrio, calma, tra gli opposti.\nMinimo 11 righe.\nIncipit: “Tutto faceva pensare a una catastrofe. Era…”\nIn terza persona\nParole da inserire: misura, intelligenza / intelligente"], ["La grande e bella ribellione", "ribellione", "Ti ricordi la tua grande bella ribellione? È stato quando…\nContinua la frase, seconda persona\n15 righe circa.\nInserisci la parola “Lingua”"]]}];
const VOCI=[{"id": "t-o-le-mat-uno-tutti-nessuno-alexandra-pdf", "g": 0, "autore": "Alexandra", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-14T15:38", "incipit": "Sacro è l’ascolto della voce dell’Anima rimasta così a lungo sepolta sotto strati di silenzio da farmi…", "html": "<p class=int>1. Sacro</p><p class=st>Sacro è l’ascolto della voce dell’Anima rimasta così a lungo sepolta sotto strati di silenzio da farmi dimenticare che esistesse. Ora, quando si manifesta delicatamente nei momenti più inattesi, mi ripaga di quella lunga assenza.</p><p class=int>2. Per parlare di me bisogna prima parlare di...</p><p class=st>Per parlare di me bisogna prima parlare di Mario. Abruzzese trapiantato a Roma, a ventisei anni conosce al Piper una ragazza tedesca. Lei è alta, bionda, fidanzatissima in Germania, dove l’aspetta un matrimonio con la data già fissata. Sarebbe ripartita pochi giorni dopo verso nord.</p><p class=st>Mario ha altri progetti: si organizza, attraversa in Mini Morris le Alpi e si presenta davanti alla porta di lei con due prosciutti di Parma nel bagagliaio. Con quelli corrompe il padre di lei e convince la ragazza a fuggire insieme ad Amsterdam. Salta il matrimonio, quello con l’altro. E se ne svolge un altro, misto. Nel 1971 nasce la loro prima figlia.</p><p class=st>Per parlare di me bisogna prima parlare di Loreta. Nasce nel ‘17 in un piccolissimo paesino dell’Appennino abruzzese e non è proprio la ragazza che va d’accordo con tutti. Vuole essere indipendente, studiare, ha una visione. Per andare a L’Aquila alla scuola per ostetriche percorre chilometri a piedi, tutti i giorni. Prende il diploma e prende anche la patente. È l’unica donna, a quei tempi, a girare in macchina. Durante la guerra la chiamano per assistere le donne a partorire in casa. “Chiamate l’ostetrica!”, e lei partiva con la sua Topolino. Il suo di figlio nasce “settimino”: chiamavano così i figli che nascevano sette mesi dopo il matrimonio. Poi il trasferimento a Roma per seguire il marito. Finisce lì la sua visione. Ma l’ultima bambina che aiuta a nascere è sua nipote.</p><p class=int>3. Pangolino</p><p class=st>Quando la mano di lei si avvicina, lui esita. Il suo corpo ricorda ancora la paura, ma quella piccola carezza contropelo gli piace.</p><p class=st>Lui la guarda e cerca nei suoi occhi il coraggio di fidarsi, poi si lascia andare. Il cuore della padrona fa un piccolo saltello. La paura resta silenziosa, ma per un istante lui può riposare sotto la sua mano e lei solo sa quanto tempo ci sia voluto per abbandonarsi così.</p><p class=int>4. I miei Sargassi</p><p class=st>Lì io sono intera.</p><p class=st>Su quelle scogliere della Normandia, dove il vento mi spoglia.</p>"}, {"id": "t-o-le-mat-uno-tutti-nessuno-alexandra-pdf-oss", "g": 0, "autore": "Alexandra", "titolo": "La rocambolesca storia della mia ossessione per…", "apertura": false, "separato": true, "arrivo": "2026-10-14T15:38", "incipit": "Io stavo per dimenticare me stessa. Smarrita mi ero già, come nel labirinto di Creta da cui speravo di uscire ", "html": "<p class=int>5. La rocambolesca storia della mia passione per...</p><p class=st>Io stavo per dimenticare me stessa. Smarrita mi ero già, come nel labirinto di Creta da cui speravo di uscire insieme al mio Teseo. Il filo che ci legava da troppo tempo era come la corda di un diavolo che mi sentivo attorcigliata attorno al collo, alle caviglie, ai polsi. Non riuscivo a slegarmi.</p><p class=st>Una serie di coincidenze significative mi condusse, per la prima volta nella mia vita, a fare una lettura di tarocchi. Vidi quel Diavolo sul tavolo, la sua lingua sbeffeggiante e lo sguardo sfidante. Vidi me, ma anche l’altra, e il cappio al collo sembrava farsi ancora più stretto. Fu proprio guardando le Diable in faccia che le altre carte, come per miracolo, iniziarono a trovare il bandolo della matassa, ad allentare la presa e a porgermi quel filo di cui avevo bisogno per uscire dal labirinto, da sola. Stupita dal potere trasformativo degli Arcani, iniziai a maturare l’idea di studiarli, di approfondirli e infine di usarli per aiutare chi si fosse smarrito a ritrovare il filo.</p>"}, {"id": "t-un-31-ottobre-alice-2026-ottobre-12-docx", "g": 0, "autore": "Alice", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-07T16:00", "incipit": "Sacro – sacro mi richiama subito alla mente dissacrare – che è in effetti un riconoscimento, come la…", "html": "<p class=int>SACRO</p><p>Sacro – sacro mi richiama subito alla mente dissacrare – che è in effetti un riconoscimento, come la bestemmia dice dell’esistenza di Dio. Davanti al sacro divento circospetta, combattuta fra il timore il rispetto e la curiosità, soprattutto non vorrei farmi scoprire sacrilega, vorrei che restasse un po’ il dubbio – come quando da bambina mia nonna mi portava in chiesa e io aspettavo di venire colpita dal fulmine riservato agli atei, quello che pensavo di essere - anche se poi, al fulmine ci credevo. Sacro per me è il tempo serpente, sacro il ritorno all’uno, sacro il rispetto per i viventi.</p><p class=int>PER PARLARE DI ME BISOGNA PRIMA PARLARE DI</p><p>Il tempo. Einstein pare abbia scritto a non mi ricordo chi, in morte di un amico comune, “quelli che come noi conoscono la fisica, sanno che il tempo, la distinzione fra presente, passato e futuro, non è che un persistente e testardo errore di percezione”. Lo scorrere del tempo, il fatto di essere immersi senza scampo nel bagno del tempo, di non poter mettere fuori la testa per vedere cosa c’è al di là di questo flusso che ci travolge senza scampo, è una mia ossessione fin da bambina.  Ho provato a fare pace col tempo, a smettere di tirarlo di qui e di là, ho cercato di abbandonare l’illusione che si possa stirare, allargare, moltiplicare per farci stare più cose di quelle che ci stanno.</p><p>Da quando ho smesso di lottare contro il tempo ho visto che c’è un’altra direzione in cui si può andare per fare il tempo più largo, ed è la direzione opposta. Invece di correre per riempire, rallentare, svuotare. Invece della molteplicità, il fuoco, l’attenzione come il raggio di uno specchio ustorio. In questa direzione il tempo è illimitato.</p><p class=int>PANGOLINO</p><p>Alice si alza sulla punta dei piedi per guardare dentro al cassetto più alto. Mezza nascosta dalle camicie di seta della madre c’è una scatola in cartone pesante, spesso. Fa un saltello per controllare di non aver fatto troppo disordine, le stoffe sono scivolose, è un attimo mischiare tutto. Prende la scatola con entrambe le mani e delicatamente la appoggia al tavolo. La scatola si apre in due, il coperchio è poco più grande della scatola interna, si crea un risucchio, una attrazione che non vuole lasciarsi forzare.</p><p>Dentro la scatola, in mezzo al raso rosa, un carillon a forma di bambina che dorme – dal cappuccio azzurro sbuca un piccolo ciuffo di capelli mobidissimi, il busto un po’ quadrato, le braccia finiscono con due palline che, come la faccia, sono ricoperte da una stoffa di cui si vede la trama, finissima, come quando si guarda la pelle da vicino.</p><p>Quando il carillon suona, la bambola si muove, ma pochissimo, come un bambino potrebbe muoversi nel sonno. Mentre lo guarda Alice sente di essere a parte di un segreto, di essere ammessa a un mondo magico che nessuno altro sa, tranne lei e sua madre.</p>"}, {"id": "t-ntro-le-mat-uno-tutti-nessuno-aurora-pdf", "g": 0, "autore": "Aurora", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-14T22:08", "incipit": "Sacro è ciò che non è circoscrivibile, cioè che si situa al di fuori del tempo e dello spazio. È ciò che…", "html": "<p class=int>Sacro</p><p class=st>Sacro è ciò che non è circoscrivibile, cioè che si situa al di fuori del tempo e dello spazio. È ciò che tiene insieme le ossa della nostra realtà. Più si tolgono gli strati superficiali del reale – i pregiudizi, le proiezioni, le abitudini mentali, i concetti e alla fine anche il linguaggio stesso, e più ci si avvicina al sacro. È come pelare una cipolla: alla fine ci si ritrova senza niente, e quel niente è il sacro. Sacro è lo spazio tra le labbra degli amanti durante il bacio, impercettibile ma incolmabile; è il brivido che percorre il corpo di chi è innamorato, è il sistro che risuona durante l’iniziazione, è la musica e l’amore. Sacra è la nascita e il primo respiro, sacra è la morte e l’ultimo respiro. È il punto in cui l’inizio e la fine si incontrano e si annullano. La soglia tra due mondi e quindi, in ultima istanza, l’amore necessario per andare da uno all’altro. Sacro è il cuore, che è l’eterno mediatore, quello da cui tutto parte e si accende come una fiamma, e sacro è il suo battito, di cui poco sappiamo se non che continua, e che è il segno inequivocabile della vita. Sacra, quindi, è la vita.</p><p class=int>«Per parlare di me bisogna prima parlare di...»</p><p class=st>1) Per parlare di me bisogna prima parlare del mare, perché io non sarei ciò che sono se non fossi cresciuta vicino al mare. Il mare è qui da molto prima di me e lo sarà per molto dopo. È una meravigliosa e insondabile massa d’acqua che si estende per chilometri e chilometri, al di là dell’orizzonte. La sua acqua è salata, e questo impedisce agli esseri umani di berla, anche se purtroppo non gli impedisce di inquinarla. Il mare ospita tantissimi pesci, molluschi, alghe e specie di cui ancora non conosciamo il nome, e questo è un bene: una cosa molto interessante del mare, infatti, è che esso è perlopiù inesplorato. Molti attribuiscono al mare capacità curative e calmanti, e questo è dovuto alla sua natura avvolgente e materna, poiché le sue onde sono capaci di cullare chiunque decida di ascoltarle. Le onde del mare ci restituiscono a una dimensione senza tempo, fatta di cicli e vibrazioni. Ricorsive e circolari, esse riconducono a un eterno presente fuori dal tempo, dove tutto accade. Nel mare non c’è distinzione: si sente tutto, si tocca tutto; il mare sfida la ragione umana e i suoi confini, non si lascia del tutto comprendere, confinare, circoscrivere. Per questo amo il mare.</p><p class=st>2) Per parlare di me bisogna prima parlare di mia nonna, con la quale ho passato molto tempo quando ero piccola. Mia nonna ha un nome che ricorda i fiori, e in parte lei è come un fiore: sembra molto delicata, ma è immensamente forte, ha radici nella terra che le conferiscono la tenacia e la volontà delle montagne. La sua forza però non è mai separata dall’amore: tutto quello che fa (e che ha fatto), lo fa per amore. A mia nonna piace molto la natura, le piace imitare il canto degli uccelli – ci riesce molto bene! – e curare le piante, perché pensa che ogni essere vivente sia degno di cura. È ecologica senza essere ecologista, è cristiana senza essere religiosa, è semplicemente sé stessa. È anziana ma è anche bambina, le piace non prendersi sul serio, l’umorismo gentile, e le piace vedere la Luna sorgere al di là delle colline dal suo balcone. Mia nonna è dolcezza.</p><p class=int>Pangolino: il ritratto di qualcosa che è sacro, struggente e delicato.</p><p class=st>Aurora si trova tra le sale di una mostra fotografica. Ha abbastanza freddo, oggi si è vestita troppo leggera, ancora nostalgica dell’estate, e sta cercando di rimediare al danno avvolgendosi nella sua sciarpa verde. Si sente inerme, indifesa, perché intorno ci sono fotografie che in parte denunciano situazioni tragiche e drammatiche nel mondo, e in parte descrivono la sopravvivenza miracolosa della tenerezza, nonostante tutto. La mostra è quasi finita, resta soltanto l’ultima fotografia. Si avvicina. Nella fotografia c’è una donna che tiene in mano una rosa. Dietro di lei, altre donne fanno lo stesso gesto. La tengono vicina al petto, vicina al cuore. I loro sguardi sono addolorati, ma privi di rabbia o di rancore. Soprattutto trapela una cosa: la fermezza. Aurora si avvicina a leggere la descrizione, che è così piccola rispetto alla foto, e così piccola rispetto all’onda di emozioni che la sta già travolgendo. La foto descrive un momento decisivo nella storia del Guatemala. Un gruppo di donne indigene Maya Achi ha appena vinto una causa legale durata 14 anni contro gli uomini che le hanno molestate durante la guerra civile. Alcuni di questi uomini, dopo la fine del conflitto, erano diventati loro vicini di casa. Avevano condiviso le strade dello stesso quartiere per anni. Dopo un po’ queste donne si erano fatte coraggio, si erano riunite e supportate a vicenda, avevano deciso di denunciarli – e avevano vinto! Era meraviglioso. E meravigliosi erano quegli sguardi, sente Aurora, e quella richiesta ferma, coraggiosa, fatta attraverso il gesto di tenere una rosa tra le mani, di una cosa soltanto: rispetto. Quelle donne chiedevano rispetto. Lo chiedevano per sé stesse, e per tutte le donne. E lo facevano con un gesto che non veicolava violenza, desiderio di vendetta, di distruzione... no. Chiedevano amore e rispetto attraverso amore e rispetto. I loro sguardi erano addolorati ma in loro c’era ancora la speranza, viva, reale, di essere amate. Di essere viste. Di essere rispettate.</p><p class=st>Ad Aurora iniziano a scendere le lacrime, copiose, e in quel momento non la tocca il fatto che qualcuno intorno a lei la potrebbe cogliere in quel momento di totale vulnerabilità (probabilmente non è nemmeno l’unica ad avere quelle emozioni lì dentro). Dopo aver passato una buona manciata di minuti lì davanti, capisce che quanto è affiorato in lei è a un tempo universale e personale. Si allontana. Con un coraggioso saltello, intraprende il primo scalino per uscire dalla mostra e risalire lassù, in alto, nel mondo normale di tutti i giorni. Nelle mani stringe una rosa invisibile. Non la lascerà mai più andare.</p><p class=int>I miei sargassi: il posto al quale torni, quando hai bisogno di rinascere</p><p class=st>Il mare sotto la falesia</p><p class=st>Lì, io sono indisturbata, felice, i miei contorni si confondono con quelli delle cose. Sono il cielo, sono il mare, sono le onde che galoppano, sono il vento, sono la sabbia che scivola tra le dita, il monte che mi abbraccia e mi protegge, le colline distanti e vicine, il canto della valle che incontra quello dell’acqua. Io sono casa.</p>"}, {"id": "t--le-mat-uno-tutti-nessuno-claudia-g-docx", "g": 0, "autore": "Claudia", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-15T23:43", "incipit": "Non sono religiosa e quindi attribuisco alla parola “ sacro”un senso figurato.Sacro per me è il rispetto, la…", "html": "<p class=int>Sacro</p><p>Non sono religiosa e quindi attribuisco alla parola “ sacro”un senso figurato.Sacro per me è il rispetto, la libertà di essere, la famiglia.</p><p class=int>Per parlare di me, bisogna prima parlare di...</p><p>Bisogna prima parlare del mio primo cane Bill, ricevuto in regalo all’età di 8 anni. Con Bill il legame creatosi era molto forte, era un essere libero, scappava sempre,inseguendo gatti e cagnoline in amore.</p><p>Ce l&#x27;hanno rubato, ho smesso di mangiare e di dormire.</p><p>Si è ammalato quando ero a Roma, e la notte che è mancato , alle 4,30, mi sono seduta sul letto e ho detto “Bill è morto” ..ed era così.</p><p>Bisogna prima parlare della mia zia Malu’, artista, cantante lirica, delicata nell’aspetto ma con il fuoco dentro. Viveva per la musica e per il suo grande amore.</p><p>Il frigo era sempre vuoto, dovevo correre ad acquistare approvvigionamenti se volevo mangiare, perché la casa era sempre piena di artisti che cantavano,facevano scenette, ridevano e si raccontavano..mangiare? c’è sempre tempo!!</p><p>La zia Malu’ mi ha insegnato che amare è la cosa piu’ bella che possa succederci nella nostra vita.</p><p class=int>Pangolino</p><p>Claudia ha sempre amato gli animali in generale, ma con i gatti il feeling non era dei migliori.</p><p>Graffi e morsi era quello che aveva ottenuto nei tentativi di approccio.</p><p>Quando comprò la casa dei suoi sogni vi trovò una colonia felina!!</p><p>Gatti ovunque che cercavano in tutti i modi di fare i simpatici , entravano in casa , facevano le fusa e allora Claudia si è detta che forse i gatti incontrati in passato non erano dei più amichevoli.</p><p>Claudia ora è una vera e propria “ gattara”!</p><p>La quota  è salita a 22 gatti!! Eh si!! Una gatta furbona quest’anno mi ha regalato sei gattini , un’altra tre e poi , come ciliegina sulla torta , ne è arrivato uno  tutto nero, con due grandi orecchie , magro magro e lui , Pippi, con un saltello qua e un saltello la’ , è diventato il re della casa.</p><p>Claudia non sa come farebbe senza i suoi animaletti.</p><p class=int>I miei sargassi.Il posto dove torni quando hai bisogno di rinascere</p><p>Madre terra quando aggeggio in giardino.</p><p>Lì io sono felice, respiro a pieni polmoni e ritrovo me stessa.</p>"}, {"id": "t--le-mat-uno-tutti-nessuno-claudia-g-docx-oss", "g": 0, "autore": "Claudia", "titolo": "La rocambolesca storia della mia ossessione per…", "apertura": false, "separato": true, "arrivo": "2026-10-15T23:43", "incipit": "Stavo per aprire un Bed& Breakfast / Casa vacanza  almeno cinque volte nella mia vita, ma le condizioni e i fa", "html": "<p class=int>La rocambolesca storia della mia ossessione/ passione</p><p>Stavo per aprire un Bed&amp; Breakfast / Casa vacanza  almeno cinque volte nella mia vita, ma le condizioni e i fatti successi nella mia vita alla fine non me l’hanno mai permesso.</p><p>Quando vedo una bella casa, dei bei appartamenti, si riapre il cassetto dei desideri e la mia testa comincia ad elaborare ristrutturazioni , arredamenti, siti web.. poi niente.</p><p>Ma sono convinta che la situazione stia per maturare e riuscirò a realizzare la mia ossessione.</p>"}, {"id": "t-o-le-mat-uno-tutti-nessuno-federica-docx", "g": 0, "autore": "Federica", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-20T18:18", "incipit": "Sacro per me è qualcosa di immateriale, ma anche di molto corporeo.", "html": "<p class=int>1. Sacro</p><p class=st>Sacro per me è qualcosa di immateriale, ma anche di molto corporeo.</p><p>Sacro è l’ascolto dell’interno e dell’esterno.</p><p>Sacre le immagini che prendono forma nella testa, mischiate con quelle che arrivano da fuori.</p><p>Sacro - per me - è l’incontro tra quello che succede dentro e quello che accade fuori, sacro è il modo in cui questi mondi danzano e danno vita a un altro mondo ancora, che non appartiene a me anche se è dentro di me che si è creato.</p><p>Sacra è la possibilità di accogliere qualcosa che arriva da fuori di me, da altrove; guardarla, ascoltarla, non per forza capirla, ma in-corporarla, e magari trasformarla.</p><p>Una cosa importante: non c’entra la mente, c’entrano la pancia, il cuore, l’intuizione.</p><p class=int>2. Per parlare di me, bisogna prima parlare di...</p><p class=st>Il fiume Trebbia</p><p>La Trebbia è un fiume dell’Italia settentrionale lungo circa 120 km, affluente di destra del Po, che nasce in Liguria, attraversa la città metropolitana di Genova e le province di Piacenza e Pavia.</p><p>È uno dei fiumi più puliti d’Italia - forse addirittura IL fiume più pulito d’Italia, o almeno mi piace pensare che lo sia.</p><p>Quando ero piccola con la mia famiglia avevamo una casa in val Trebbia, in un paesino che si chiama Frassi, dove andavamo molto spesso. È stato il primo fiume in cui ho fatto il bagno. Ho sempre avuto una grande fascinazione per questo fiume e per i luoghi meravigliosi che attraversa, le sue grandi anse e la sua corrente buona anche dove scorre con più veemenza.</p><p>Appena posso torno a trovarlo.</p><p class=st>David Bowie</p><p>Nella casa di Frassi ho visto molti film, e come spesso fanno i bambini i film preferiti li ho visti e rivisti molte volte. Il film che ho rivisto più volte in assoluto - per un’estate intera credo di averlo rivisto tutti i giorni - è Labyrinth, un film fantastico che racconta la storia di una ragazza il cui fratellino viene rapito dal re dei Goblin e lei deve attraversare appunto questo labirinto per andare a riprenderlo. Il re dei Goblin è interpretato da David Bowie, che io all’epoca non conoscevo ancora, non sapevo che fosse lo straordinario genio che è stato (non si può chiamare solo musicista, è riduttivo). Però guardavo quel film e sentivo per lui un fascino irresistibile, misto a un vago senso di colpa dato che lui è il cattivo del film, quindi c’era questa attrazione, proprio fisica, che però non sapevo bene come gestire. Sicuramente non era solo una questione di bellezza, non si può dire che David Bowie non sia bello ma non è il mio tipo; era più la sensazione di essere di fronte a una creatura, a qualcuno che ha sembianze umane ma che non è totalmente di questo mondo.</p><p>E infatti, quando tempo dopo ho iniziato ad ascoltarlo e conoscerlo ho avuto la certezza, ma non lo dico solo io, che sia così, che Bowie sia davvero uno spirito, una particella, un grande tramite dell’altrove che si è manifestato in questo mondo, e io sono grata di essere stata testimone, seppure da lontano, del suo passaggio su questa terra.</p><p class=int>3. Pangolino</p><p class=st>Federica e Carlo avevano deciso di prendere un cane. L’aveva scelto lei, dopo che Carlo le aveva fatto vedere un annuncio. Federica aveva visto le foto del piccolo Raiker - all’epoca aveva due-tre mesi - e non aveva avuto dubbi: è lui.</p><p>E dire che avevano deciso di prendere una femmina, possibilmente adulta.</p><p>Un giorno di febbraio 2020 Carlo e Federica vanno a Biassono, nel varesotto, a prendere Raiker dalla famiglia che lo stava tenendo in stallo.</p><p>Appena Federica varca la soglia della porta, Raiker si catapulta giù dalle scale e le salta letteralmente addosso. Poi si scaraventa in cucina e da lì in salotto, superando con un saltello la porta a vetri - a cui mancava un vetro per fortuna. Insomma, il piccolo Raiker - non così piccolo per avere tre mesi - manifesta da subito del grande entusiasmo. Lo caricano in macchina e lo portano a casa.</p><p>La prima grande emozione è il viaggio verso Milano. Raiker sta male, soffre la macchina e vomita praticamente per tutto il tempo. Carlo guida e Federica sta sul sedile posteriore accanto al cagnolino, lo accarezza, cerca di tranquillizzarlo, pulisce il vomito. Sente nel petto un groppo di tenerezza e dispiacere. È struggente vedere quella piccola creatura che soffre, e Federica si sente in colpa per averlo strappato da un luogo in cui forse lui stava bene e ora costringerlo ad affrontare quel viaggio verso la città.</p><p>Arrivano finalmente a casa. La prima cosa che Raiker fa dopo aver varcato la soglia è la cacca, in mezzo al salotto. Rincuorante, si sente a suo agio.</p><p>Poi si mangia e si va a nanna, è stata una giornata piena di emozioni per tutti, c’è bisogno di andare a dormire. Per Raiker viene messo un cuscino accanto al letto, dove lui si accuccia e in poco tempo si addormenta.</p><p>E qui arriva la seconda grande emozione. Federica non chiude occhio per tutta la notte, ogni tanto deve alzarsi e controllare che Raiker stia respirando e non muoia durante il sonno. Non aveva mai provato una cosa del genere, un senso di protezione  così grande verso un’altra creatura. La sensazione che questo cagnolino, piccolo, tenerissimo, indifeso, dipenda da lei, che la sua vita letteralmente dipenda da lei. Federica non ha figli, e probabilmente non ne avrà, ma pensa che questa sensazione sia la cosa più vicina alla maternità che lei possa sperimentare. Una grande tenerezza, un grande amore e allo stesso tempo una specie di dolore, come se non fosse possibile l’uno senza l’altro.</p><p class=int>4. I miei sargassi</p><p class=st>Lì, io sono intera, nel senso che torno alla mia integrità. Ma mi è anche molto chiaro che sono solo una parte del tutto, ed è l’acqua a ricordarmelo.</p>"}, {"id": "t-o-le-mat-uno-tutti-nessuno-federica-docx-oss", "g": 0, "autore": "Federica", "titolo": "La rocambolesca storia della mia ossessione per…", "apertura": false, "separato": true, "arrivo": "2026-10-20T18:18", "incipit": "Io stavo per scrivere a Fulvio che non avrei fatto questo esercizio, perché non ho nessuna vera ossessione. Pa", "html": "<p class=int>5. La rocambolesca storia della mia ossessione per...</p><p class=st>Io stavo per scrivere a Fulvio che non avrei fatto questo esercizio, perché non ho nessuna vera ossessione. Passioni ne ho tante, fin troppe, ma la verità è che essendo ascendente gemelli mi innamoro facilmente delle cose ma altrettanto facilmente mi annoio, dunque non approfondisco quasi niente. Questo è sempre stato un mio cruccio: la mia incapacità di andare a fondo, a meno che io non sia costretta a farlo per cause di forza maggiore (un tempo la scuola, ora il lavoro).</p><p>Però poi ho pensato che un’ossessione non prevede per forza lo studio approfondito di un argomento specifico; può anche essere un pensiero che si ripropone costantemente, che genera altri pensieri e domande, e finché non c’è risposta quelle domande continueranno a maturare, e l’ossessione pure.</p><p>Quindi confesserò senza ulteriore indugio la mia ossessione per le coppie composte da  persone grasse.</p><p>Già qui mi sento in imbarazzo, perché non voglio assolutamente fare bodyshaming né offendere nessunə (il fatto di aver appena usato lo schwa mi pulisce un poco la coscienza) - ma non so che parola usare al posto di grasso per intendere sovrappeso (parola che mi sembra ancora peggio).</p><p>L’ossessione non deriva dalla questione del peso in sé, quanto dal fatto che di solito le persone grasse in coppia si assomigliano. È abbastanza comune che le persone in coppia, specialmente se insieme da tanto tempo, si assomiglino, un po’ come i cani ai padroni (o viceversa?). Però secondo me - fateci caso se vi capita - le persone grasse quando sono in coppia si assomigliano di più. Si assomigliano, voglio dire, come se si fossero proprio trovate, come se le avessero disegnate per stare insieme. Non so in che altro modo spiegare quella che è solo una mia sensazione, perché mi rendo conto che non ha nessun fondamento scientifico né probabilmente è argomento che possa interessare a qualcuno - infatti non ne ho mai parlato con nessuno prima d’ora, e questa è certamente anche l’ultima volta che lo faccio, dato che continuo a vergognarmi.</p><p>Non saprei dire da dove venga questa mia ossessione. Le osservo senza giudizio, non in maniera morbosa (spero), con sincera curiosità.</p><p>E, mentre le guardo, mi sorgono nella testa delle domande. Mi chiedo: erano già così simili o lo sono diventate a furia di stare insieme? unə dei due era magrə quando si sono conosciutə ed è ingrassatə nel corso del tempo? a una persona magra può piacere una persona grassa? e a una persona grassa può piacere una persona magra, o a ciascunə di loro, in origine, piacevano già le persone grasse? cioè, il fatto di essere grassə ti fa piacere automaticamente una persona grassa? come a dire che se sei grassə non puoi pensare di piacere a un magrə, quindi ti tocca stare con la gente come te?</p><p>Non so perché mi faccio queste domande; credo principalmente perché se la risposta all’ultima domanda fosse sì, allora sarebbe tristissimo, vorrebbe dire che la normatività applicata al nostro corpo determina anche i nostri desideri, quindi li contiene e li limita. Perché alla fine il desiderio non è solo frutto della nostra immaginazione, ma dipende in larga parte da quello che vediamo, da quello che ci viene offerto e da quel che riteniamo opportuno e lecito avere. Desideriamo quel che riteniamo possibile.</p><p>Mi sento orribile e tremendamente in colpa mentre osservo quelle coppie, prima di tutto perché le sto categorizzando solo per l’aspetto fisico, e in secondo luogo perché sto dando per scontato che quelle persone non siano felici; e chi sono io per dirlo, magari loro se ne fregano altamente degli standard estetici dominanti, abitano i loro corpi con gioia e sono felici e fierə di essere lì, con i loro corpi e con la persona che amano.</p><p>Forse le cose sono così, più semplici. O forse no, e tuttə soffriamo in un modo o nell’altro per gli standard che ci vengono imposti e che sentiamo di dover soddisfare, per i limiti che ci impediscono di ampliare i nostri desideri e dunque le nostre possibilità.</p><p>O forse, più probabilmente, entrambe le cose: si può essere felici ma anche sofferenti, consapevoli ma speranzosə, arrabbiatə ma amorevoli e gioiosamente ribelli.</p><p>Si può criticare la realtà e immaginare un’alternativa.</p><p>Ci si può portare in giro con orgoglio, manifestare il proprio desiderio, anche se difforme dalla “norma”.</p><p>Affinché la propria libertà sia di ispirazione per la libertà di tuttə.</p><p class=st>“I desideri non sono naturali o innati; sono formati, incanalati e standardizzati dalle istituzioni sociali per mantenere in piedi l’ordine eteronormativo e di genere”.</p><p class=st>Judith Butler, Questioni di genere</p><p class=st>“Ci sono due giovani pesci che nuotano uno vicino all’altro e incontrano un pesce anziano che, nuotando in direzione opposta, fa loro un cenno di saluto e poi dice: “Buongiorno ragazzi, com’è l’acqua?” I due giovani pesci continuano a nuotare per un po’, e poi uno dei due guarda l’altro e gli chiede: “Ma cosa diavolo è l’acqua?”</p><p class=st>David Foster Wallace, This is water</p>"}, {"id": "t-e-mat-uno-tutti-nessuno-giusy-russo-docx", "g": 0, "autore": "Giusy", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-14T21:59", "incipit": "Sacro è il corpo della donna. È il sole che lo scalda e che nessuno può toccare. Un detto buddista dice: \" tu…", "html": "<p class=int>1. SACRO</p><p>Sacro è il corpo della donna. È il sole che lo scalda e che nessuno può toccare. Un detto buddista dice: &quot; tu non sei un corpo con un&#x27;anima, tu sei un&#x27;anima che ha un corpo&quot;. Nella donna corpo e anima si fondono. E questa fusione avviene grazie al sole. Tutti associano la donna alla luna. È più il sole che la rappresenta, invece. La luce, il cuore, il calore. E l&#x27;essere femminile, l&#x27;essenza femminile in generale è il centro pulsante della Terra. Il fuoco del mondo.</p><p class=int>2. PER PARLARE DI ME BISOGNA PRIMA PARLARE DI...</p><p class=st>Nadia. Era una bambina come me. Ma veramente diversa, da me. Avevamo in comune la classe, un banco, e il segno zodiacale. Lei aveva capelli biondi e lisci, occhi azzurri ed era pallida e magra, col naso all&#x27;insù. Due bei denti da coniglio. E non si arrabbiava mai. Io ero il suo opposto, eppure la amavo moltissimo. A un certo punto desiderai davvero che fosse lei mia sorella. Sognavo di fare una serie di operazioni da grande, per somigliarle di più. Il fato &quot;cinico e baro&quot; si mise di mezzo, regalandomi il secondo dei miei grandi lutti. Si trasferì con la famiglia in una nuova città. A dieci anni. E da quel giorno io e lei abbiamo sempre dieci anni e ci vogliamo bene per sempre, in una dimensione parallela. Senza saperci più.</p><p class=st>Pippi era un gatto rosso. Persiano. Arrivato in casa per volontà della sorellina, dopo che per anni avevo chiesto senza successo un cane. Ma si sa che dove i maggiori non riescono, i fratelli piccoli hanno la meglio sulla resistenza genitoriale. Nato da nobile stirpe, il suo vero nome era &quot;Rajah&quot;, &quot;re&quot; in lingua indiana, ma per noi lui era Pippi. Morbido e buono e perfetto come un pelouche. Mia sorella Caterina lo andava a trovare ogni giorno nel negozio di animali all&#x27;uscita dal liceo, un giorno lo comprò e lo portò a casa. Ma Pippi, dal primo giorno, decise di scegliere me.</p><p class=int>3. PANGOLINO</p><p>Aveva organizzato un concerto nel suo locale col suo amico di vecchia data Genesio. Sapeva che era un maestro di musica e che, da buon napoletano, cantava bene. Ma a quel concerto Genesio decise di portare non solo la sua voce e la chitarra. Portò invece uno strumento bellissimo, antico, dall&#x27;aspetto simile a uno scudo medievale. Lo teneva tra le ginocchia, accovacciato a terra come un mendicante bambino. Le rivelò divertito che il suo strumento si chiamava &quot;handpan&quot;. Infatti si suonava sfiorando con i polpastrelli le concavità dello scudo, e produceva un suono celestiale e polifonico, tanto che lei nell&#x27;ascoltarlo fece un saltello dall&#x27;emozione e dalla paura.</p><p class=int>4. I MIEI SARGASSI</p><p>Lì, io sono me. Ossia, uno, nessuno e centomila. Davanti a un mare qualsiasi, mi trasformo in una delle sue onde. Come loro testarda, ottusa verso l&#x27;obiettivo, insieme e suicida. Ma che rinasce sempre.</p>"}, {"id": "t-e-mat-uno-tutti-nessuno-giusy-russo-docx-oss", "g": 0, "autore": "Giusy", "titolo": "La rocambolesca storia della mia ossessione per…", "apertura": false, "separato": true, "arrivo": "2026-10-14T21:59", "incipit": "Io stavo per rinunciare definitivamente alla mia passione per la pittura. Era il 2014, mia madre morta da poco", "html": "<p class=int>5. LA ROCAMBOLESCA STORIA DELLA MIA OSSESSIONE PER...</p><p>Io stavo per rinunciare definitivamente alla mia passione per la pittura. Era il 2014, mia madre morta da poco. Lei faceva la pittrice e scenografa di professione. Insegnava, anche; diametralmente opposti i nostri caratteri, i nostri gusti e lo stile. Io arrancavo da autodidatta dietro i suoi dogmi da accademia, ma ero nata e cresciuta in mezzo ai colori, mai avrei pensato di poter vivere senza. Eppure, per quattro lunghi anni, dopo la sua morte, non ero riuscita a dipingere. Poi, una mattina, svegliandomi (io mi sveglio sempre &quot;filosofica&quot;), decisi che il mio lutto pittorico fosse finito. Mia madre non avrebbe preteso da me un tale sacrificio, anche se in vita non faceva altro che correggermi. Erano giorni che dopo il lavoro passavo a curiosare nella vetrina di uno studio di pittura; vendeva opere di un&#x27;artista che insegnava anche: lavorava secondo un metodo contrario ai canoni classici dell&#x27;Accademia, il metodo di Betty Edwards, artista americana che valorizzava la pittura scaturita dalla parte destra del cervello, quella &quot;emozionale&quot;, ed enfatizzava gli spazi negativi tra le immagini rappresentate. Questa piccola rivoluzione mi affascinava e sentivo di dover maturare per riappropriarmi di questa passione in comune con mamma. La sentivo di nuovo vicina ma al tempo stesso ero libera dai suoi insegnamenti, libera di avvicinarmi al mio centro senza il bagaglio pesante del suo giudizio. L&#x27;insegnante, scoprii in seguito, era altrettanto rigida e intransigente, ma aveva capito la mia essenza, e aveva deciso di non modificarla. Imparai il suo metodo e lo misi in pratica con le mie regole. Passai dieci anni con lei. Poi, quando anche lei se ne andò, altri cinque con altre insegnanti, e ancora una volta, e grazie a lei, la pittura è parte integrante della mia vita.</p>"}, {"id": "t-tti-nessuno-opera-arcana-1-ilaria-f-docx", "g": 0, "autore": "Ilaria", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-16T16:54", "incipit": "SACRO: agg.maschile che indica la capacità propria di luoghi / azioni / oggetti di prescindere il reale…", "html": "<p>SACRO: agg.maschile che indica la capacità propria di luoghi / azioni / oggetti di prescindere il reale tangibile e offrire pretesti per generare significato e senso laddove sembra non esistere.</p><p class=int>“PER PARLARE DI ME BISOGNA PRIMA PARLARE DI...”</p><p>Due minibiografie, max 11 righe</p><p>ANIMALI – OGGETTI - AVVENIMENTI STORICI – PERSONE</p><p class=int>“PER PARLARE DI ME BISOGNA PRIMA PARLARE DI...”</p><p>..una valigia, o forse due, chiuse e riposte nel garage di mia madre, dove ho nascosto i diari scritti e gli oggetti raccolti in circa 11 anni. Oggi non so cosa ci sia in quelle valigie. Ho deciso di riaprirle in una data del futuro, data che a memoria non ricordo. L’idea delle valigie non è mia ma è frutto di un viaggio a Roma di circa 20 anni fa. Ci sono arrivata in auto, dopo ore di coda sul grande raccordo anulare, quando la mia auto non aveva il navigatore e per cui mi chiedo ancora come sia riuscita ad arrivare a destinazione. Avevo forse una cartina? Una guida di Roma? Avevo stampato la mappa in qualche internet point dall’odore di toner e aglio? Non ricordo. Sono stata ospite di un amico napoletano che viveva al tempo nella casa di un suo zio romano. Una casa borghese, con un parquet di un marrone caldo, come calda era la luce della lampada del soggiorno, dove lo zio aveva lasciato 3 vecchie valigie impilate in un angolo, corredate da una piccola etichetta che diceva “da riaprire solo nel 2030”. Il 2030, che sembrava così lontano, si avvicina. Chissà quando anche io potrò riaprire le mie valigie, nascoste in un garage di provincia a prendere polvere.</p><p class=int>“PER PARLARE DI ME BISOGNA PRIMA PARLARE DI...”</p><p>... un guscio di noce che un nonno ha tramutato nel volto di un piccolo topo, con le setole di una scopa come baffi e un paio di piccole orecchiette in cuoio.</p><p class=int>Come un PANGOLINO</p><p class=st>La strada ondeggiava lungo la collina. La chiesa, la scuola, l’insegna del bar all’angolo “giovedì gnocco fresco”. Solo il panettiere si era ormai trasferito sull’altro lato della strada, di fianco al supermercato. Nonostante la grande distribuzione fosse riuscita a piantare bandiera anche lì, dove sembrava che il capitalismo non sarebbe mai arrivato, i tortelli con il cuore di prugna, il profumo della torna di riso e le pagnotte addensate dallo strutto, anche se un centinaio di metri più giù, continuavano a resistere.</p><p>L’auto superò i caseggiati e si trovò di fronte il cantiere che da almeno dieci anni era rimasto uguale a sé stesso. Il tempo si muoveva lento alle pendici del colle del Fèlés, come se il profumo dell’erba medica prima del taglio avesse il potere di fermare le lancette.</p><p>Dal finestrino videro il grande caseggiato bianco avvicinarsi: imponente, fiero, di una dignità d’altri tempi e come l’auto fu parcheggiata al suo fianco, con un saltello si trovarono con i piedi tra la menta selvatica e i ciottoli bianchi.</p><p>Tutto sembrava essere come sempre era stato e invece, sorprendentemente, il mandorlo custodiva una sorpresa per i suoi fedeli visitatori. La maledizione del fulmine che l’aveva colpito sembrava finalmente avergli dato tregua e dalle ceneri dei suoi rami secchi, le gemme si accendevano di un verde vivace. Il tempo, cosi discreto nel manifestarsi in quei luoghi, aveva silenziosamente curato le ferite dell’albero, riportandolo alla vita.</p><p class=int>I MIEI SARGASSI</p><p class=st>Lì, io sono pronta a tuffarmi. Che sia in mare o in un bicchiere di pastis, dipende dalle giornate, ma l’effetto è sempre lo stesso: i pensieri negativi lasciano spazio alla serenità. Una torre, rocce chiare, orizzonti lontani e il portico di un bar senza tempo.</p>"}, {"id": "t-uno-rocambolesca-ossessione-ilaria-f-pdf", "g": 0, "autore": "Ilaria", "titolo": "La rocambolesca storia della mia ossessione per…", "apertura": false, "separato": true, "arrivo": "2026-11-06T19:28", "incipit": "Io stavo per inforcare la bici per tornare a casa.", "html": "<p>Io stavo per inforcare la bici per tornare a casa.</p><p class=st>Era notte, erano i tempi in cui restavo fino a tardissimo a consumare i banconi dei bar, parlare anche con i muri, far rotolare i cubetti di ghiaccionell’amaro contro le pareti di un bicchiere di plastica scadente, quando il biodegradabile era ancora futuristico, ma portare un bicchiere di vetro per strada era già punibile dalla legge, manco avessi ammazzato un bambino.</p><p class=st>Ma torniamo alla bici, che gli amari allontanano dagli scopi.</p><p class=st>Inforcavo la mia bicicletta tinta di azzurro e decorata con piccole nuvolette bianche, disegnate con amore ad una ad una.</p><p class=st>“Consuelo, è ora di andare, basta bere!”, le avevo dato un nome perché in fondo l’amavo, la sentivo come se fosse il mio animale domestico, la mia amante e figlioccia, e per questo sentivo di non poterla lasciare innominata. Il nome a volte è come il punto alla fine di una frase, non puoi non mettercelo.</p><p class=st>La mia bici si chiamava Consuelo, capace di portarmi con la testa (e il corpo) in luoghi remoti, avevo bisogno che lei, come me, non perdesse il contatto con la Terra:“con-suelo”, per questo il suo nome. Quella sera non ero sola, con me c’era lui, Roccia, anche lui in bici, anche lui rigonfio di amaro. Quella sera saremmo rientrati insieme, le lenzuola scomposte ci aspettavano, e l’alcol in corpo richiedeva di essere sudato fuori al più presto, ma la luce aranciata al sodio, che riverberava sulle chianche delle strade, ci tratteneva nelle vie del centro fino a tarda notte. Una figura con andatura incerta si avvicinò. Un uomo dalla carnagione scura e le vesti di seconda o terza mano, troppo pesanti per la stagione sempre mite di quelle latitudini, raccontavano di storie di paesi lontani, mari attraversati e terre percorse con mezzi di fortuna.</p><p class=st>Avevo già visto quell’uomo passeggiare tra quelle strade. Aveva un’aria simpatica, anche lui credo non disdegnasse gli amari e l’alcol in varie forme, forse grazie a questo il sorriso, che lasciava intravvedere una manciata di denti mal distribuiti tra le fauci, restava così stabile su un volto le cui rughe raccontavano una profonda nostalgia.</p><p class=st>Ci regalò due elefantini di pezza, uno lilla per la mia Consuelo e uno rosso per la bici di Roccia. Non poteva sapere che in quel momento della vita il pensiero degli elefanti veniva a trovarmi in continuazione. Gli elefanti in quegli anni avevano preso il posto delle libellule. Forse per una questione di attrazione tra gli opposti. Ovviamente i due animali, così diversi, si affiancavano solo nel mio animo, non certo per Linneo. Per lui non credo esistesse soluzione di continuità tra loro. L’idea che un animale guida potesse aiutarmi a non perdere la bussola era iniziata qualche anno prima, quando avevo perso la bussola, eccome! Non ricordo perché le libellule avessero iniziato ad affascinarmi. Era successo, semplicemente, e quando ne vedevo una, soprattutto nei luoghi e nei momenti più impensati, sentivo di essere nel posto giusto e al momento giusto. Per l’elefante era stato diverso. Avevo ricevuto in dono il pensiero fisso per gli elefanti da un amore mai sbocciato. Un amore platonico e teutonico, che mi aveva disegnato maldestramente un elefante con dei pastelli a cera trovati tra le cianfrusaglie che avevo con me. Quel disegno, a tratti infantile a tratti onirico, era finito sulla porta di camera mia. Fedele, intelligente, sensibile. Mesi dopo avevo trovato un elefante scarabocchiato da lui anche tra le pagine del mio primo libro sui Tarocchi. A volte ritornano.</p><p class=st>Qualche giorno fa ho visto le foto di un’elefantessa che portava per chilometri il corpo defunto di un cucciolo. Il cucciolo non era il suo, era il cucciolo di una compagna di branco, ma la stessa elefantessa aveva visto morire uno dei suoi cuccioli poco tempo prima. Una processione funebre forse per sé, forse per l’elefantessa sua compagna, forse per l’intero branco. Incredibile. Gli elefanti continuano a sorprendermi, ma al loro posto gli animali guida nel mio spirito si sono dati più volte il cambio. C’è stato il tempo delle balene, il tempo dei grandi volatili migratori, quello del polpo.</p><p class=st>C’è spazio per tutto il regno animale nel mio animo: nel tempo ho visto maturare l’interesse per l’uno e per l’altro animale in maniera casuale, senza poterlo prevedere.</p><p class=st>E forse la parola interesse non può descrivere a pieno lo stato che mi provoca l’incontro con un nuovo animale guida. Ne rimango affascinata, nel senso antropologico del termine, vittima dell’affascino. Come ebbra e drogata, ne divento preda.</p><p class=st>Quando un animale lascia spazio al successivo, quello precedente non mi lascia, cede solo il posto d’onore e resta in disparte, e nel frattempo l’animo si popola, come il giardino dell’Eden. Come se ogni animale parlasse una sua lingua e ogni lingua appresa svelasse una parte del creato. La libellula allargava lo spazio, l’elefante insegnava le relazioni, le balene mostravano come vivere anche in apnea, gli uccelli migratori non temevano il ritorno, il polpo insegnava a nuotare nel buio. Mi chiedo se ci siano nuovi animali in arrivo. Mi è venuta voglia di fargli spazio.</p>"}, {"id": "t-ontro-le-mat-uno-tutti-nessuno-luca-docx", "g": 0, "autore": "Luca", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-14T23:08", "incipit": "L'essere umano definisce sacro tutto ciò che lo connette col divino (verrebbe da chiedersi che cos'è il…", "html": "<p class=int>DEFINIZIONE DI SACRO</p><p>L&#x27;essere umano definisce sacro tutto ciò che lo connette col divino (verrebbe da chiedersi che cos&#x27;è il divino, ma non è questo il momento).</p><p>Sacro può essere un rituale, una danza, una rappresentazione, proprio perché costituiscono ponti verso ciò che esula dalla materia, sconfinando nel territorio del mistero. Ha la stessa radice di sacrificio, ovvero l&#x27;azione di privazione che l&#x27;essere umano fa per volere di una divinità, grazie alla quale si garantisce la sua benevolenza.</p><p class=int>PER PARLARE DI ME BISOGNA PRIMA PARLARE DI…: 2 MINIBIOGRAFIE</p><p>Hans Schnier, professione clown, nato a Bonn prima della seconda guerra mondiale da famiglia facoltosa (il padre era un industriale del carbone). I più lo ricordano come abile intrattenitore, distinto acrobata,  personalità dal carattere cangiante. trascorse la sua giovinezza insieme a una donna, Marie Knebel, con cui fuggì da Bonn per condurre una vita nel peccato, come la definirebbero i cattolici del tempo. Dopo qualche anno di buoni ingaggi in giro per la Germania del dopoguerra la sua attività subì un tracollo, dovuto, si dice, alla fine della sua relazione d&#x27;amore. I suoi insuccessi furono tali che, dopo una fallimentare performance in cui si infortunò a una gamba, non lo si vide più calcare le scene.</p><p class=st>La Salsa, non quella al pomodoro, quella fatta con la musica. Si dice si chiami così perché la facevano con i ritmi del caribe, mischiati...Colombia, Cuba, Venezuela, Portorico, Santo Domingo tutti quanti shakerati nel barrio di Nueva York; ecco quella cosa lì forma la Salsa. O forse si chiama così per via dei barattoli Campbell che erano lo sponsor radiofonico della trasmissione che inondava le orecchie degli immigrati ne las calles. Un mix quindi, di culture, di pelli, di rituali, di gambe e braccia e tronchi e bacini, soprattutto di bacini. &quot;Mueve la cintura mulato&quot; è il ritornello cantato da Omara Portuondo. Un mondo in cui non c&#x27;è filologia, o meglio c&#x27;è come ci può essere in un paese pugliese per capire chi ha inventato le orecchiette.</p><p class=int>PANGOLINO: QUALCOSA CHE PER TE è SACRO</p><p>Luca è seduto da solo e allo stesso tempo insieme a tutta l&#x27;umanità. Accade a un certo punto che tutto si confonde, gira il mondo gira e si proietta davanti a lui in un modo che non aveva mai visto e assaporato prima. Si potrebbe definire un mondo nuovo ma non si può definire perché è strano, cangiante, camaleontico, sgusciante. La sensazione che Luca sente però è sempre la stessa. Parte dal basso, per la precisione dal perineo, poi con un saltello scuote il sesso e tamburella il basso ventre per entrare poi prepotente come un trionfo di timpani nello stomaco. Divampano i colori nell&#x27;intestino, ogni volta con tonalità differenti, e poi rimbalzano, irrorano le pareti come raggi velocissimi per arrivare a mescolarsi e formare uno strano bianco, come le ossa, come la morte, un bianco che sale fino al cuore. Nasce allora una colomba che spicca il volo partendo dal petto, dal suo centro. Il cervello non c&#x27;entra, prova a starci dietro ma è sempre un passo indietro. Una colomba, dicevo, che fa di quell&#x27;attimo così ampiamente dilatato un&#x27;esperienza sacra, l&#x27;esperienza del teatro. Luca è lì, testimone di una forma di vita che ha preso il volo verso il cielo.</p><p class=int>I MIEI SARGASSI OVVERO IL POSTO IN CUI TORNI PER RINASCERE</p><p>Lì io sono davanti a me stesso, sarà perché sono un segno d&#x27;acqua? Il mar Ligure, quello di Imperia per la precisione. Ma quello di Oneglia o quello di Porto Maurizio? Beh quello cambia in base a ciò che ho bisogno di evocare dentro di me.</p>"}, {"id": "t-ontro-le-mat-uno-tutti-nessuno-luca-docx-oss", "g": 0, "autore": "Luca", "titolo": "La rocambolesca storia della mia ossessione per…", "apertura": false, "separato": true, "arrivo": "2026-10-14T23:08", "incipit": "Io stavo per parlare d’altro ma la mia amica Serena si volle soffermare sull'argomento: “Luca perché non fai i", "html": "<p class=int>LA ROCAMBOLESCA STORIA DELLA MIA OSSESSIONE PER...</p><p>Io stavo per parlare d’altro ma la mia amica Serena si volle soffermare sull&#x27;argomento: “Luca perché non fai il provino? Hai una bella voce”.</p><p>Eravamo al DAMS, facoltà di lettere e filosofia di Genova, sessione distaccata di Imperia. Si preparavano i provini per una produzione universitaria del Caligola di Albert Camus. Io non avevo mai pensato di partecipare a quel provino, ma l’invito di Serena mi incuriosì e così, procuratomi una copia dell’opera in oggetto, mi sedetti sul divano di casa e la aprii cercando il monologo che avrei dovuto preparare. Iniziai a leggere e mentre scorrevo nella mia mente le parole qualcosa dentro di me si accese. Mi ricordo di una sensazione corporea molto precisa, una luce calda riempì tutto il mio corpo, i nervi si tesero, come se partecipassero mimeticamente alle parole, alla sofferenza che esprimevano. Poi un’intuizione si affacciò alla mia mente, come se una voce mi dicesse che recitare fosse la strada che dovevo seguire a tutti i costi, perché in qualche modo era una cosa che sapevo già fare, che facevo da tutta la vita. Mi rendo conto quanto sia patetico tutto questo ora che lo scrivo, ma fu così che iniziò tutto. Fu così che iniziò il rapporto più intenso della mia vita, quello col teatro.</p><p>Io per il teatro ho abbandonato ogni certezza, ogni strada facile, ogni comodità, un futuro che pareva già scritto nella tranquilla città di provincia in cui ero nato. Nella mia vita sono caduto tante volte, i fallimenti sono stati tanti, in campo lavorativo, artistico, privato e ogni volta per tornare a sorridere, per ritrovare un senso al mio agire, mi sono rivolto al mio teatro. Che sia io a praticarlo come attore (alla fine ho fatto un’accademia di recitazione a Milano e lì sono rimasto a vivere), o a goderne come spettatore, il teatro è il mio maestro di vita, mi ha aiutato a crescere, a maturare. Allo stesso tempo mi conduce nei luoghi più reconditi del mio io, mi mantiene in un costante stato di precarietà, mi consuma dentro. È una relazione, quella tra noi due, che va avanti da vent’anni. A volte mi chiedo se qualcosa tra di noi non debba cambiare, come si fa in una coppia che col passare degli anni deve calibrarsi in base alle nuove necessità dei singoli individui. Poi però la paura di perderlo, che è l’alimento principale, credo, della mia ossessione per lui, mi impedisce di mettere in gioco il nostro rapporto. E così ancora adesso mi comporto come il ragazzo di vent’anni che per la prima volta lesse l’opera di Camus. Se mi guardo da fuori mi trovo un po’ patetico e forse anche un po’ pazzo, proprio come Caligola.</p>"}, {"id": "t-tro-le-mat-uno-tutti-nessuno-maitri-docx", "g": 0, "autore": "Maitri", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-05T12:58", "incipit": "Sacro è ciò che manifesta ciò che di divino c’è nell’umano, ovvero la natura indivisibile del tutto. Di…", "html": "<p class=int>SACRO</p><p>Sacro è ciò che manifesta ciò che di divino c’è nell’umano, ovvero la natura indivisibile del tutto. Di conseguenza tutto è sacro. Partendo da questo riconoscimento, area a cui si dedica particolare attenzione e reverenza. Caratterizzata da cura e attenzione, che prevede un coinvolgimento intenzionalmente totale e presente.</p><p>Può essere uno spazio fisico, oppure un arco di tempo, oppure lo spazio e ciò che intercorre tra individui.</p><p>Non necessità di particolari ritualità o segnali che ne evidenzino la presenza (anche se possono essere presenti, ma non ne sanciscono la realtà), se non una presa di coscienza interiore dell’essere in presenza del sacro.</p><p>Nulla può essere per principio escluso dal sacro; tuttavia, è possibile ammettervi solo ciò che ottiene un atto cosciente e intenzionale di riconoscervi il sacro.</p><p class=int>PER PARLARE DI ME BISOGNA PRIMA PARLARE DI</p><p>Per parlare di me bisogna prima parlare di Severino. Severino è un po’ matto. Severino, quando l’ho conosciuto, in un giorno di primavera del 2004 o giù di lì, non metteva un filtro tra quello che gli passava per la testa e quello che gli usciva dalla bocca. Aveva dei sogni, grandi, bizzarri, e non aveva paura di saltare nel vuoto e seguirli. Ha aperto un benzinaio, che poi ha chiuso, ha viaggiato per il mondo. Credo abbia persino comprato una laurea finta in Cina. Ha camminato sul Cammino di Santiago, ha scritto libri, ha amato appassionatamente tantissime donne, tradendole tutte. Ha avuto un cuore estremamente romantico e una passione che trasferiva nelle sue parole, sia che parlasse di qualcosa di importante, sia che usasse tecniche di seduzione abbastanza discutibili.</p><p>Severino è matto. Ha un nome strano, che davvero non gli si addice... tutto si potrebbe pensare guardandolo, tranne che è una persona severa.</p><p>È stato il mio cane che mi morde le chiappe.</p><p class=st>Per parlare di me bisogna prima parlare di mia zia Angela. Angela è la sorella minore di mia mamma. In famiglia la considerano un po’ matta. Ha scelto una strada meno convenzionale delle sue sorelle. In una famiglia cattolica lei si è iscritta al partito comunista. Se ne è andata di casa senza sposarsi, prendendosi un piccolo monolocale a Milano. Ha cambiato diversi fidanzati, non ha avuto figli e a un certo punto ha anche deciso di mollare il lavoro a tempo indeterminato per fare massaggi. Ha sempre avuto interessi esoterici. Parlare con gli angeli, osservare le auree, leggere gli oroscopi e cose così. Raccontava storie di streghe.</p><p>Credo non sia stato facile, per lei, avere dentro qualcosa che la rendeva diversa dalle altre persone della famiglia. Sentire addosso il giudizio, forse anche la speranza che mettesse la testa a posto, che si desse una calmata.</p><p>Io non lo so se lo ha fatto, spero di no.</p><p class=int>PANGOLINO - saltello</p><p class=st>Il picco dello struggimento, il momento in cui le lacrime non potevano far altro che sgorgare copiose dagli occhi, che Maitri incontrò nella sua vita fu guardando Interstellar. Non era la prima volta che lo guardava e lo aveva scelto proprio per incontrare quell’emozione.</p><p>Cosa c’è di più struggente dell’Amore? L’Amore che guida lei nel sentire che il pianeta giusto è quello dove è andato il suo amore, pur sapendo che non lo rivedrà. L’amore del padre per i figli, che lo spinge ad affrontare un viaggio pieno di rischi. L’amore della figlia per il padre, che la porta a salvare l’umanità intera. Certo, la grandiosità di Hollywood e la possibilità di riconoscere nella storia l’intensità della ferita causata dalla mancanza di amore. Ma quella volta fu diverso. Maitri vedendo il film ebbe un Satori. Da fuori niente di più e niente di meno di quanto già detto. Dentro un piccolo saltello, uno spostamento microscopico ma che rendeva quell’esperienza permeata di un senso profondo di realizzazione.</p><p>È l’Amore la sostanza stessa dell’esistenza. È l’amore l’unica legge che sposta gli oceani, le persone e fa accadere le cose.</p><p>E l’Amore è un sentimento immenso, inspiegabile, irrazionale, qualcosa che in quel momento le parole non avrebbero potuto spiegare, che avrebbero immediatamente perso forza dopo essere state pronunciate.</p><p>Ma in qualche modo l’effetto di quella esperienza le rimase dentro. Ogni cosa è Amore. Il cuore le era diventato caldo e immenso, capace di accogliere qualsiasi cosa, dalla gioia più desiderata alla delusione più cocente, con equanimità, come manifestazione di Amore universale. Lo spazio interno si allargò all’infinito, un universo vasto, silenzioso, pieno d’energia e di Amore.</p><p class=int>I miei Sargassi. Il posto dove torno quando ho bisogno di rinascere.</p><p class=st>Lì, io sono pacificata. Il silenzio intorno mi avvolge, i suoni assumono un trillio e una delicatezza che altrove non hanno. Quando ho bisogno di rinascere vado in un bosco.</p>"}, {"id": "t-ra-arcana-12-10-2026-marco-ottolini-dotx", "g": 0, "autore": "Marco", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-18T17:08", "incipit": "Racchiude un mistero. Questo mistero è qualcosa che noi vogliamo risolvere. Lo vogliamo risolvere anche se un…", "html": "<p class=int>SACRO</p><p class=st>Racchiude un mistero. Questo mistero è qualcosa che noi vogliamo risolvere. Lo vogliamo risolvere anche se un po’ ci spaventa. Lo vogliamo risolvere anche se il suo compito è anche quello di non essere risolvibile. Qualcosa che ci chiede di affidarci. Di abbandonarci. Al mistero e a quello che risulta irrisolvibile. Un mistero inestricabile ma che ci regala qualcosa che ci convince. Qualcosa che ci fa dire che, forse, questa volta...</p><p>Sacro è il mistero che diventa concreto.</p><p>Sacro è il mistero che diventa reale.</p><p>Sacro è il mistero che ci conforta.</p><p class=st>-----------------------------------------------------------------------</p><p class=int>PER PARLARE DI ME BISOGNA PRIMA PARLARE DI...</p><p class=st>Eddie. Appeso sopra il palco del Pink Pop Festival nel 1992. E di come quell’immagine abbia preso tutto quello che ero in quegli anni e lo abbia ribaltato. Mi spaventava ma, dio, quanto volevo essere al suo posto. Quanto avrei voluto guardare tutta quella folla di gente che era lì per me e dirle che si poteva volare. Da lì ho iniziato ad ascoltare i Pearl Jam e sono diventati il mio gruppo preferito in assoluto. E da lì ho capito che sarebbe stato bello vivere la vita nella speranza di fare il più grande stage-diving nella storia dell’umanità. Grazie, Eddie Vedder. Sei un bell’uomo pure ora.</p><p class=st>Un dado da cucina. E di come il mio migliore amico dell’adolescenza ne mangiasse quantità considerevoli. Così, come mangiare un pezzo di cioccolato. All’inizio lo trovavo disgustoso ma a lui piaceva. E mi sono reso conto, pur non avendolo mai assaggiato, che alla fine ogni volta che eravamo davanti allo schermo del computer per la nostra consueta partita a Sensible Soccer, lui mangiava uno o due dadi da cucina. E io ho iniziato a trovarlo normale. Faceva parte del nostro percorso. Non lo so se questo mi porterà ad assaggiarlo un giorno, nella mia vita, il dado da cucina ma di certo ho imparato che non esiste la persona strana o la persona normale. Esistono le persone. Alla fine, però, il brodo preferisco farlo con le verdure o la carne, ve lo confesso.</p><p class=int>PANGOLINO</p><p class=st>Lui non se lo sapeva spiegare. Cosa aveva fatto, lui, per meritarsi tutto questo affetto, questa fiducia, questa voglia di contatto? Dopotutto veniva solo da un essere vivente. Che aveva dei suoi bisogni, delle sue intenzioni, delle sue richieste. Ma è come se lo avesse scelto. Lo avesse guardato e avesse deciso che, si, lui è la persona con cui voglio stare. E da quel giorno lo ricerca. Vuole stare con lui. Filippo vuole stare con lui. Lo chiama, miagola per cercare il contatto, per dirgli “Ehi, sono qua. Ho bisogno di te.” E quando questa richiesta arriva, lui si siede, Filippo arriva con un saltello sopra lo schienale del divano, si accoccola di fianco a lui e si lascia accarezzare. Producendo delle fusa che si possono ascoltare anche se sei lontanissimo. Anche se sei dall’altra parte del mondo. La scelta di Filippo, che ha scelto lui, è sacra, è un mistero. Cosa lo ha portato a decidere nessuno lo sa. E lui sa che Filippo, quando finalmente ha quello che vuole, si abbandona. Si lascia andare. Chiude gli occhi e si lascia andare. Per lui questo è perturbante. E’ spiazzante. Perché ha una sua ritualità, una sua sacralità, una sua chiamata. Ma lo accetta. Perché è stato scelto e non può tirarsi indietro. Non vuole tirarsi indietro. E’ stato scelto e ne è felice.</p><p class=int>I MIEI SARGASSI</p><p class=st>Lì, io sono in totale connessione con ciò che sono e ciò che vorrei essere. Un luogo di scogli e mare azzurro. Dove poter sorseggiare una birra sotto questo portico cubano. Stare nel mondo con lo sguardo verso il cielo.</p>"}, {"id": "t-mbolesca-storia-della-mia-ossessione-per", "g": 0, "autore": "Marco", "titolo": "La rocambolesca storia della mia ossessione per…", "apertura": false, "separato": true, "arrivo": "2026-11-04T18:34", "incipit": "Io stavo per rinunciare. Davvero, mi stavo rassegnando alla questione. Ci ho provato in tutti i modi, Vostro…", "html": "<p>Io stavo per rinunciare. Davvero, mi stavo rassegnando alla questione. Ci ho provato in tutti i modi, Vostro Onore, mi dovete perdonare. Ma non sono mai riuscito a scendere a patti con questa cosa. E tutto questo ha provocato in loro solo sofferenza, solo paura, solo morte. Ci avevo messo una pietra sopra. Ne ho parlato con un sacco di persone. Davvero, anche con la mia psicologa. Non mi ha aiutato, nulla mi ha aiutato. E alla fine ho deciso di accettare questo mio lato oscuro. Lo confesso, a Lei, Vostro Onore, a questa giuria che mi fissa con quegli occhi assenti, quelle bocche giudicanti, quelle parole dette a mezza voce, a tutta la platea di questo tribunale. Lo confesso, Vostro Onore, io non ho per niente il pollice verde. Molte piante, molti fiori, molti vegetali sono periti sotto le mie mani. Sono passate a miglior vita. Sono andate in un altro mondo. Forse migliore, visto che prima stavano vicino a me. Io non ho il pollice verde. Ecco, l’ho confessato. Ora potete pure giudicarmi colpevole. Ma vi chiedo di ascoltarmi ancora un attimo. Poi potete giudicarmi colpevole. Ma ascoltatemi un secondo. Un giorno, stavo girando, stavo bighellonando, stavo passeggiando per un mercato e sono passato davanti alla bancarella di un fioraio. Ovviamente, il gelo si è impadronito di me, pensando al male che potevo fare anche solo guardandole quelle piante. Stavo scappando quando ho sentito una voce femminile che diceva “Ma quanto ci mettono a sbocciare questi Yellow Scorpion?”...Yellow Scorpion...come possono dei fiori avere un nome così selvaggio? Così indomabile? Non so perché ma quel nome mi ha incuriosito. Mi sono voltato e, non senza paura, mi sono avvicinato alla voce di quella signora. Stava parlando con il fioraio e stava parlando di una varietà di...peperoncini. Erano belli gli Yellow Scorpion. Erano gialli, ovviamente, bitorzoluti, grossi, simpatici, paciocconi. Così, dentro di me, Vostro Onore, iniziò a maturare un pensiero. Forse io potevo occuparmi della bruttezza. Non dei fiori e delle piante belle, regali, le regine del prato. O delle piante imponenti, verdi da far male agli occhi. No, dei peperoncini e delle loro varie varietà. Con tutte quelle forme strane e colorate. Come delle protuberanze strane. E poi erano potenti. Alcune varietà si devono maneggiare con i guanti. Che se ti sfreghi gli occhi poi ti bruciano da morire. Come erano antipatici i peperoncini. Come sono adorabili i peperoncini. Comprai la pianta di Yellow Scorpion. La portai a casa e la cura di quelle piante diventò preponderante. Adesso ho tre piante di peperoncino rigogliose sul mio balcone. Una si chiama Carolina Reaper, dicono che sia il più piccante al mondo. Lo Yellow Scorpion è diventato come un fratello. Gli parlavo, lo innaffiavo regolarmente, lo curavo. Ha fatto dei peperoncini buonissimi. Da quel giorno ho iniziato a dedicarmi solo a loro. Alle piante di peperoncini. Non mi importa nulla delle altre piante, a quelle ci pensa la mia compagna. Ma loro, le piante di peperoncini sono mie. Sono la mia croce e delizia. Crescono rigogliose. Voglio farci marmellate, liquori, voglio provare il Carolina Reaper per vedere quanto mi può spingere oltre i miei limiti. Vostro Onore, giurati, non è vero che non ho il pollice verde. Forse il mio pollice verde lo dovevo dedicare a qualcuno. A qualcuno di brutto, bitorzoluto, anche antipatico. E’ tutto,Vostro Onore. Ora potete pure dare il vostro verdetto.</p>"}, {"id": "t-no-tutti-nessuno-margherita-manzini-docx", "g": 0, "autore": "Margherita M.", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-15T23:33", "incipit": "Sacro è avere figli e non far portare loro il peso delle proprie scelte.", "html": "<p class=int>1. Sacro</p><p class=st>Sacro è avere figli e non far portare loro il peso delle proprie scelte.</p><p class=int>2. Per parlare di me bisogna prima parlare di...</p><p class=st>Sdraiato per terra con suo padre che provava ad alzarlo a forza, me lo ricordo attaccato alla porta della classe. Già così a sei anni, sarebbe stato tutta la vita CONTRO, seduto e silenzioso quando lo interrogavano, tagliente quando avrebbe dovuto tacere. Lo capii molti anni dopo. Il suo primo giorno di scuola fu una presa di posizione, un inno senza ombre al dubbio, al rispetto della coscienza individuale. Tutta la vita aveva provato a difendersi.</p><p class=st>Aveva circa cinque anni, suo padre stava preparando una miscela per fare l&#x27;eutanasia al cane, erano altri tempi, tempi in cui i medici di campagna facevano partorire anche le mucche e curavano gli animali. Il cane aveva un tumore al cervello, iniziava a diventare pericoloso per sé e per gli altri, glielo spiegò quando entrò nella stanza dove lui lavorava, lo spiegò come si spiega ai bambini piccoli, lei lo guardò e disse &quot;da grande voglio curare il cervello dei matti&quot;. Dicono che la vocazione vera non si possa spegnere mai.</p><p class=int>3. Pangolino</p><p class=st>Una tenerezza disarmante lo pervade, il cerbiatto lo guarda immobile e al contempo pront

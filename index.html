e sue rigidità e bizzarrie, aveva mostrato in fin dei conti almeno un oncia di buon senso e disposizione alla mediazione.</p><p>Si trattava di un equilibrismo virtuosistico e precarissimo. Tutta l’impalcatura avrebbe potuto crollare al primo soffio di tramontana. La calma della sua voce al telefono era costata tante bestemmie interiori, tanti segni dei denti sulle labbra.</p><p>Ma il congegno tenne. I regali furono scartati, la tensione pian piano si allentò, il vino fece il resto e a fine serata tutti i membri della famiglia sentivano il tepore del Natale, o per meglio dire della vicinanza, sciogliere pian piano i geli delle incomprensioni e delle spigolosità dei giorni avanti.</p><p>Il primo Natale senza la nonna era passato, ed era salvo.</p><p class=int>12. La grande e bella ribellione</p><p class=st>Ti ricordi la tua grande e bella ribellione? È stato quando a sette anni, camminando davanti a tuo padre senza guardarlo in volto, senza nemmeno voltarti, ma alzando un po’ la voce perché non potesse fingere di non sentirti, gli hai detto: «Io sono io e tu sei tu».</p><p>Ti stava spiegando che quei giochi di carte che facevi con quei compagni di scuola erano da bambini stupidi, che c’erano altri giochi molto più belli e intelligenti, che se fossi andato a giocare con loro avresti sprecato il tuo pomeriggio in un’attività senza senso.</p><p>In pochi secondi dovesti inventare una tua lingua per dirgli il distacco. Trovasti quelle parole. Poche, brevi, piccole parole, che racchiudevano un grande slancio, la decisione di essere per sempre te stesso, senza lasciarti intrappolare dagli spettri di un Altro.</p><p>Quegli spettri tornarono altre volte, in forme più oscure e minacciose, e ti misero spalle al muro. Ma erano fatti d’aria e ormai, per quanto spaventosi, non avrebbero più potuto penetrare la sostanza solida di quell’io, retto in faccia al mondo</p>"}];

    <h2>${esc(v.autore)}</h2>${v.titolo ? `<div class="tit">${esc(v.titolo)}</div>` : ""}
    <div class="linea" style="background:${g.colore}"></div>${v.html}
    <div class="fine">${pal(g.colore)}</div>
    <div class="passi"><span></span><a href="#${tutta.id}" style="text-align:right"><div class="et">Tutti i testi di questa giornata →</div><div class="chi">${esc(v.autore)}</div></a></div></article>`; }
  const g = GIORNATE[v.g], vv = v.apertura ? APERTURE : VOCI.filter(x => x.g === v.g && !x.apertura), i = vv.indexOf(v);
  const prima = vv[i-1], dopo = vv[i+1];
  const passo = (x, verso) => x ? `<a href="#${x.id}" style="text-align:${verso==="d"?"right":"left"}"><div class="et">${verso==="d"?"Il prossimo →":"← Il precedente"}</div><div class="chi">${esc(x.autore)}</div></a>` : "<span></span>";
  return `<article class="lettura"><a class="indietro et" href="#${hashDi(v.g)}">← Torna allo schedario</a>
    <div class="et">${pal(g.colore)} &nbsp;${v.apertura ? "Aperture · " + esc(g.titolo) + " · " + esc(g.data) : esc(g.rubrica) + " · " + esc(g.data) + " · " + esc(g.titolo)}</div>
    <h2>${esc(v.autore)}</h2>${v.titolo ? `<div class="tit">${esc(v.titolo)}</div>` : ""}

    <div class="linea" style="background:${g.colore}"></div>${v.html}
    <div class="fine">${pal(g.colore)}</div>
    <div class="passi">${passo(prima,"s")}${passo(dopo,"d")}</div></article>`;
}
// nella lettura: ogni esercizio ha il suo titolo, più grande, e sotto la sua consegna
function rifinisci(v){
  const g = GIORNATE[v.g];
  if (!g.esercizi.length) return;
  const visti = new Set();
  document.querySelectorAll(".lettura p.int").forEach(p => {
    const t = p.textContent.toLowerCase();
    const e = g.esercizi.find(e => new RegExp(e[1]).test(t));
    p.classList.add("esercizio");

  });
}
function mostra(){
  const h = location.hash.slice(1);
  const v = VOCI.concat(NOVITA).find(x => x.id === h);
  const n = NOMI.find(x => slug(x) === h);
  let k = CHIAVI.find(x => hashDi(x) === h);
  if (h === "saturday-sun") k = SABATI[0];
  if (h === "" || h === "giornate") k = INCONTRI[INCONTRI.length - 1];
  const inSabati = k !== undefined && k !== null && k !== "aperture" && GIORNATE[k].rubrica === "Saturday Sun";
  const vista = document.getElementById("vista");
  const inPersone = h === "persone" || !!n, inNuovi = h === "nuovi", inEs = PER_ESERCIZIO && (h === "esercizi" || /^e-\d+$/.test(h));
  document.getElementById("n-giornate").classList.toggle("su", !v && !inPersone && !inNuovi && !inSabati && !inEs);
  document.getElementById("n-sabati").classList.toggle("su", !v && inSabati);
  document.getElementById("n-persone").classList.toggle("su", !v && inPersone);
  document.getElementById("n-nuovi").classList.toggle("su", !v && inNuovi);
  vista.innerHTML = v ? vistaTesto(v) : inEs ? vistaEsercizi(h === "esercizi" ? 0 : +h.slice(2)) : n ? vistaPersona(n) : inNuovi ? vistaNuovi() : (h === "persone" ? vistaPersone() : vistaGiornate(k));
  if (v) rifinisci(v);
  if (h) window.scrollTo(0, document.querySelector("nav").offsetTop);
}
document.getElementById("conta").textContent = `${VOCI.length} testi · ${new Set(VOCI.map(v => v.autore)).size} voci · ottobre – novembre 2026`;
document.getElementById("agg").textContent = AGGIORNATO;
if (NUOVI.length) document.getElementById("n-nuovi").insertAdjacentHTML("beforeend", ` <span class="num">${NUOVI.length}</span>`);
window.addEventListener("hashchange", mostra);
mostra();
</script>

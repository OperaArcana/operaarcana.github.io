tolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-18T16:33", "incipit": "Stai percorrendo l’ultimo tratto di Cisa, tra Aulla e Sarzana, alla velocità di crociera di 120 chilometri…", "html": "<p>Stai percorrendo l’ultimo tratto di Cisa, tra Aulla e Sarzana, alla velocità di crociera di 120 chilometri orari. Né troppo forte, per non sembrare un conducente spericolato, né troppo piano, per non risultare inesperto.</p><p>Sei ancora ai primi passaggi. Per mantenere un buon Blabla-rating, ogni aspetto del viaggio conta. E la tua Opel Astra station wagon immatricolata nel 2004, spaziosa e stabile quanto vuoi, con i suoi dieci anni e duecentomila chilometri sulle spalle non dà certo molti appigli per un buon feedback, neanche ai più benevoli tra i passeggeri.</p><p>Ma tutto questo, via via che la costa si avvicina, finisce sempre più sullo sfondo. I profili affilati delle Apuane si fanno più nitidi e le nubi bluastre dell’Appennino lasciano largo a un azzurro terso di inizio stagione. Sul sedile accanto, questa ragazza dai lunghi capelli castani e dal sorriso gentile pare disposta a lasciarsi trasportare dalle vecchie canzoni italiane della tua compilation da viaggio.</p><p>Avete scambiato qualche parola in inglese all’inizio del tragitto, vi siete informati sulle rispettive ragioni dello spostamento dal punto A al punto B e sulle prossime destinazioni di entrambi. La conversazione si è fatta sempre più rada, fino a lasciare il posto a lunghi silenzi contemplativi, intervallati da poche frasi mezze in italiano e mezze in spagnolo quando lei riconosceva qualche canzone o a te veniva in mente qualcosa che lei avrebbe potuto visitare durante la sua permanenza in Toscana. Si chiama Adriana, viene dal Brasile ed è venuta in Italia per ritrovare le sue radici.</p><p>Un sole timido spunta da dietro le nubi e il suo tepore rende il silenzio più accogliente. Di imbarazzo, lungo il percorso, non ti pare ce ne sia mai stato. Sul tuo profilo hai indicato «Bla» come livello di chiacchiera durante il viaggio (su una scala che comprende «Bla», «Blabla» e «Blablabla»). Che secondo te si può parafrasare con «Parlo il giusto per non essere scortese, poi se non ho più niente da dire sto zitto e guido in silenzio, tranquillo e senza problemi fino all’arrivo». E hai avuto l’impressione, anche al netto della barriera linguistica, che a lei vada benissimo così. Ma questi raggi tiepidi di tarda mattina cambiano tutto.</p><p>Sai che Adriana ha appuntamento con una sua amica questa sera a Pisa: andrà a prenderla in aeroporto e domani visiteranno insieme la città. Ti stai domandando come la prenderebbe se le proponessi di deviare per Tirrenia e di passare il resto della giornata in spiaggia.</p><p>Non sai da dove cominciare, non vuoi che pensi che tu ci stia provando. Non ci stai provando. E sarebbe anche un modo dozzinale di provarci, quello di abbordare una passeggera di Blablacar, contrario alle più elementari regole deontologiche del buon conducente. Eppure lo splendore improvviso del cielo, la piacevolezza della temperatura e l’armonia che sembra abitare quel vostro silenzio, dopo pochi scambi così spontanei, sono tutti argomenti che incalzano.</p><p>Ti domandi se il fatto di non aver parlato molto possa essere d’ostacolo: penserà che finora non hai pensato ad altro, che stai tentando il tutto per tutto a pochi chilometri dall’arrivo. Ma, vista da un altro lato, la riservatezza che hai mostrato potrebbe anche giocare a tuo favore: uno che ci volesse provare comincerebbe a fare le sue mosse da subito, tentando di scherzare, prendendo al volo ogni occasione, ogni canzone, ogni spunto; sarebbe ben strano un abbordaggio che cominciasse con due ore di silenzio e discrezione per poi scatenarsi tutto all’improvviso alla fine del percorso.</p><p>Smetti di ragionare e decidi di lasciarti trasportare dal sentimento: «What would you think if I were to propose you – ». Ti accorgi subito che il sentimento è seriamente intralciato dal tuo inglese affettato e scolastico.</p><p>Ti blocchi. Ritenti in maniera più netta: «Would you like to go to the beach?»</p><p class=st>Adriana è bellissima. Per lei non deve essere il primo mare della stagione. La pelle sembra già abbronzata; sotto il sole, il castano dei capelli lascia intravede striature bionde lucenti; e quando avete fatto il bagno si è tuffata in acqua con una semplicità e una naturalezza che ti hanno stupito. Ti sei ritrovato un po’ impacciato a doverla seguire fingendo grande slancio, quando avresti fatto volentieri altri due passi sul bagnasciuga per saggiare la temperatura dell’acqua.</p><p>Tutto l’equivoco che ti eri fabbricato in testa sul provarci o non provarci, si è dissolto in un secondo come un castello di sabbia spianato dalla risacca appena avete appoggiato i piedi sulla sabbia di Verruca Beach e siete corsi insieme verso il mare.</p><p>Avete chiacchierato un po’, le hai offerto il gelato e tra poco la accompagnerai all’aeroporto, che sta a poche centinaia di metri dalla tua casa di Pisa, dove abitano ancora i tuoi vecchi coinquilini. Vi saluterete con un bacio sulla guancia e non vi vedrete mai più.</p><p>Le porgi la mano e lei si sostiene a te mentre si spolvera la sabbia dai piedi per rimettersi le sneakers e risalire in auto. Hai dimenticato tutto. Hai dimenticato Milano, i turni di lavoro al ristorante, le corse, le ore di sonno arretrato. Hai dimenticato gli esami, le tabelle di marcia, le centinaia di pagine di studio da recuperare prima di lunedì. Hai dimenticato i tuoi, i litigi, le incomprensioni. Stringi la sua mano, guardi il sole ancora alto sull’orizzonte e pensi... a niente. E che stai bene. Quest’altro te, lontano e vicinissimo, ti sorprende per la sua leggerezza. Non pensa a niente, non vuole niente, non progetta, non ha ambizioni. Si accontenta di vivere quest’attimo di improbabile intesa.</p>"}, {"id": "t-obre-sarah-un-imprevedibile-altra-te-pdf", "g": 1, "autore": "Sarah", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-25T19:48", "incipit": "Stai davanti al pc. È notte inoltrata ma non importa. Ti sei detta che puoi anche fare mattina.…", "html": "<p>Stai davanti al pc. È notte inoltrata ma non importa. Ti sei detta che puoi anche fare mattina. L’appuntamento con il primario è intorno all’ora di pranzo e non ti importa d’andarci stanca. Avrai proprio l’aria d’una che sta preparando un esame, magari la tesi, meglio se della specialistica. In una notte hai capito del corpo umano più di quanto ti sia degnata d’incamerare in tredici anni di scuola, senza contare i pomeriggi con “Siamo fatti così” che hanno probabilmente dato un contributo sostanziale alla tua preparazione, fino a quel giorno. Quella notte però sei vorace, attenta, agguerrita. Fosse stato un esame l’avresti superato, chissà. Invece devi solo essere credibile.</p><p class=st>Devi solo capire perché dopo due anni si è a questo punto, perché la mamma è andata in coma e ora così, a tratti cosciente, le condizioni continuano a precipitare. Devi farti trattare con rispetto, farti spiegare e ottenere finalmente la consulenza di medici esterni all’ospedale. Quest’altra te, lontana e vicinissima, ti sorprende per la sua lucidità, la tenacia. Non sembri nemmeno avere solo 25 anni a sentirti parlare. Non sembri una che studia teatro e cinema. Elenchi a quell’uomo tronfio e ridicolo tutti i processi in corso, il significato degli ultimi valori che conosci, parli di analisi come delle vie che circondano la tua casa. Sembri una dottoressa e lui te lo chiede. Bene. Tu soprassiedi: “Questo non è importante”- puntualizzi- “Continui pure a spiegarmi dottore, la seguo”. Questa “te” l’hai scoperta quella notte e durante quel colloquio. Ma lei torna. Torna a fare causa all’ospedale. Torna a fare le pratiche per proteggere i diritti di tuo fratello disabile. Torna per non farti mettere sotto quando le questioni si fanno serie, e non c’è da distrarsi o da scherzare.</p>"}, {"id": "t-un-17-ottobre-stefi-reda-un-altro-tu-odt", "g": 1, "autore": "Stefania", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-18T14:09", "incipit": "Un imprevedibile altro te", "html": "<p>Un imprevedibile altro te</p><p class=st>Stai finalmente sfruttando due ore di Sala Puccini libera, non lo è mai!</p><p class=st>Fra due giorni i tuoi allievi dovranno suonare alla finale del Premio del Conservatorio, categoria Musica da Camera.</p><p>Purtroppo siete riusciti a prenotare dalle 18 alle 20, e tu sai che questo orario di fine alle 20 è sempre un po’ lasco... generalmente i bidelli, che ora si chiamano...boh...vorrebbero finire un po’ prima. Sono sei anni che permetti al “bidello” di entrare in classe mentre stai finendo la lezione per svuotare il cestino e chiudere le finestre.</p><p>La finale si terrà appunto in Sala Puccini, una sala abbastanza complessa dal punto di vista acustico. Il pianoforte è un bellissimo gran coda Steinway ma gli archi (violino e violoncello) sono quelli di sempre.. il confronto è impietoso.</p><p>Hai solo due ore di tempo per sistemare le ultime cose, l’ascolto dalla sala è molto diverso dall’ascolto sul palcoscenico ed i ragazzi non hanno tutta questa esperienza. In più il pianista si crogiola (giustamente) nel suono pieno del pianoforte...in aula è tutto diverso!</p><p class=st>Fate un capo/fondo, e loro registrano anche. Segni sul tuo quadernetto le cose più utili in quel momento. Silenzio, si parte.</p><p>Alle 19.45, mentre loro stanno suonando, entra l’addetto alla sala direttamente sul palcoscenico e ti fa segno con due dita della mano destra sul polso della sinistra “E’ ora di chiudere”.</p><p>Tu senza parlare gli fai segno di uscire.</p><p>Dopo 5 minuti entra ancora e stavolta ti dice che deve chiudere, gli fai segno di tacere e di uscire.</p><p>Alle 19.55, a un minuto alla fine dell’esecuzione, entra una signora che in malo modo ti dice che devono andare a prendere la metropolitana.</p><p class=st>Hai lasciato che i ragazzi finissero e</p><p>ti sei lanciata in una sfuriata come</p><p class=st>non ti era MAI successo a scuola,</p><p>con nessuno in 43 anni! Il poveretto si è scusato, tu pure gli hai chiesto scusa perché stavi urlando, ma hai continuato ad urlare. Quest’altra te, lontana e vicinissima, ti sorprende per la velocità delle parole, la pertinenza delle osservazioni (di solito le osservazioni migliori ti vengono in mente sempre dopo), la sicurezza di essere nel giusto, il piacere nel vedere l’altro sopraffatto dalla tua rabbia. Tutto è documentato dalla registrazione degli studenti e vi siete fatti delle grasse risate riascoltandovi!</p>"}, {"id": "t-un-imprevedibile-altro-te-pdf-verena-pdf", "g": 1, "autore": "Verena", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-28T11:09", "incipit": "UN IMPREVEDIBILE ALTRO TE", "html": "<p>UN IMPREVEDIBILE ALTRO TE</p><p class=st>Stai per entrare nell‘età dell‘adolescenza, ma non lo sai ancora. Hai 10 o 11 anni e il tuo sguardo è tutto sugli altri e sul mondo attorno a te. Di te stessa sai poco. Hai conosciuto le emozioni e i pensieri che ti hanno accompagnato durante la tua infanzia come dei riflessi intensi e totalizzanti, ma ancora poco consci. Non sai niente del tuo aspetto, non presti attenzione a come ti comporti o a cosa indossi e non sei consapevole dell‘ effetto che sortisci sugli altri. Le due settimane di colonia sul Renon irrompono nella tua vita come una folgorazione. Non sai spiegartelo, ma improvvisamente finisci nel vortice di un ciclone fatto di amicizie, avventure e innamoramenti. Proprio te che sei una bambina timida per nulla abituata a stare al centro dell’attenzione!</p><p class=st>Le altre bambine vogliono tutte esserti amiche e i bambini sembrano tutti essersi innamorati di te. Forse non sono proprio tutti, ma a te sembra di essere al centro del mondo. E il mondo per quelle due settimane è un susseguirsi di divertimenti, giochi e allegria che ti fanno volteggiare di mano in mano in una danza continua che ti lascia sbalordita.</p><p class=st>Ti diverti tantissimo a scorrazzare per sentieri e boschi insieme a tanti spasimanti che fanno a gara per portarti i mirtilli più grandi e belli. Ti perdi nei giochi di gruppo, nel cantare e nell’ ideare fughe dal dormitorio e rocambolesche avventure, fuggendo per finestre o sgusciando via al buio. Ti lasci alle spalle la timidezza e scopri che essere al centro dell’attenzione non è nemmeno così male: scopri il gusto dell’esuberanza.</p><p class=st>Quest’altra te, lontanissima e vicina, ti sorprende soprattutto perché viene vista e cercata dagli altri.</p><p class=st>Per la prima volta nella tua vita ti rendi conto che sortisci un effetto...e allora inizi ad accorgerti di cose a cui prima non avevi mai fatto attenzione: i brufoli (e la vergogna dopo averli scoperti allo specchio per cui non vorresti più farti vedere da nessuno), le braccia pelose (ecco il perchè della maglietta a maniche lunghe prestata da un’amica e indossata per giorni e giorni), l’imbarazzo di parlare a tu per tu con quel ragazzino, Thomas, che ti piace tanto. Sono momenti di insicurezza che si risolvono grazie all’amicizia e alla guida degli operatori attenti che vigilano su di noi bambini. Forse ti sei innamorata per la prima volta e la felicità ti dà quasi alla testa. Ad ogni modo ti premuri di essere gentile con tutti, ma non sei sicura di riuscire a dare a tutti il giusto spazio. Il vortice gira così in fretta che perdi il controllo della situazione. Dopo questa esperienza passeranno decenni prima che ti ritrovi di nuovo al centro dell’attenzione. Sarai un poco più consapevole di te stessa e delle tue relazioni e ti impegnerai ancora di più a rimanere fedele ai tuoi principi di gentilezza verso gli altri. Le insicurezze e il disagio provocato dal rischio di poter dispiacere a qualcuno a volte ti frenano ancora. Eppure ti ricorderai che esiste anche questa versione di te, lontanissima e vicina, un po’ selvaggia e piena di vita. E’ lei stessa che a volte ti prenderà per mano danzando per la via.</p>"}, {"id": "t-24-ottobre-fare-i-fregoli-claudia-g-docx", "g": 2, "autore": "Claudia", "titolo": "Fare i fregoli", "apertura": false, "separato": false, "arrivo": "2026-11-01T17:13", "incipit": "La trasformazione comincia con l'arrivo del  ragazzino mio vicino di casa con un  esemplare di cervo volante…", "html": "<p>La trasformazione comincia con l&#x27;arrivo del  ragazzino mio vicino di casa con un  esemplare di cervo volante bellissimo, mai visto così bello sulla faccia  della terra , imbalsamato con tutti gli spillini bloccato su un dischetto di  legno..</p><p>Ecco li’ho capito la mia vena animalista..perché volevo segargli la testa</p>"}, {"id": "t-obre-giusy-russo-quasi-come-fregoli-docx", "g": 2, "autore": "Giusy", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-30T16:39", "incipit": "\"La trasformazione cominciò con\" ... la lingua. Ero in vacanza in \"terra\" calabra con la mia ciurma di…", "html": "<p>&quot;La trasformazione cominciò con&quot; ... la lingua. Ero in vacanza in &quot;terra&quot; calabra con la mia ciurma di americani in visita. Gli zii e le rispettive famiglie, ragazzi e ragazze di varie età. Avrò avuto diciassette anni, la folta chioma rosseggiante come sempre mi accadeva al mare e la pelle diafana e lentigginosa ereditate dalla mamma. Un ragazzotto del posto aveva adocchiato le nostre chiacchiere in inglese, ma soprattutto me. Ignorando che fossi bilingue aveva detto all&#x27;amico che era con lui: &quot;carina, la rossa, adesso parto all&#x27;attacco&quot;. E l&#x27;amico: &quot;ma dai, sarà qui coi genitori, come fai a rimorchiarla&quot;. Risposta: &quot;Tu lassa fa a mia&quot;. A me all&#x27;epoca piacevano alti, biondi, teutonici e galanti, lui, cafone e nero come un tizzone non aveva chance. Improvvisò una sorta di interrogatorio in pessimo inglese e io mi finsi turista che ignorava l&#x27;italiano per dargli il due di picche.</p>"}, {"id": "t-rday-sun-24-ottobre-fregoli-ilaria-f-pdf", "g": 2, "autore": "Ilaria", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-08T19:09", "incipit": "La trasformazione comincia con la noia. Con la noia e con la curiosità di provare movimenti che il mio corpo…", "html": "<p>La trasformazione comincia con la noia. Con la noia e con la curiosità di provare movimenti che il mio corpo non aveva mai compiuto. Il corpo. Questo strano involucro che mi trattiene e che sento corrispondermi così poco. Trovarmi sola in una cittadina che non conoscevo abbastanza non aiutava. Aver perso la persona con cui condividevo le coperte scopriva ancora una volta il mio fianco più debole: gli abbracci, gli sguardi amorevoli e le carezze permettevano a quel corpo, tanto odiato, di avere una ragione di esistere, un negativo che ne tratteggiasse i limiti, rendendoli meno spigolosi e taglienti per l’anima. La solitudine riportava a galla il senso di inadeguatezza di cui il copro era intriso.</p><p class=st>“Corso gratuito di Capoeira”. Decisi di provare.</p><p class=st>Il maestro era un uomo taciturno e carismatico. Negli occhi verdastri si poteva scorgere la sua familiarità con il mare. Sembrava avesse sofferto molto nella vita, ma la sua postura restava incredibilmente radicata a terra. Severo, di quella severità patriarcale che ricordava gli uomini della famiglia di mia madre. Qualcuno mi aveva già parlato di lui. Quando lo vidi la prima volta, con i capelli riccissimi e vagamente brizzolati, mi chiesi se solo l’arte che insegnava fosse brasiliana o se lo fosse anche lui.</p><p class=st>Iniziai in modo impacciato. I primi passi, semplici e ripetuti, mi erano totalmente estranei. Mi sentivo più scoordinata di un fenicottero in una palude. Braccia e gambe si muovevano in modo dissonante. Il maestro non si dilungava in spiegazioni: mostrava e dava il ritmo. La prima lezione terminò con una roda, dove persone che evidentemente non erano novelle come me si sfidavano, mentre gli altri cantilenanti, li circondavano. Ne uscii confusa. Il senso di inadeguatezza restava, ma dentro di me qualcosa di nuovo iniziò a muoversi. Il ritmo aveva sovrastato i pensieri di insicurezza che urlavano nella testa. Lasciai che le urla continuassero, senza ascoltarle, e decisi di ripresentarmi ogni mercoledì pomeriggio.</p>"}, {"id": "t-obre-maria-luisa-quasi-come-fregoli-gdoc", "g": 2, "autore": "Maria Luisa", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-07T15:29", "incipit": "Quasi come Fregoli", "html": "<p>Quasi come Fregoli</p><p class=st>La trasformazione comincia con la noia.</p><p class=st>Era, direi, il 2013, l’estate della mia maturità. Sono andata una settimana o due in Sardegna, a La Maddalena, dove i miei zii hanno una casa. Quando eravamo piccoli ci si andava tutte le estati, poi la tradizione chissà come si è interrotta - come tutte le tradizioni che da bambina ti sembrano immutabili.</p><p class=st>Però nel 2013, a diciassette anni, ci sono tornata per l’ultima volta, per aiutare mia cugina di due anni più piccola a studiare per recuperare i debiti. C’era anche mio cugino, e forse mio fratello - ma di mio fratello non sono sicura.</p><p class=st>Una sera, con mio cugino e i suoi amici ricchi, e forse mio fratello - chissà - siamo andati a ballare in una discoteca chiamata, mi sembra, Phi Beach. Il luogo era naturalisticamente incredibile. Non c’era una vera e propria costruzione, vere e proprie stanze: era come incastonata nella terra, ricordo rami e radici dappertutto. Davvero stupenda. Ma vi lascio immaginare la fauna che potesse popolare una delle discoteche più fancy della Costa Smeralda. Presto ho iniziato ad annoiarmi tremendamente. Appena due ragazzi (romani?) mi si sono avvicinati e hanno iniziato a parlarmi, ho deciso di dare un senso alla mia serata. Ho costruito al volo un personaggio alternativo: una ragazza di Lille, studentessa universitaria, in Sardegna con amici. Avevo però perso di vista i miei amici che, guarda caso, avevano anche la mia borsa con dentro i soldi... quindi per berci qualcosa insieme dovevano per forza offrirmelo loro. Ho continuato a chiacchierare con loro perfezionando il mio inglese con accento francese e sorseggiando il mio gin tonic. Quando mi sono annoiata anche di quello, ho recuperato mio cugino e i suoi amici ricchi.</p>"}, {"id": "t-tobre-mariagiulia-quasi-come-fregoli-pdf", "g": 2, "autore": "Mariagiulia", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-28T21:28", "incipit": "La trasformazione comincia con il credere alla propria finzione. Un gioco di immedesimazione. E’ un gioco che…", "html": "<p>La trasformazione comincia con il credere alla propria finzione. Un gioco di immedesimazione. E’ un gioco che serve sempre, serve a tutto. Serve per poter essere sé stesse eppure, anche, no. Come sta succedendo a me ora, mentre scrivo mi trasformo: fino a 3 secondi fa ero la MG stanca, un po’ raffreddata, un po&#x27; sempre preoccupata, ed ora sono lei, o meglio sono come lei. Non so perché ma questo tema della trasformazione mi ha fatto pensare ad un mini saggio, non so neanche come chiamarlo in realtà, presente nel libro Falsi Amici di Claudia Durastanti che ho appena finito di leggere. Verso la fine del libro fa diversi elenchi di rosa, tra cui compare il rosa elettrico. Quel piccolo capitolo parte dalla Resurrezione di Piero della Francesca e arriva a Nick Cave. Lei dice che Nick Cave è l’artista che più profondamente l’ha costretta a pensare al significato del cambiamento. Tralasciando che il fatto che un artista costringa qualcuno è un concetto che mi infonde molta carica, Nick Cave, racconta, ha perso un figlio. Lei riporta che Nick Cave in un’intervista dice che la sua “statua è andata in pezzi: si è disintegrata. E’ esplosa”. Quattro anni fa iniziavo una ricerca dal titolo “La pratica del corpo elettrico” ed anche lì c’era un corpo che esplodeva, andava in pezzi, si frantumava e si disintegrava. Così, mentre sono una scrittrice di saggi che hanno un solo colore come tema centrale, penso che forse il punto della trasformazione, leggera, cangiante, con paiettes o maschere, oppure greve e pensante, stia proprio nel guardare in faccia tutti quei piccoli pezzetti di sé e rimetterli insieme, diversi ogni volta. Così anche io ora sono la scrittrice italo americana a cui manca la propria terra abbandonata quando era ancora giovane.</p>"}, {"id": "t-obre-pietro-opera-arcana-24-ottobre-docx", "g": 2, "autore": "Pietro", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-25T16:00", "incipit": "La trasformazione comincia con la vestizione: pantaloni multitasche neri con righina gialla e polo grigia con…", "html": "<p>La trasformazione comincia con la vestizione: pantaloni multitasche neri con righina gialla e polo grigia con triangolino verde del logo. La mia prima giornata da commesso può avere inizio. Intorno a me pavimenti scintillanti in PVC, sparuti clienti dall’aria sconsolata, migliaia di modelli di assi del cesso, spazzoloni da cesso, tazze del cesso e qualche bidet.</p><p>Il percorso che mi aveva portato al reparto sanitari della Leroy Merlin di Rozzano non partiva da molto lontano. Al colloquio eravamo in dieci, ci avevano messi intorno a un tavolo e ci avevano sottoposto dei problemi che spaziavano dal riscaldamento globale al riordino degli articoli per forma e colore sugli scaffali di un negozio di giocattoli.</p><p>Era stato un colpo di testa, una delle tante decisioni impulsive dettate dalla fregola che mi aveva già spinto ad abbandonare un dottorato in filosofia, cambiare città e proporre alla ragazza che frequentavo da sì e no due mesi di andare a convivere. Avevo fatto quasi come Fregoli. Mi ero camuffato da aspirante commesso weekendista pronto a guidare i disorientati avventori nel mondo delle assi del cesso in polipropilene. Alla fine del secondo weekend ero a terra: decisi che potevo benissimo continuare a dividermi tra i banchi dell’università e i tavolini del ristorante dove lavoravo. Chiamai l’ufficio HR e comunicai che il mio periodo di prova finiva lì. Non dissi niente dei pantaloni multitasche e nessuno mi chiese mai di riportarli in negozio.</p>"}, {"id": "t-ay-sun-24-ottobre-sarah-24-ottobre-1-pdf", "g": 2, "autore": "Sarah", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-10-25T19:20", "incipit": "La trasformazione comincia con un pensiero. Giravamo in tondo seguendo il navigatore, tra quattro strade poco…", "html": "<p>La trasformazione comincia con un pensiero. Giravamo in tondo seguendo il navigatore, tra quattro strade poco romantiche d’un paesino toscano- e ho pensato che non sarebbe stato male darci altri nomi. Per quella vacanza, se ce lo avessero chiesto, saremmo state... Come vuoi chiamarti tu? Sole? Ok, vada per Sole... e io? Allora un nome... fammi pensare... Romina! Ok, allora siamo Sole e Romina.</p><p class=st>Già, Sole e Romina non cercavano come sceme una casetta affittata su Airbnb in un improbabile San Qualcosa Scalo, tra villette tinte di rosa, terra lavorata e strade asfaltate di fresco e sconosciute ai gps. Sole e Romina andavano a trovare la zia in Toscana. Una delle tante fortune delle due donne- più puer che senex si intenda, particolarmente allegre e scemotte. Fortune perché quelle due, a differenza mia e della mia amica, vengono da un quartiere bene di Roma Nord e hanno tante zie e cugini e amiche che le ospitano in dimore sparse per il mondo. Noi pure eh, ma loro un po’ più chic. Sole e Romina sono un po’ superficialotte: l&#x27;adolescenza nella bambagia le ha mantenute innocenti, e non vedono l’ora di far quattro chiacchiere e raccontare la storia delle loro due vite belle tranquille. Sì adatta l’accento che, si sa, tra il nord e il sud di Roma la musica cambia un bel po’, e si cerca pure una vena toscana. Un vezzo in onore della zietta che ci ospita.</p><p class=st>Poi si attende. Trepidanti. Parlando tra noi come sceme per giorni con quell’accento inventato si attende che qualcuno ci chieda di noi. Da dove venite, che ci fate qui... La penultima sera, quasi scoraggiate (ma pur sempre brillanti e allegre) un Oste ci informa che il locale è al completo ponendo però la fatidica domanda. Che ci fate qui? Vi somigliate, siete cugine? E finalmente Sole e Romina si illuminano! Sì, si vede? Chi è la più grande, dice? No, siamo nate lo stesso anno, siamo cresciute insieme... sì, le nostre mamme erano sorelle e... In Prati, certo. Si, gli occhi blu di nonna, grazie. Peccato che siete al completo, già. Mannaggia. Torneremo. Sì, comunque siamo Sole e Romina. Piacere, piacere nostro.</p><p class=st>E per essere un po’ più sceme le possiamo sempre chiamare ché ciò che si è inventato, per quanto leggero e incorporeo, esiste e se deve può tornare.</p>"}, {"id": "t-tro-la-vittima-la-sfigata-claudia-g-docx", "g": 3, "autore": "Claudia", "titolo": "Il mostro, la vittima, la sfigata", "apertura": false, "separato": false, "arrivo": "2026-11-01T17:18", "incipit": "Il mostro, la vittima , la sfigata", "html": "<p>Il mostro, la vittima , la sfigata</p><p>C’è un buco sul fondo del lago dal quale escono le bambole con il viso di porcellana, il mostro che mi aspettava dietro ad ogni angolo pronto a tagliarmi con i suoi artigli ogni volta che andavo giù in cantina.</p>"}, {"id": "t-sun-31-ottobre-federica-flesh-fluids-pdf", "g": 3, "autore": "Federica", "titolo": "Flesh & Fluids", "apertura": false, "separato": false, "arrivo": "2026-11-02T19:49", "incipit": "C’è un buco sul fondo del lago dal quale esce una grande bestia nera e ossuta. Ha i capelli rasati a zero,…", "html": "<p>C’è un buco sul fondo del lago dal quale esce una grande bestia nera e ossuta. Ha i capelli rasati a zero, gli anfibi, e molte borchie. Occhi diversi per grandezza e colore, parecchi denti acuminati e tanta, tantissima fame. Verrà rinchiusa perché andare in giro è pericoloso - pericoloso per lei, non lei un pericolo per altri. Non sarà sconfitta; sarà accettata, seppur con fatica, ammansita, e finirà per accoccolarsi, la notte, ai piedi del letto.</p>"}, {"id": "t--31-ottobre-giusy-russo-camp-miasma-docx", "g": 3, "autore": "Giusy", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-02T12:19", "incipit": "“C’è un buco sul fondo del lago dal quale”... vedo una speranza. Quella di scappare da questa casa e dalle…", "html": "<p>“C’è un buco sul fondo del lago dal quale”... vedo una speranza. Quella di scappare da questa casa e dalle prepotenze. Malgrado la mia condizione di unicorno ferito ancora credo. Nell’amore, nell’amicizia, nella giustizia. Sono giovane, ancora.</p>"}, {"id": "t--sun-31-ottobre-camp-miasma-ilaria-f-pdf", "g": 3, "autore": "Ilaria", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-06T19:29", "incipit": "C'è un buco sul fondo del lago, dal quale sembra impossibile uscire.", "html": "<p>C&#x27;è un buco sul fondo del lago, dal quale sembra impossibile uscire.</p><p class=st>Intrappolata in un corpo che non sai di chi sia.</p><p class=st>Si svela allo specchio, ma gli occhi non sanno vederlo.</p>"}, {"id": "t--31-ottobre-camp-miasma-mariagiulia-docx", "g": 3, "autore": "Mariagiulia", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-10T18:07", "incipit": "Sul fondo del lago c’è un buco dal quale ogni tanto esce una parte di me: cattiva, spietata, impenitente.…", "html": "<p>Sul fondo del lago c’è un buco dal quale ogni tanto esce una parte di me: cattiva, spietata, impenitente. Balza fuori con zanne, artigli e squame. Occhi che inceneriscono, bocca che sputa fuoco e veleno, narici che esalano aria putrefatta. Mammelle da cui sgorga latte nero. Genitali che seducono e uccidono.  Una coda dall’estremità spinata. Cannibale, vendicativa, padrona di sé. Lei è puro desiderio. Inarrestabile ribelle e radicale desiderio di essere sé, solo sé e non rientrare in nessun canone imposto.</p>"}, {"id": "t-obre-pietro-opera-arcana-31-ottobre-docx", "g": 3, "autore": "Pietro", "titolo": "Flesh & Fluids in Paolo Sarpi", "apertura": false, "separato": false, "arrivo": "2026-11-03T14:37", "incipit": "C’è un buco sul fondo del lago", "html": "<p>C’è un buco sul fondo del lago</p><p>dal quale fumi di bòtti e Marlboro</p><p>risalgono come conati</p><p>con flutti di sputo e insulti di fuoco.</p><p class=st>Fare a gara a chi ha più peluria,</p><p>fumare tabacco e foglie di salvia,</p><p>i ghigni di Andy e di Johnny,</p><p>Mathews che pompa prima della trap.</p><p class=st>Scorribande per i negozi,</p><p>bottiglie sfasciate nell’oratorio,</p><p>furti di bici, corse e risa,</p><p>sassate, risse, cartacce bruciate.</p><p class=st>Nei cortili pericolosi,</p><p>viale Montello, i calabresi,</p><p>prima che ammazzassero Lea,</p><p>le bande, gli amici, i patti traditi.</p><p class=st>Con Bianca sotto alle lenzuola,</p><p>messaggi abbreviati coi tivibbì,</p><p>con il sexting senza le chat,</p><p>la bocca di Titti e di Geralisa.</p><p class=st>Con i raga, prima dei fra’,</p><p>sbagliare prima che fosse sbagliato,</p><p>prima che il prima fosse chiaro</p><p>e tutto il resto sul fondo del lago.</p>"}, {"id": "t-urday-sun-7-novembre-alice-cane-blu-docx", "g": 4, "autore": "Alice", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-08T12:42", "incipit": "Chiudo gli occhi e sono lì di nuovo, come fosse ora. Sto sdraiata sulla pancia, le braccia e le gambe larghe…", "html": "<p>Chiudo gli occhi e sono lì di nuovo, come fosse ora. Sto sdraiata sulla pancia, le braccia e le gambe larghe come una stella marina. Tutta questa attrezzatura mi ingombra e mi fa sentire goffa e legata. Respiro troppo in fretta, appena apro la bocca sembra che il boccaglio mi spinga l’aria nei polmoni. Allora decido di trattenere il fiato. Resto ferma, mi rilasso, faccio il vuoto e finalmente posso guardarmi intorno, lo sguardo non è più rivolto all’interno, il campo dell’attenzione può espandersi. E allora – pura gioia – vedo gli scogli, i coralli, i colori, le alghe e i pesci e pesci e pesci e capisco che posso ricominciare a respirare – prendo fiato. Mi immergo.</p>"}, {"id": "t-derica-storia-di-un-piccolo-cane-blu-pdf", "g": 4, "autore": "Federica", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-08T12:41", "incipit": "Chiudo gli occhi e sono lì, di nuovo, come fosse ora. Sto bevendo un bicchiere di vino, al tramonto, e lascio…", "html": "<p>Chiudo gli occhi e sono lì, di nuovo, come fosse ora. Sto bevendo un bicchiere di vino, al tramonto, e lascio che lo sguardo e i pensieri si perdano.</p><p>La luce del sole, che tra poco sparirà dietro le montagne, ancora scalda, come una forza decisa e gentile che mi accompagna verso la notte, verso il buio.</p><p>E in quel momento capisco. Quel che devo fare è chiaro. Tornerò a casa, e qualcosa finirà. È un pensiero doloroso ma puro, mi riempie gli occhi di lacrime.</p><p>Piango, piano. Sto per perdere qualcosa, sto per ritrovare tutto.</p>"}, {"id": "t-russo-storia-di-un-piccolo-cane-blu-docx", "g": 4, "autore": "Giusy", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-08T10:28", "incipit": "Chiudo gli occhi, e sono di nuovo, come fosse ora. Sto scegliendo la sede della mia prima scuola. Ho 29 anni,…", "html": "<p>Chiudo gli occhi, e sono di nuovo, come fosse ora. Sto scegliendo la sede della mia prima scuola. Ho 29 anni, sposata da due, confusa e felice, ansiosa di diventare mamma. Lavoro da oltre due anni come stage manager, interprete, confidente scelta e servo di scena con la casa di produzione di Marisa Laurito, una persona, malgrado il suo ambiente, di una purezza totale. Anche io sono una pura, e mi dispiace sinceramente di doverla abbandonare; lei, le sue lacrime e il suo mondo glitterato. Ma a cinque anni di distanza dal.concorso mi hanno chiamato dalla scuola pubblica. Sono finalmente tra le prime in graduatoria. Manco me lo ricordavo più, io, quel concorso. Che mi ha aperto a nuove possibilità: stipendio sicuro, orari decenti, il mio antico sogno di insegnare, una famiglia da creare: non potrei proprio dire di no.</p>"}, {"id": "t-day-sun-7-novembre-cane-blu-ilaria-f-pdf", "g": 4, "autore": "Ilaria", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-08T19:10", "incipit": "Chiudo gli occhi e sono lì, di nuovo, come fosse ora. Sto fissando il fondo bianco dell’armadio in formica…", "html": "<p>Chiudo gli occhi e sono lì, di nuovo, come fosse ora. Sto fissando il fondo bianco dell’armadio in formica che mi sovrasta.</p><p class=st>Mai avrei pensato di ritrovarmi a dormire in un letto stretto e scomodo come quello in cui dormivo da bambina. Nei miei dieci anni di assenza, mia madre era riuscita a racimolare un altro letto a ponte bianco come lascito della vicina di casa sarda, tanto amata, che si è trasferita ad una decina di chilometri da lì. Un letto di fattura brianzola, fine anni 80/primi anni 90, spaventosamente simile a quello in cui ho dormito fino ai miei 7 anni. Il settimo era stato l’anno della prima rivoluzione: la convivenza forzata con i nonni, il trasloco nella casa nuova, la nascita di mia sorella, momento più bello della mia vita fino ad allora. Sono lì a fissare il fondo di quell’armadio ripieno di libri e di oggetti casualmente accumulati da mia madre e penso che per il peso che porta dentro potrebbe schiacciarmi nel sonno. Tornare a casa di mia madre per qualche giorno per farmi ammazzare schiacciata dal peso degli oggetti.</p><p class=st>Quello che possedete finirà per possedervi.</p><p class=st>Spero non sia questo il motivo per cui sono qui.</p><p class=st>Il profumo delle Marlboro rosse di mio padre sembra aggirarsi ancora tra il disordine di quelle stanze, come una forza decisa e gentile che mi richiama all’ovile.</p><p class=st>Dopo qualche mese passato a Taranto, sono di nuovo al punto di inizio. I mesi passati nella città dell’Ilva sono stati una breve pausa, ma ora serve ritrovare una direzione, uno scopo, ripescare una carta dal mazzo e ricominciare a credere in qualcosa.</p><p class=st>Nella notte insonne ho sentito di spurgare tutto il dolore che mi attraversa: un mal di testa accecante ha ripercorso il mio cranio fino a diffondersi su zigomi e mandibola. Non mi capacito come tanto dolore non fosse stato accompagnato da febbre. Mai provato qualcosa del genere.</p><p class=st>Mentre mi lecco le ferite arriva la telefonata di Nico. Con la purezza di intenti che lo contraddistingue, disinteressato e visionario, mi parla di un progetto di circo contemporaneo da sviluppare e coordinare in Basilicata.</p><p class=st>“Quando?”</p><p class=st>“Tra una decina di giorni al massimo. Laura, l’ideatrice del progetto, dice che potrebbe affittarti una stanza di casa sua”</p><p class=st>“Andata!”</p><p class=st>Guardo lo zaino gettato in un angolo. Non avevo avuto bisogno di svuotarlo per davvero. Ci vorrà poco più di dieci minuti per essere pronta a ripartire.</p>"}, {"id": "t-sun-7-novembre-cane-blu-mariagiulia-docx", "g": 4, "autore": "Mariagiulia", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-10T18:20", "incipit": "Chiudo gli occhi e sono lì, sulla bicicletta che mi ha prestato la mia amica mentre pedalo veloce in salita…", "html": "<p>Chiudo gli occhi e sono lì, sulla bicicletta che mi ha prestato la mia amica mentre pedalo veloce in salita su per la collina verso il parco. Una strada che ormai sto imparando a memoria nonostante la città mi sia ancora nuova. Semaforo rosso, freno, appoggio la punta del piede destro per terra, un gesto che mi fa sentire sicura e disinvolta. L’aria è tersa, decisamente fredda anche se è già aprile, le nuvole corrono veloci, velocissime ed il cielo è alto, altissimo. Il corpo è indolezito dopo aver finito un allenamento in una lingua che non è la mia. Semaforo verde, un alito di vento mi spinge la schiena, la salita sembra meno salita, la fatica meno fatica, sorrido mentre mi lacrimano gli occhi per l’aria tersa e il sole che qui ha decisamente un altro colore: dovrei proprio vivere qui, penso.</p>"}, {"id": "t-mbre-pietro-opera-arcana-7-novembre-docx", "g": 4, "autore": "Pietro", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-08T16:36", "incipit": "9. Storia di un piccolo cane blu", "html": "<p>9. Storia di un piccolo cane blu</p><p class=st>Chiudo gli occhi e sono lì, di nuovo, come fosse ora. Sto versando il mio sguardo nei suoi occhi castani mentre sbuffi di aria gelata risalgono dalla galleria. Stiamo aspettando la rossa. È il suo primo inverno a Milano e esce ancora con queste giacchette. Ci stringiamo l’uno all’altra.</p><p>Ora dovremmo parlare del film, trovare qualcosa da dire prima che questo duello di sguardi si faccia troppo intricato. Ma lei non sembra a disagio. Il suo viso irradia una calma pura e robusta. Non sembra contemplare l’indomani mattina, quando dovrà alzarsi, rimettersi un cappottino troppo leggero e infilarsi di nuovo in metrò. Non sembra domandarsi se sotto casa sua farò durare un bacio un po’ più a lungo aspettando che lei mi chieda di entrare.</p><p>Sento una forza decisa e gentile che mi spinge verso di lei. Resistere sarebbe come cercare di fermare un ruscello con le dita.</p><p>Le parole escono da sole: «Ti ricordi l’amica della mia coinquilina? Sta lasciando un bilocale in Giambellino. Costa poco, però è troppo grande per andarci da solo».</p><p>Lei sorride incerta. La bacio. Risponde ironica: «Io non conosco nessuno che cerca».</p><p>Intanto è arrivato il metrò. Il vagone è tiepido, ma i nostri corpi si avviticchiano sempre di più. Sento il suo respiro sul collo e le mormoro fra i capelli: «Guarda che non stavo scherzando».</p><p>Lei mi sussurra all’orecchio: «Va bene, vengo con te».</p>"}, {"id": "t-oria-di-un-piccolo-cane-blu-roberta-docx", "g": 4, "autore": "Roberta", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-08T19:05", "incipit": "Storia di un piccolo cane blu", "html": "<p>Storia di un piccolo cane blu</p><p class=st>Chiudo gli occhi e sono lì di nuovo, come se fosse ora.</p><p>Sono seduta sul divano, è una domenica sera d’inverno. È buio, fuori le luci di Natale sul terrazzo sono ancora illuminate, le vacanze sono appena finite e il nuovo anno, con la sua valenza simbolica, è appena iniziato.</p><p>È un po’ di tempo che penso che è ora di fare i conti con il presente, con l’affanno, con il lavoro che si è preso ogni spazio, anche quelli che non erano liberi, con la sensazione di esistere soltanto in vacanza o nei weekend.</p><p>Vorrei ritrovarmi, nella mia essenza più pura, ma ho anche paura. Dire ad alta voce i propri sentimenti significa non potere più fare finta di niente, tirando dritto affidandosi alla propria resistenza, ma al contrario dare loro un nome, legittimarli e affrontarli.</p><p>Ad un certo punto, mentre tergiverso con lo stomaco chiuso, sento una forza decisa e gentile che mi porta a prendere coraggio e mandare quella mail, per avviare un nuovo corso.</p>"}, {"id": "t--alice-2026-novembre-09-e-tua-madre-docx", "g": 5, "autore": "Alice", "titolo": "E tua madre", "apertura": true, "separato": false, "arrivo": "2026-11-11T14:50", "incipit": "“E tua madre, come sta?”", "html": "<p>“E tua madre, come sta?”</p><p>La cattedra, da dove sono seduta io, sembra lo scranno di un giudice, ma alto come un palazzo.</p><p>Per vedermi con quegli occhietti piccoli e cattivi la prof si deve sporgere da un angolo e guardare verso il basso – l’aria schifata che ha sempre quando mi parla.</p><p>Mia madre sta male, malissimo. Ma non è che la prof le sia affezionata, non è per questo che me lo chiede – vuole creare un collegamento fra l’interrogazione in cui ho fatto scena muta e la malattia di mia madre.</p><p>Vuole distruggermi schiacciarmi polverizzarmi.</p><p>Non rispondo – la scena muta continua. Non solo con lei, ma anche con i compagni - sono in terza media e la vita è un inferno. La scena muta a scuola e a casa è il mio strumento di difesa. Il mio guscio di odio e silenzio si espande e tiene tutti a distanza.</p><p>Questa distanza mi protegge – quando i compagni si picchiano all’uscita da scuola rotolandosi per terra in mezzo a un cerchio di ragazzini che urlano “Sange, sangue!”, quando le compagne riunite in un crocchio si sussurrano all’orecchio cattiverie puntando il dito e ridendo, io sono altrove.</p><p>Questo istituto è riuscito a spezzarci – siamo entrati che eravamo poco più che dei cuccioli di labrador e in tre anni i miei compagni sono diventati spietati aguzzini del loro vicino di banco, maestri nell’identificare la debolezza, la differenza, la ferita in cui affondare i denti per lacerare la carne.</p><p>Fanno finta di essere in America, sono sempre puliti e pettinati, il gel discreto fa sembrare i capelli dei maschi un caschetto playmobil, le code di cavallo alte e perfette delle ragazze non si muovono neanche quando giocano a tennis. Beneducati e formali dicono cose come “non capisco cosa hanno gli operai da lamentarsi, è grazie a mio padre se hanno un lavoro”.</p><p>Se non sei uguale, vestito uguale, pettinato uguale, uguale nei modi, nell’educazione e nel ceto sociale, sei a rischio.</p><p>I rischi sono parecchi: puoi essere ridicolizzato, picchiato, o, la peggiore delle punizioni: puoi essere isolato.</p><p>Intorno alla ragazzina poco più grande, arrivata in classe con noi a forza di bocciature, di cui si vocifera che sia incinta, si crea un buco nero di banchi vuoti – nessuno le si avvicina né le rivolge la parola nel caso il disonore potesse essere contagioso.</p><p>Non essere accolti nel circolo è l’inizio della fine.</p><p>Oppure è solo l’inizio.</p><p class=st>Sono passati tre mesi d’estate – le vacanze – questa gente non la vedrò mai più.</p><p>La scuola non è più dietro casa, devo andarci in biciletta – sfreccio sul pavé, sui sampietrini e fra le rotaie dei tram – la città si è aperta, i paesaggi e la luce sono nuovi e anche il respiro.</p><p>In ultima fila, il mio compagno di banco fuma in classe, ha tre anni più di me, si veste come James Dean.</p><p>Ci metto un bel po’ a smettere di scattare in piedi quando entra la professoressa, facendo ridere tutti, professoressa compresa.</p><p class=st>Due settimane fa sono andata da un vecchio amico a recuperare gli scatoloni che ho lasciato per dieci anni nella cantina dei suoi - la casa è in vendita, la cantina va svuotata.  Domenica finalmente io e Fabrizio abbiamo finito di mettere sugli scaffali della nostra libreria i libri di mia madre.  Salta fuori un libretto di Savinio e di colpo mi ricordo con precisione la sua faccia. Siamo sedute in cucina e come capita spesso le leggo il libro a voce alta. Lei mi guarda, fuma una sigaretta, davanti ha un bicchiere pieno di tè nero, sorride, è contenta.</p>"}, {"id": "t-iudice-interiore-federica-9-novembre-pdf", "g": 5, "autore": "Federica", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-10T18:46", "incipit": "Tutto faceva pensare a una catastrofe. Era notte, entrambi avevano bevuto, lei forse ancora più di lui - da…", "html": "<p class=int>QUELLA VOLTA IN CUI SONO STATA UN ANGELO</p><p class=st>Tutto faceva pensare a una catastrofe. Era notte, entrambi avevano bevuto, lei forse ancora più di lui - da quando ha smesso di fumare, con l’alcol le manca il senso della misura. Si era rifugiata un attimo in bagno a piangere, non sapeva nemmeno bene per che cosa, e quando era tornata a letto lui aveva detto: è l’inizio della fine. E lì, lei l’aveva sentita arrivare, partire dalla pancia e irradiarsi in tutto il corpo, fino alle estremità, calda, infuocata: la rabbia. La voglia che aveva di uscire da lei, di rovesciarsi addosso a lui, di essere vomitata fuori con la voce alta e il respiro affannato, in forma di parole di cui, poi, si sarebbe sicuramente pentita. Il primo gesto, in effetti, improvviso: si era alzata di scatto dal letto, e con veemenza aveva detto: ma che cazzo stai dicendo. Poi qualcosa era successo, qualcosa che con grazia, con dolcezza, con intelligenza, l’aveva placata. Una forza opposta e gentile che aveva abbassato la temperatura, calmato il respiro, e così aveva dato lucidità ai pensieri.</p><p class=st>Non sono uscite parole spiacevoli. Le orecchie, e il cuore, hanno saputo ascoltare.</p><p class=int>LA GRANDE E BELLA RIBELLIONE</p><p class=st>Ti ricordi la tua grande bella ribellione? È stato quando ti sei data il permesso di sbagliare, di comportarti male, di fare il contrario di quello che gli altri si aspettavano da te.</p><p class=st>Da tutta la vita ti porti dietro questa immagine che ti hanno affibbiato: la brava bambina. Coscienziosa, responsabile, affidabile. Bella e brava, carina, educata, sorridente. Che brava, i tuoi genitori non hanno bisogno di controllarti il diario. Che brava, non devono aiutarti a fare i compiti. Che brava, che ubbidiente, fai sempre la cosa giusta, non alzi la voce, non dai fastidio. Che brava, dove ti si mette tu stai.</p><p class=st>A furia di recitare questa parte ti sei convinta di essere proprio così. Non sembrava possibile, non era accettabile fare il contrario.</p><p class=st>Per questo è stato così bello disobbedire. Fare la cosa sbagliata, rovesciare le carte sul tavolo. Far rimanere tutti a bocca aperta.</p><p class=st>Certo, il prezzo da pagare è stato alto. Hai dovuto sopportare sguardi e parole di rimprovero. C’è chi ha cambiato decisamente opinione su di te. Hai perso qualcuno. E infatti, se ricordi bene, c’è voluta una certa dose di incoscienza: se avessi soppesato tutti i pro e i contro non l’avresti fatto. Per fortuna non hai pensato così tanto in quel momento. Per fortuna ti sei concessa di fare esattamente quello che volevi tu, senza ascoltare le voci di chi ti voleva piccola e addomesticata.</p><p class=st>È stato come levarti di dosso strati e strati di pelle per tornare ad essere, finalmente, dopo tanto tempo, fedele a te stessa.</p>"}, {"id": "t-iusy-russo-il-mio-giudice-interiore-docx", "g": 5, "autore": "Giusy", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-10T10:47", "incipit": "Il mio giudice aveva un nome e un volto, oggi. Quello di un mio caro collega, ormai in pensione, morto di…", "html": "<p class=int>Incontrare il giudice</p><p>Il mio giudice aveva un nome e un volto, oggi. Quello di un mio caro collega, ormai in pensione, morto di recente. Quando eravamo insieme in classe mi proteggeva dalla mia gioventÃ1 irruenta e mi ha insegnato piÃ1 volte a contare fino a dieci-mila prima di partire all&#x27;attacco. Un signore d&#x27;altri tempi, ricordava un po&#x27; il maestro Parboni del libro &quot;Cuore&quot;. Chi ha lavorato con lui o lo ha avuto come docente Ã ̈ stato davvero un privilegiato. Io mi ci sono sempre sentita, una privilegiata, con lui, perchÃ© ho il dono di saper riconoscere la qualitÃ . In cose e persone. Ecco, lui era un&#x27;anima di qualitÃ . L&#x27;ho sognato, l&#x27;altra notte, e l&#x27;ho immaginato oggi. Vestito come faceva spesso, a scuola: elegante e semplice, una camicia chiara, il cravattino e un paio di jeans di marca. Magro e longilineo, anziano e senza tempo, pieno di entusiasmo e musicalitÃ . Come tutti i partenopei. Mi colpiva, nel sogno, e anche oggi, il fatto di non riuscire a vedergli gli occhi. Teneva le palpebre chiuse. &quot;Di cosa hai paura?&quot; Le domande di stasera. Risponde: &quot;amica mia, adesso non ho paura di niente!&quot; &quot;Da che cosa mi stai proteggendo?&quot; &quot;Dalla sfortuna che pensi di avere&quot;. Mi sono sentita piccola e scema, come a volte mi sentivo quando ero una novellina e lui giÃ  un gigante, in classe. E ho realizzato quanto Ã ̈ vero che chi ci ha amato non ci lascia mai.</p><p class=int>1. Quella volta in cui sono stata un Angelo</p><p>Tutto faceva pensare a una catastrofe. Era lo scontro tra due ottusitÃ , forze uguali e contrarie che si fronteggiavano: due sue colleghe che la pensavano in modo diametralmente opposto su come portare avanti un lavoro, ognuna convinta di detenere la veritÃ , e per nulla disposta a cedere terreno all&#x27;altra. Lei, col suo senso della misura innato (che le ritorna perfino utile quando le manca fisicamente un metro ed Ã ̈ costretta a misurare ad occhio spazi ed oggetti) e con la sua intelligenza aveva intuito una terza via tra le due contendenti, che sembrava un buon punto d&#x27;incontro; riusci in questo modo ad evitare la lotta dei titani e a far concludere al meglio la giornata.</p><p class=int>2. La grande e bella ribellione</p><p>Ti ricordi la tua grande e bella ribellione? Ãˆ stato quando con un colpo di lingua hai fatto a pezzi l&#x27;apparecchio per i denti che nel tentativo di farli crescere piÃ1 dritti ti faceva assomigliare a una specie di alieno dalla bocca ferrata. Tu eri una creaturina femminile e graziosa, non fosse stato per quelle fauci da cyborg. Avevi 12 anni, il periodo delle prime cotte; quale ragazzo avrebbe mai osato accostarsi alla tua bocca metallica? Ma si puÃ2, all&#x27;etÃ  del primo bacio, presentarsi con un groviglio di fili di acciaio che dal palato raggiungevano l&#x27;arcata inferiore per poi fare ritorno verso gli incisivi e lanciare bagliori sinistri nell&#x27;oscuritÃ ? La decisione era presa: presentarsi alla festa di compleanno del ragazzo che ti piace libera da gabbie e incurante dei dentoni storti e affrontare le ire di genitori e dentista. L&#x27;amore val bene un po&#x27; di sofferenza.</p>"}, {"id": "t-iusy-russo-lei-racconto-di-apertura-docx", "g": 5, "autore": "Giusy", "titolo": "Lei", "apertura": true, "separato": false, "arrivo": "2026-11-10T10:47", "incipit": "Lei prende il sole sulla spiaggia salernitana. E si rilassa per dieci minuti. La nonna la aspetta a casa…", "html": "<p>Lei prende il sole sulla spiaggia salernitana. E si rilassa per dieci minuti. La nonna la aspetta a casa insieme ai suoi due bambini, e deve tornare. Ma ai dieci minuti di bagno di sole lei non rinuncerebbe mai.</p><p>Un giorno anche il marito la aspetta a casa. E tutto emozionato le annuncia che il cugino gli ha finalmente trovato un posto sicuro e ben pagato nel suo Paese d&#x27;origine, la Svizzera, nel Canton Ticino. Ovviamente andrÃ  prima lui, troverÃ  una casa per loro e i bambini, e poi la famiglia si riunira&#x27;. Tutti insieme, e da soli. Senza nonni, parenti, amici, vicini a dare una mano.</p><p>Lei parte, in treno, Ã ̈ il 2020. Coi due bambini di 8 e 12 anni, la mascherina (Ã ̈ il 2020, in pieno covid) e la valigia di cartone piena di sogni, come Charlot. Per inseguire il sogno non americano, bensÃ¬ elvetico, di una vita piÃ1 ricca. O almeno, benestante. Poco le importa di lasciare gli anziani genitori, i parenti, le amiche. La sua vita di casalinga forzata (prima lavorava in un hotel, ha il diploma alberghiero) ma non disperata, le era stata richiesta dal marito, per potersi occupare a tempo pieno della casa e dei ragazzi. Che ora le chiedeva questo trasferimento, come se fosse facile, e naturale. La famiglia Ã ̈ la famiglia, e se la prospettiva Ã ̈ quella di riunirsi al padre dei suoi figli, per il bene comune, ogni sacrificio si fa. Lei, adesso, la pensa cosÃ¬. D&#x27;altra parte, anni prima, non aveva forse accettato di buon grado di rinunciare alla carriera di lavoratrice per abbracciare quella di mamma?</p><p>La Svizzera Ã ̈ fredda, pulita, senza mare e senza sole. Il tempo passa, I suoi bambini sono ragazzi, ragazzi svizzeri che non la guardano quasi piÃ1. O forse non vogliono. Lei si Ã ̈ trovata dei lavoretti al nero per passare il tempo durante la scuola, combattere la solitudine e per aiutare. Marito e figli ormai sono del posto. Sereni e anaffettivi, lontani anni luce anche se condividono la casa con lei. I bambini si adattano, si sa. Gli adolescenti pure. Rimpiangono con gli occhi, a volte, i nonni e gli amici del loro posto, ma vedono una vita che si apre in un posto con piÃ1 opportunitÃ . Ãˆ dura, la sensibilitÃ . Che in questa nuova terra pare pesare solo per lei. Meglio essere anaffettivi e opportunisti, pensa. Ci devo riuscire anch&#x27;io. E magari rimettermi in carriera. E mentre si trova seduta davanti al lago, che Ã ̈ sempre acqua e le ricorda un po&#x27; casa, le capita, su Facebook (grazie al telefono si tiene in contatto con i suoi affetti e col suo Paese), una poesia che sembra riguardare terribilmente la sua situazione: &quot;Un fiore cresceva accanto a una finestra chiusa. Ogni giorno si inclinava Verso quel poco di luce Che riusciva a raggiungerla. E ho pensato che forse La speranza non Ã ̈ avere Sempre il sole davanti. Ãˆ continuare a cercarlo, Anche quando ne arriva Soltanto un piccolo raggio&quot;.</p>"}, {"id": "t-ce-interiore-2-la-giustizia-ilaria-f-pdf", "g": 5, "autore": "Ilaria", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-10T18:54", "incipit": "La sua silhouette si alza da terra quasi senza fine, ma non eretta, bensì piegata su sé stessa, a quattro…", "html": "<p class=int>il giudice</p><p class=st>La sua silhouette si alza da terra quasi senza fine, ma non eretta, bensì piegata su sé stessa, a quattro zampe. Braccia e gambe sono tutt’uno con il terreno. Informi, lunghissime, coriacee, come fossero radici aeree. L’incarnato è rosso fuoco. Non ha un volto, dei capelli grigi lunghi e secchi. Tra i capelli che ricoprono il volto e quasi toccano terra si intravvede un occhio spalancato, scuro, lucido. Alle sue spalle si intravvede il ciglio di una città, qualche muretto cadente soffocato dall’edera, palazzi lontanissimi. C’è spazio, una vaga desolazione.</p><p class=st>Di che cosa hai paura? Di fallire.</p><p class=st>Da che cosa vuoi proteggermi? Dalla sofferenza, dal dolore che provi nel vedere la delusione negli occhi degli altri.</p><p class=int>quella volta in cui sono stata un angelo</p><p class=st>Tutto faceva pensare a una catastrofe. Era iniziato dal nulla. Non era chiaro come da un pranzo in famiglia si fossero trovati in quella raffica di urla indomabili. L’anziana signora a terra, rantolante, non riusciva a rialzarsi, lui continuava ad urlarle contro e a maledirla. Nessuno aveva mai visto il fratello più giovane così indiavolato. L’anziana zia aveva fatto certamene di tutto per indispettirlo, probabilmente erano giorni che tentava di stuzzicarlo, dargli fastidio. Era la sua natura: zizzania pura. La giovane donna cercò di allontanarlo perché la situazione non degenerasse ulteriormente. Il fratello maggiore prese la zia tra le braccia e l’aiutò a rialzarsi. Faceva fatica a respirare “La porto in ospedale”. Il giovane, invece, ancora inferocito. Allora la giovane donna, con la sola sua presenza lo contenne, con fermezza e con misura, finche il fratello maggiore e la zia non si furono allontanati. Lui era sconvolto. Negli occhi rabbia e paura si mescolavano come liquidi agitati con forza. “Io non volevo!” disse lui disperato.</p><p class=st>“Lo sappiamo, Non ti preoccupare” e al sentire queste parole lui scoppiò in un pianto liberatorio. Per la prima volta si aprì e le parlò di quello che stava vivendo, del dolore nel vedere i genitori invecchiare, della lucidità nel sapere che la madre era ormai un’imprevedibile scheggia impazzita, delle vessazioni che aveva dovuto sopportare in quei giorni, del senso di responsabilità e di colpa che lo schiacciavano.</p><p class=st>Le rughe di rabbia e nervosismo si distesero, con lo sguardo rivolto a terra, trovò finalmente il coraggio per far un respiro profondo.</p><p class=int>la grande e bella ribellione</p><p class=st>Ti ricordi la tua grande e bella ribellione? È stata quando hai passato un’estate intera a lavorare nei bar delle piscine milanesi per mettere da parte due spiccioli e andartene a Londra. Non l’avevi detto a nessuno. Ma lo avevi deciso prima che l’estate iniziasse. Avevi una voglia irresistibile di allontanarti da tutto e da tutti. La scusa era che i tre lavori che già facevi, mentre frequentavi l’università, non sarebbero bastati per pagarti l’affitto di una stanza a Milano: tanto valeva andarsene. La verità è che allontanarti da certe situazioni non era solo un desiderio, era una necessità. Sentivi che la quotidianità in pianura ti stava facendo rotolare in un pozzo nero senza fondo. Ne avevi abbastanza.</p><p class=st>Durante l’estate sei stata ospite della tua amica. Lei studiava per riprovare ad entrare nella facoltà di medicina, dopo un primo fallimento, e tu lavoravi tutto il giorno, per lasciare quella vita e una facoltà, che in fondo ti piaceva molto. Quando rientravi a casa sua, la sera, ti sembrava di essere un po’ tuo padre, quando rientrava dal lavoro dopo oltre 12 ore fuori casa.</p><p class=st>Ma l’estate era calda, non sempre avevi volgia di una casa, e hai passato qualche nottata in giro, a fare la randagia, fino a quel mattino in cui ti sei addormentata al volante, con l’auto ferma al semaforo, mentre il bar della piscina aspettava che tu lo aprissi.</p><p class=st>Qualche giorno dopo il tuo compleanno, una sera a tavola, tornata dai tuoi, lo hai annunciato: “La settimana prossima vado a Londra”</p><p class=st>“Ad imparare la lingua?”</p><p class=st>“Qualcosa del genere”</p><p class=st>“E quando torni?”</p><p class=st>“Non lo so”</p><p class=st>Ne è valsa la pena.</p>"}, {"id": "t-giudice-interiore-maitri-9-novembre-docx", "g": 5, "autore": "Maitri", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-10T08:28", "incipit": "Tutto faceva pensare a una catastrofe. Era da molto tempo che friggeva di dolore. Una scatola chiusa,…", "html": "<p class=int>QUELLA VOLTA IN CUI SONO STATA UN ANGELO</p><p>Tutto faceva pensare a una catastrofe. Era da molto tempo che friggeva di dolore. Una scatola chiusa, serrata. Trasparente, ma impenetrabile. Il contenuto era evidente, ma irraggiungibile, non percepibile, non pervenuto. E poi è successo qualcosa di inaspettato. Finalmente, quella scatola decise di rendersi più accessibile.</p><p>Non fu come se lo aspettava. Non si spalancò in un botto riversando il contenuto all’esterno. Fu un’apertura gentile, misurata. Come se sapesse che il contenuto era delicato e che sarebbe stato meglio farlo fluire dolcemente, anziché farlo erompere in circolo.</p><p>E lei accolse quel regalo. Si meravigliò dell’intelligenza dell’essere.</p><p>Il contatto col contenuto doloroso di quello scrigno trasparente e prezioso rivelò tanti doni preziosi. Gli occhi dell’altro smisero di farle paura. Si accorse che la vedevano, nessun bisogno di proteggersi o di dimostrare qualcosa. Semplicemente Amore, che aveva imparato a manifestarsi a suo modo e a suo tempo. E oggi era finalmente arrivato un altro tempo, un altro modo</p><p class=int>LA GRANDE E BELLA RIBELLIONE</p><p>Ti ricordi la tua grande e bella ribellione? È stato quando avresti potuto continuare a comportarti come al solito.</p><p>Ti saresti arrabbiata, scambiando la rabbia sana, la considerazione di te, con la reattività.</p><p>E invece quella volta ti sei stupita. È arrivata la reattività e tu l’hai osservata. Non l’hai giudicata. Sembrava un miracolo. Sarebbe stato di Natale, ma era Ferragosto e fuori facevano 40 gradi.</p><p>Avevi sempre pensato di doverti ribellare a qualcosa fuori e invece la ribellione serviva dentro. Ribellarsi a Giudice, cane di Dio, non a chi lo rappresentava. Non l’hai voluto, ma è successo. Hai osservato, hai vissuto, hai riconosciuto. Ed è successo. Allora era vero! Era possibile!</p><p>I pensieri correvano e la lingua stava ferma. Non tutto ha bisogno di essere vomitato fuori, espresso immediatamente. A volte ha bisogno di essere osservato, digerito, metabolizzato. E hai scoperto che non reagire lascia spazio alla rabbia, quella bella, quella che si sente, quella che rimette in contatto con l’anima, che ha bisogno di spazio per espandersi. E cosa ancora più meravigliosa tutto ciò ha avuto un valore prima che anche le circostanze mutassero. Troppo facile vedere l’abbondanza quando si manifesta. Più difficile, e l’hai fatto, riconoscere la giustizia quando ancora ha solo bisogno di essere agita. Questa si, è stata una grande e bella ribellione.</p>"}, {"id": "t-ni-opera-arcana-del-9-novembre-2026-dotx", "g": 5, "autore": "Marco", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-09T22:41", "incipit": "Il mio giudice era una figura umana fatta di fumo. Stava sdraiata e levitava. Quando mi parlava girava solo…", "html": "<p class=int>IL MIO GIUDICE</p><p class=st>Il mio giudice era una figura umana fatta di fumo. Stava sdraiata e levitava. Quando mi parlava girava solo la testa. Restava lì, sdriato, a levitare. Con tutti questi piccoli sbuffi di fumo tutti intorno. Non vedeva la faccia, non vedevo le sue espressioni. Era un unico fumo nero che formava un corpo umano. Aveva una voce profonda. Roca. Cavernosa. Stava in questa stanza spoglia, vuota, con le pareti rivestite di listelli di legno. Era una casa ma era totalmente spoglia e non riuscivo a vedere cosa c’era fuori dalle finestre. Io gli/le ho chiesto “Di cosa hai paura?”, lei mi ha risposto “Di avere paura” Quando gli ho chiesto “Da che cosa mi stai proteggendo?”, lei mi ha risposto “Da qualcuno che potrebbe farti del male.”.</p><p class=int>QUELLA VOLTA IN CUI SONO STATO UN ANGELO</p><p class=st>Tutto faceva pensare a una catastrofe. Era stato chiamato in quella stanza da una voce fortissima e minuscola che gridava, una voce senza misura. Lui corse, pensando che ci fosse stato un omicidio. In realtà vide due creaturine cadute dal cielo, una con dei riccioli biondi e l’altra quasi pelata che si contendevano un piccolo areoplano di metallo. Quell’areoplano, lui lo sapeva, era stato frutto di diverse serate di minuzioso cesellare, di perseverante saldare, di pazienza infinita. Il padre amava mettersi alla prova con quei modellini e, quando lui vide la scena davanti ai suoi occhi, non potè fare altro che pensare alla sofferenza che la distruzione di quel modellino poteva arrecare alla sua figura paterna. Si avvicinò con cautela alla nipote e alla sua amica che, infanti, volevano assolutamente quell’aviomotore della Seconda Guerra Mondiale. Con delicatezza glielo tolse dalle mani e lo sostituì, dimostrando una buona dose di intelligenza, con dei pennarelli e dei fogli da disegno. La pace tornò, con calma lui nascose il modellino e tornò al suo paradiso personale. Con le bimbe tranquillizzate e la gioia nel cuore.</p><p class=int>LA GRANDE E BELLA RIBELLIONE</p><p class=st>Ti ricordi la tua grande bella ribellione? E’ stato quando tu hai deciso che quel bacio lo dovevi dare. Era troppo tempo che te ne stavi fermo. Seduto su quella nuvola a giudicare chi era degno del tuo interesse e chi no. La soluzione era quella ideale. C’era un balcone dove tu stavi guardando il buio davanti a te. Sapevi che c’era il mare ma non ci avresti messo la mano sul fuoco, in quel momento. Guardavi, vedevi delle luci, capivi che qualcosa ti stava chiamando. Forse il mare, anche se non si vedeva. Poi c’era l’atmosfera. Forse c’era anche della musica. Era una serata piena di forse e tu avevi bisogno di una certezza. Che, nonostante la nuvola e nonostante la musica, già si sentiva nell’aria. Ah, tu eri anche abbastanza ubriaco. Questo tu lo devi riconoscere. Non è una colpa, no, assolutamente. Ma bisogna ammettere, a onor del vero, che tu, dalla nuvola, potresti essere caduto, inciampando. Giù. A dare quel bacio che non ti saresti mai aspettato di dare. Si, il bacio lo hai dato con la lingua. Come gli adolescenti alla prima cotta. Ma sei stato bravo, ora te lo posso dire. Hai fatto bene a essere così impulsivo. Era tutto perfetto. Nonostante il mare, forse. Nonostante la musica, forse. Nonostante tutto.</p>"}, {"id": "t-teriore-margherita-manzini-09-11-26-gdoc", "g": 5, "autore": "Margherita M.", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-10T00:05", "incipit": "Tutto faceva pensare ad una catastrofe irrisolvibile.", "html": "<p class=int>QUELLA VOLTA IN CUI SONO STATO UN ANGELO</p><p class=st>Tutto faceva pensare ad una catastrofe irrisolvibile.</p><p class=st>Era seduta sui gradini del salotto e cercava di calmarlo in qualche modo, di contenerlo. Giulio piangeva come se gli avessero staccato un braccio, quando gli prendevano questi momenti non c’era misura di contenimento che avesse efficacia.</p><p class=st>Umberto stava disteso sul divano continuando a ripetere che non era giusto, che lo spazio era di entrambi e che non si sarebbe alzato per nulla al mondo! A queste parole lei aveva provato ad abbracciare Giulio che urlava sempre più forte, a trattenerlo in qualche modo anche fisicamente, toccarlo, per calmare la crisi, non farlo sentire solo.</p><p class=st>Lui piccino biondo di quattro anni, nei cui occhi brillava sempre una furba intelligenza, le si era girato contro svincolandosi dall’abbraccio come un animale che qualcuno ha brutalmente ferito.</p><p class=st>Fissando quei piccoli occhi in un lampo lei aveva visto quanto quello sguardo fosse, In quel momento, altro dall’abituale.</p><p class=st>Gli occhi solitamente intelligenti e vivi erano ora vitrei e quasi opachi, dilatati appena erano occhi di bestia ferita e disperata e una vena di follia prematura li percorreva.</p><p class=st>Lei vide, riconobbe e amò in un solo momento quel dolore autentico e gonfio di solitudine, quell’anima piccina confinata in un altrove che nemmeno lei conosceva a che la possedeva senza misura, senza controllo.</p><p class=st>Quell’altrove non le era sconosciuto a sua volta lo aveva dovuto attraversare e sapeva bene che quello cui assisteva non era solo un capriccio di bambino, ma dolore acuto e inspiegabile a molti, la condanna di una vita.</p><p class=st>Umberto, figlio invisibile, primogenito di quella ricca famiglia fiorentina era aggrappato con tutte le sue forze al senso di giustizia: il divano non era di Giulio, era anche suo e non si sarebbe mosso, anzi si espandeva allungando braccia e gambe e cercando di occuparne più spazio possibile.</p><p class=st>In quel momento lei vide il cuscino a pallini bianchi.</p><p class=st>Si alzò decisa, lo prese e lo posizionò in mezzo al divano dicendo con fermezza che in questa maniera ognuno avrebbe avuto il suo spazio limitato ed esclusivo.</p><p class=st>L’idea sembrava aver colpito entrambi, non se lo aspettava nemmeno lei.</p><p class=st>Giulio, sfinito da se stesso, iniziava a calmarsi. Umberto brontolava che non era giusto, ma piano piano si era accomodato nel suo lato personale del divano: a destra. Lei aveva preso in braccio Giulio, che continuava a singhiozzare e lo aveva posizionato a sinistra facendogli notare che era talmente grande la sua metà del divano che poteva anche allungare le gambe.</p><p class=int>LA TUA BELLA GRANDE RIBELLIONE</p><p class=st>Ti ricordi la tua grande bella ribellione? È stato quando hai deciso di non morderti le labbra e tacere. Perché avresti dovuto? Vi stavano prendendo tutti per il culo. Tu avevi chiesto con adirata educazione delle spiegazioni su quanto vi veniva riferito, e chiarimenti su quanto invece vi era accuratamente nascosto, avevi messo in difficoltà davanti alla classe intera quella buffona che non riusciva ad articolare risposta a nessuna delle tue domande, perché ogni richiesta implicava un’ammissione di responsabilità che nessuno lì dentro voleva prendersi, lo sapevi bene.</p><p class=st>Aveva la lingua impastata, si contraddiceva mettendo in luce la sua mediocrità.</p><p class=st>Ricordi? Due sole persone su 20 erano intervenute a darti man forte.</p><p class=st>Non c’era stato merito nella tua grande e bella ribellione, erano solo quei 6.000 euro dati per due anni di formazione mai conclusa che ti facevano vomitare quasi senza volere quelle parole, non offensive, ma vere.</p><p class=st>Avevi tanta rabbia in corpo che avresti potuto rimanere lì ad elencare le loro mancanze e le loro bassezze per ore intere. Poi lei confusa aveva scosso la bionda frangetta alla Raffaella Carrà (che Raffaella Carrà mi perdoni il paragone...) e se ne era andata farfugliando che se non vi fidavate del metodo potevate andarvene da quella scuola. Una delle più lampanti e chiare forme di manipolazione cui tu avessi mai assistito.</p><p class=st>TI ricordi eri in preda come ad una febbre che ti pervadeva il corpo, tremavi quasi non mettevi pause vere, il respiro era sempre controllato da una tensione sottesa e costante, l’allerta di chi è pronto ad attaccare per non essere attaccato.</p><p class=st>Ricordi il seguito? Nessuno ti seguì nella tua lotta contro i mulini a vento.</p>"}, {"id": "t-a-volta-in-cui-sono-stata-un-angelo-gdoc", "g": 5, "autore": "Maria Luisa", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-13T22:17", "incipit": "Tutto faceva pensare a una catastrofe. Era lunedì. Domenica la piccola aveva espresso una difficoltà. Il…", "html": "<p>Tutto faceva pensare a una catastrofe. Era lunedì. Domenica la piccola aveva espresso una difficoltà. Il principe andò a parlarle per capire cos’avesse. Lei ebbe una crisi di pianto e gelosia: era abituata a vedere il principe tutti i giorni, ma quando la grande era in città le priorità cambiavano e lei si sentiva messa da parte. La grande non capiva bene questa istanza: lei poteva vedere il principe soltanto quando andava in città, quei pochi giorni al mese. Erano comunque decisamente meno dei giorni in cui la piccola aveva il principe tutto per sé. Ma dall’alto della sua intelligenza, aveva accolto quella richiesta di chiarimento. Aveva soltanto chiesto al principe di non star fuori troppo a lungo, dato che, comunque, quel tempo era suo, le spettava di diritto.</p><p class=st>Il principe stette fuori leggermente troppo a lungo... e la grande perse la misura. Regalò dunque al principe la seconda crisi di pianto e gelosia nell’arco della stessa giornata, da due persone diverse. Dai due poli. Che fatica. Povero principe!</p><p class=st>La mattina del lunedì entrambe le crisi col principe erano state risolte.</p><p class=st>Ma la grande sentiva che nel profondo c’era qualcosa che non andava bene. Sentiva che bisognava andare direttamente alla fonte, bisognava smettere di guardarsi da lontano, di percepirsi nemiche. Andò ad aspettare la piccola fuori dalla taverna. Le aveva scritto un bigliettino, da lasciarle al volo nel caso ricordasse male il suo orario di fine turno. Invece ricordava bene, stava per finire. Si sedettero. La grande tremava. Un alone di sudore già si era formato sulla sua maglietta.</p><p class=st>“Come stai?” chiese alla piccola - “Eh. Penso che il principe ti abbia detto della mia crisi di ieri”.</p><p class=st>“Sì, me l’ha detto. Ma infatti io volevo dirti che, se sei d’accordo, secondo me sarebbe bello parlare direttamente fra noi di queste cose”. E giù ammissioni, confessioni, mancava poco alle lacrime!, aneddoti, risate, vergogne, traumi, insicurezze, lamentele, prese in giro, sospiri, ringraziamenti, abbracci.</p>"}, {"id": "t-ce-interiore-9-novembre-mariagiulia-docx", "g": 5, "autore": "Mariagiulia", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-13T12:48", "incipit": "Tutto faceva pensare ad una catastrofe. Era una situazione che si ripeteva spesso nell’ultimo periodo: lei,…", "html": "<p class=int>QUELLA VOLTA IN CUI SONO STATA UN ANGELO</p><p>Tutto faceva pensare ad una catastrofe. Era una situazione che si ripeteva spesso nell’ultimo periodo: lei, insoddisfatta e frustrata della sua vita, faceva domande sul futuro a lui che, vessato dallo stress e dalle responsabilità, rispondeva solo con latrati rabbiosi. Senza pensarci, uscita dal bagno dopo la doccia, gli aveva chiesto: “ma quindi cosa facciamo a marzo?”. Lui non aveva risposto ed armeggiava in cucina, suo solito meccanismo per tergiversare e non rispondere. E lei in quel momento, lì, proprio in quell’istante, lo aveva sentito, lo aveva visto: il bivio, la scelta. Da una parte ripetere la domanda, insistere, pretendere che lui le desse una risposta chiara, che capisse la sua necessità di sapere cosa sarebbe successo a marzo, nella vita, ai loro progetti. Dall’altra, soprassedere, sorvolare, usare quelle ali di leggerezza che sapeva benissimo di avere, per ricavare una forma di comunicazione intelligente, una lingua che scandiva forme argentee che creavano un ponte tra il qui di lei e il lì di lui. Un nuovo metro di misura per calcolare distanze, dettato forse dal desiderio di sfatare la catastrofe e salvarsi in corner. Così, in un driblaggio superbamente architettato insieme da cuore, mente e bocca, scelse questa seconda opzione e per una volta la mattinata fu terribilmente piacevole.</p><p class=st>LA GRANDE E BELLA RIVOLUZIONE</p><p>Ti ricordi la tua grande e bella ribellione? E’ stata quando tu, cresciuta in una famiglia che inneggia all’arte, all’impegno politico, all’etica sopra il guadagno, alla ricerca sopra alla convenzione, all’andare contro, al lottare, all’indipendenza, allo spingersi sempre più in là, al non accontentarsi, al pensiero critico, all’intelligenza emotiva, al non essere come gli altri, alle scuole alternative, al “meglio sole”, al femminismo, alla lotta di classe, alla lotta contro il cambiamento climatico, all’essere intellettuali ma non borghesi, alle comunità, alla diversità, all’uguaglianza, al “vouloir, c’est pouvoir”...tu, ti sei seduta una sera sul divano e hai detto basta, non ce la faccio più, sono triste, sono sola, sono povera, sono impaurita. Sono la versione di me che tutti quei credo NON avrebbero dovuto creare. Eppure eccomi qui con il vuoto attorno.</p><p>Al vuoto non c’è soluzione: ci si può solo ribellare. Così probabilmente la vita è nata: big bang, urlo, esplosione che tutto muove, lingua nuova ed inventata che dà nomi alle cose. E quei nomi siamo noi, quei nomi sei tu che vedi il mondo. Ed il mondo, esiste. Ed il mondo, quando esiste, non è più vuoto.</p><p>Così ti eri messa in movimento: ti eri trovata un lavoretto stabile, non così nobile, artistico ed eccezionale ma che, detto tra noi sottovoce, ti piaceva e divertiva. Avevi deciso di mettere su famiglia, ti eri sposata e con tuo marito pensavate ai figli. Lui lavorava e guadagnava più di te, tu ti acclimatavi nella nuova routine un po&#x27; standard. Tutto stava succedendo in una successione decisamente canonica, banale, ordinaria, comune. Eppure adesso ridevi ogni mattina e dormivi ogni notte, non sempre serena ma fiera, perché la felicità contro il vuoto, la vita contro la morte, è stata per te la più grande e bella delle rivoluzioni.</p>"}, {"id": "t-eriore-pietro-opera-arcana-26-11-09-docx", "g": 5, "autore": "Pietro", "titolo": "", "apertura": false, "separato": false, "arrivo": "2026-11-09T23:18", "incipit": "Un robot senza sesso, con la calotta cranica aperta, composto di mille ingranaggi, parla lentamente con una…", "html": "<p class=int>10. Dai un corpo al tuo giudice</p><p class=st>Un robot senza sesso, con la calotta cranica aperta, composto di mille ingranaggi, parla lentamente con una voce metallica né alta né bassa. Mi fissa e mi giudica coi suoi occhi di ghiaccio, di ferro ghiacciato, dall’alto in basso ma senza una vera direzione. Sta accanto alla cattedra, fermo in piedi.</p><p>Ha paura del disordine e dell’esposizione, l’esposizione agli altri, alle intemperie, al pubblico ludibrio, agli attacchi della sorte o degli approfittatori o dei disperati.</p><p>Mi vuole proteggere da me stesso, da mia madre, da mio padre.</p><p>Si allontana levitando senza darmi le spalle, accelerando sempre di più e scomparendo nella tromba delle scale.</p><p class=int>Quella volta in cui sono stato un angelo: 11. Temperance</p><p class=st>Tutto faceva pensare a una catastrofe. Era la Vigilia di Natale e in famiglia, ai vari capi degli apparecchi telefonici, ci si scrutava nel silenzio e si affilavano le lame.</p><p>Ogni mezzora qualche apparecchio suonava, vibrava nervosamente, indispettito, pungente, sordamente aggressivo, e portava nuove rimostranze, promesse di ripicca, di rivalsa, di vendetta.</p><p>La maggiore delle sorelle non poteva tollerare che la cena della Vigilia si tenesse in casa della minore. In realtà non avrebbe mai potuto tollerare che si tenesse in una casa che non era la sua. La minore, in un moto di ribellione, aveva deciso di non indietreggiare di un sol passo, teneva il punto ed era pronta a uno scontro aperto, costasse quel che costasse. La mediana aveva sperato fino all’ultimo di non dover intervenire, e soltanto in tarda mattinata, tirata di qua e di là a viva forza, aveva dovuto intervenire, e l’aveva fatto scontentando entrambe le sorelle.</p><p>Nel frattempo la figlia della maggiore, che fino a quella mattina aveva mostrato una calma e un’apertura di spirito quasi esemplari, assolutamente estranee alla sua abituale postura intransigente e sovvertitrice, aveva decretato di averne abbastanza e di essere pronta a non venire se la cena si fosse tenuta da sua madre, di cui riteneva di aver tollerato ormai fin troppe eccentriche e ingiustificate pretese.</p><p>Il figlio della sorella maggiore leggeva i messaggi sempre più sporadici e taglienti della chat di famiglia, e quelli sempre più numerosi, frequenti, lunghi e inappellabili nelle chat private con i singoli membri della famiglia. I cugini chiedevano aiuto, disperavano. La sorella chiedeva conforto, comprensione, prove di alleanza e fratellanza. Le zie reclamavano un intervento. E infine la madre, dopo una cascata di messaggi dai toni sempre più definitivi, chiamò.</p><p>Lui nicchiò, temporeggiò, fu sul punto di scagliare il telefono fuori dalla finestra e chiudere le trasmissioni con l’esterno. Ma alla fine decise di rispondere, di provare ad armarsi di pazienza e intelligenza tattica.</p><p>«Pronto, ma’».</p><p>Fece appello alla possibilità di rientrare in un senso della misura.</p><p>Chiese alla madre di accettare di venire a cena dalla zia e di svolgere la tradizionale cena a casa sua l’indomani, chiamò la zia e le chiese se fosse disponibile a concedere una merenda travestita da cena domani in cambio della vittoria di oggi, fece la chiamata più delicata, quella alla sorella, chiedendole di apprezzare il passo indietro della madre che, nonostante tutte l
